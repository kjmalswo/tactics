function buildPanel(){const s=FC.state();return `<div class="workspace-heading"><div><span class="kicker">${esc(T.build)}</span><h1>${esc(T.workshopTitle)}</h1><p>${esc(T.workshopSub)}</p></div><div class="workshop-switch">${button('workshop-tab',T.workshopEquipment,{id:'equipment'},workshopTab==='equipment'?'selected':'')}${button('workshop-tab',T.workshopTalents,{id:'talents'},workshopTab==='talents'?'selected':'')}</div></div>${workshopTab==='talents'?talentPanel():`<div class="equipped-bar"><div class="equipped-caption"><strong>${esc(T.equippedTitle)}</strong><small>${esc(T.buildWeak)}</small></div><div class="equipped-slots">${s.loadout.map((id,i)=>{const m=find(DB.modules,id),p=m&&FC.moduleProfile(id);return `<div class="equipped-slot ${i===slot?'selected':''}">${button('slot',`<span class="slot-number">${i+1}</span><span><strong>${esc(m?.name||T.emptySlot)}</strong><small>${esc(i===slot?T.selectedSlot:m?DB.forge.rankNames[p.rank-1]:T.slotSelect)}</small></span>`,{index:i},'',false)}${id?`<button data-action="unequip" data-index="${i}" class="clear-slot" title="${esc(T.clearSlot)}" aria-label="${esc(T.clearSlot)}" ${s.activeBout?'disabled':''}>${icon('close')}</button>`:''}</div>`;}).join('')}</div></div><div class="workshop-layout"><section class="item-catalog"><div class="mobile-item-summary"><span>${esc(find(DB.modules,selectedItem)?.name||T.selectItem)}</span>${button('item-open',T.gearDetail)}</div><nav class="item-filters" aria-label="${esc(T.gear)}">${DB.forge.categories.map(c=>button('item-filter',`${icon(c.icon)}${esc(c.name)}`,{id:c.id},itemFilter===c.id?'selected':'')).join('')}</nav><div class="item-grid">${DB.modules.filter(m=>itemFilter==='all'||itemFilter==='owned'&&s.ownedModules[m.id]||m.category===itemFilter).map(m=>{const rank=s.ownedModules[m.id]||0,equipped=s.loadout.includes(m.id),cat=find(DB.forge.categories,m.category),rows=effectRows(m.stats),good=rows.find(r=>r.good),bad=rows.find(r=>!r.good);return `<button class="item-card ${selectedItem===m.id?'selected':''} ${equipped?'equipped':''}" data-action="item" data-id="${m.id}"><span class="catalog-icon">${icon(cat.icon)}</span><span class="item-card-title"><strong>${esc(m.name)}</strong><small>${esc(cat.name)} · ${esc(rank?DB.forge.rankNames[rank-1]:T.empty)}</small></span><span class="item-card-effects">${good?`<span class="gain">${esc(DB.statLabels[good.stat])} ${esc(good.text)}</span>`:''}${bad?`<span class="loss">${esc(DB.statLabels[bad.stat])} ${esc(bad.text)}</span>`:''}</span><span class="item-card-foot"><small>${esc(equipped?T.equippedItem:rank?T.ownedItem:m.cost+' '+T.coins)}</small><span>${icon('chevron')}</span></span></button>`;}).join('')}</div>${resonancePanel()}${buildSlots()}</section>${itemInspector()}</div>`}`;}
function reportStats(metrics,name){return `<section class="card"><h3>${esc(name)}</h3><dl>${[['damage',Math.round(metrics.damage)],['counters',metrics.counters],['throws',metrics.throws],['breaks',metrics.breaks],['clashes',metrics.clashes||0],['procs',metrics.procs||0]].map(([k,v])=>`<dt>${esc(T[k])}</dt><dd>${v}</dd>`).join('')}</dl></section>`;}
function showReport(report){closeModal();scene='report';header();const outcome=report.outcome==='win'?T.resultWin:report.outcome==='loss'?T.resultLoss:T.resultDraw,from=rankName(report.from),to=rankName(report.to);$('view').innerHTML=`<div class="result-page"><section class="result-banner"><span class="kicker">${esc(report.opponent)} · ${esc(T[report.reason]||report.reason)}</span><h1>${esc(outcome)}</h1><div class="rank-result ${from!==to?'new-rank':''}">${esc(from===to?to:from+' → '+to)}</div><div class="rewards"><div><strong>+${report.coins}</strong><small>${esc(T.coins)}</small></div><div><strong>+${report.xp}</strong><small>${esc(T.xp)}</small></div><div><strong>+${report.points}</strong><small>${esc(T.points)}</small></div></div>${report.first?tag(T.first,'positive'):''}<p class="compact-note">${esc(T.kept)}</p><div class="button-row" style="justify-content:center">${button('train-home',T.spendPoints)}${button('prepare',T.rematch,{id:report.rivalId})}${button('next-match',T.nextMatch,{},'primary')}</div></section><div class="result-stats">${reportStats(report.stats,FC.state().name)}${reportStats(report.foeStats,T.opponent)}</div><section class="card"><h3>${esc(T.bestMoment)}</h3><div class="moments">${report.moments.map(e=>`<div>${time(e.time)} · ${esc(e.text)}</div>`).join('')||esc(T.empty)}</div></section></div>`;}
function time(v){const secs=Math.max(0,Math.ceil(v));return `${Math.floor(secs/C.secondsPerMinute)}:${String(secs%C.secondsPerMinute).padStart(2,'0')}`;}
function settings(){openModal('settings',`${closeButton()}<span class="kicker">${esc(T.home)}</span><h2 id="modal-title">${esc(T.settings)}</h2><div class="settings-sections"><section class="settings-section"><h3>${icon('moon')}${esc(DB.theme.labels.settingsView)}</h3><label class="check-row"><span>${esc(T.sound)}</span><input type="checkbox" data-pref="sound" ${prefs.sound?'checked':''}></label><label class="check-row"><span>${esc(T.reduced)}</span><input type="checkbox" data-pref="reduced" ${prefs.reduced?'checked':''}></label>${button('fullscreen',`${icon('fullscreen')}${esc(T.fullscreen)}`,{},'full')}</section><section class="settings-section"><h3>${icon('scroll')}${esc(DB.theme.labels.settingsArchive)}</h3><div class="utility-grid">${button('export',`${icon('save')}${esc(T.save)}`,{},'',!FC.state())}${button('load',`${icon('load')}${esc(T.load)}`)}${FC.state()?button('records',`${icon('scroll')}${esc(T.recordButton)}`)+button('rename',`${icon('rename')}${esc(T.profileName)}`):''}</div></section></div><details class="settings-advanced"><summary>${esc(DB.theme.labels.settingsAdvanced)}</summary>${button('db',`${icon('scroll')}${esc(DB.theme.labels.contentEditor)}`)}</details><div class="settings-danger"><small>${esc(DB.theme.labels.resetCaption)}</small>${button('new-game',T.newGame,{},'danger')}</div>`);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'});else toast(T.fullscreenHint);renderer?.resize();}catch{toast(T.fullscreenHint);}}
function dbModal(){openModal('db',`${closeButton()}<h2 id="modal-title">${esc(T.db)}</h2><p>${esc(T.dbHelp)}</p><textarea id="db-editor" spellcheck="false"></textarea><small id="db-status"></small><div class="button-row">${button('validate',T.validate)}${button('db-export',T.dbExport)}${button('html-export',T.htmlExport,{},'primary')}</div>`);$('db-editor').value=JSON.stringify(DB,null,2);}
function validateEditor(){try{const value=JSON.parse($('db-editor').value),errors=FC.validate(value);if(errors.length)throw Error(errors.join('\n'));$('db-status').textContent=T.valid;return value;}catch(error){$('db-status').textContent=error.message;return null;}}
function exportHTML(data){const root=document.documentElement.cloneNode(true),script=root.querySelector('#game-db');script.removeAttribute('src');script.textContent='window.GAME_DB = '+JSON.stringify(data,null,2).replace(/</g,'\\u003c')+';';root.querySelector('#view').innerHTML='';root.querySelector('#modal-backdrop').hidden=true;root.querySelector('#modal').innerHTML='';download('<!doctype html>\n'+root.outerHTML,'text/html;charset=utf-8',T.htmlName);}
function newGame(){openModal('reset',`<h2 id="modal-title">${esc(T.newTitle)}</h2><p>${esc(T.newBody)}</p><div class="button-row">${button('close',T.cancel)}${button('export',T.save,{},'',!FC.state())}${button('reset-confirm',T.confirmReset,{},'danger')}</div>`);}
function recordsPanel(){return FC.state().history.length?`<h2>${esc(T.records)}</h2><table class="table"><thead><tr><th>${esc(T.opponent)}</th><th>${esc(T.reward)}</th><th>${esc(T.damage)}</th><th></th></tr></thead><tbody>${FC.state().history.map(r=>`<tr><td>${esc(r.opponent)}<br><small>${esc(T[r.outcome==='win'?'resultWin':r.outcome==='loss'?'resultLoss':'resultDraw'])}</small></td><td>+${r.coins} ${esc(T.coins)}</td><td>${Math.round(r.stats.damage)}</td><td>${button('report',T.records,{id:r.id})}</td></tr>`).join('')}</tbody></table>`:`<div class="card empty">${esc(T.historyEmpty)}</div>`;}
function header(){document.body.dataset.scene=scene;const s=FC.state();$('brand').innerHTML=`<span class="brand-seal">${icon('brand')}</span><span class="brand-type"><strong>${esc(DB.meta.title)}</strong><small>${esc(DB.meta.subtitle)}</small></span>`;$('header-profile').innerHTML=s?`${icon('rank')}<span>${esc(s.name)}</span><b>${esc(FC.getRank().name)}</b>`:'';$('header-tools').innerHTML=(s?button('home',`${icon('home')}<span>${esc(T.home)}</span>`,{},'header-link')+(active?button('resume',`${icon('resume')}<span>${esc(T.backToRing)}</span>`,{},'primary header-link'):''):'')+`<button data-action="fullscreen" class="header-icon" title="${esc(T.fullscreen)}" aria-label="${esc(T.fullscreen)}">${icon('fullscreen')}</button>`+button('settings',`${icon('settings')}<span>${esc(T.settings)}</span>`,{},'header-link');}
function showSelection(){scene='select';header();const ch=find(DB.characters,chosen);$('view').innerHTML=`<div class="page selection-page"><div class="page-heading"><div><span class="kicker">${esc(DB.meta.subtitle)}</span><h1>${esc(T.selectCharacter)}</h1><p>${esc(T.chooseNote)}</p></div></div><div class="select-layout"><div class="character-grid">${DB.characters.map(h=>`<button class="character-card ${h.id===chosen?'selected':''}" data-action="select-character" data-id="${h.id}"><div>${portrait(h.id)}</div><div class="char-label"><strong>${esc(h.name)} ${tag(DB.styles[h.style].name)}</strong><small>${esc(h.signature.name)}</small></div></button>`).join('')}</div><aside class="card character-preview"><div class="portrait">${portrait(ch.id)}</div><span class="kicker">${esc(ch.epithet)}</span><h2>${esc(ch.name)}</h2><div class="signature-intro"><small>${esc(T.iconicMove)}</small><strong>${esc(ch.signature.name)}</strong><p>${esc(ch.signature.hint)}</p></div><div class="strength-pair"><div><span>${esc(T.strengthShort)}</span><b>${esc(ch.strength)}</b></div><div><span>${esc(T.weaknessShort)}</span><b>${esc(ch.weakness)}</b></div></div>${button('contract',`${esc(ch.name)} · ${T.choose}`,{},'primary full')}<details class="compact-note"><summary>${esc(T.background)}</summary><p>${esc(ch.story)}</p><p>${esc(DB.world.body)}</p></details></aside></div></div>`;}
function profileCard(){const s=FC.state(),h=hero(),p=FC.progress();return `<section class="guild-identity"><div class="guild-avatar">${portrait(h.id)}</div><div class="guild-name"><small>${esc(T.dashboardHero)} · ${esc(h.epithet)}</small><h2>${esc(s.name)} <span>${esc(p.rank.name)}</span></h2><small>${s.wins}${esc(T.wins)} ${s.losses}${esc(T.losses)}</small></div><div class="guild-progress"><small>${p.next?`${esc(T.nextRank)} ${esc(p.next.name)} · ${p.earned}/${p.total}`:T.maxRank}</small><div class="bar"><i style="width:${p.ratio*C.percent}%"></i></div></div><div class="guild-wallet"><div>${icon('coins')}<span><strong>${s.coins}</strong><small>${esc(T.coins)}</small></span></div>${button('train-home',`${icon('training')}<span><strong>${s.points}</strong><small>${esc(T.points)}</small></span>`,{},'points-wallet')}</div></section>`;}
function matchesPanel(){const s=FC.state();if(!s.rivals[rivalId]?.open)rivalId=nextRival();const r=FC.previewRival(rivalId),m=matchup(r.character),f=G.focusDef(r.tactics.focus),t=s.tactics;return `<div class="workspace-heading"><div><span class="kicker">${esc(T.dashboardProgress)} · ${DB.rivals.filter(x=>s.rivals[x.id].wins).length}/${DB.rivals.length} ${esc(T.winsProgress)}</span><h1>${esc(T.dashboardTitle)}</h1><p>${esc(T.dashboardSub)}</p></div>${button('records',`${icon('scroll')}${T.ledger}`)}</div><div class="duel-dashboard"><section class="card scout-card"><div class="scout-portrait">${portrait(r.character)}</div><div class="scout-heading"><span class="kicker">${esc(r.name)}</span><h2>${esc(r.hero.name)} <small>${esc(rankName(r.level))}</small></h2><div>${tag(DB.styles[r.hero.style].name)}${tag(m.name,m.cls)}${tag(find(DB.tactics.defenses,r.tactics.defense).name)}</div></div><div class="scout-body"><div class="scout-intent"><span>${esc(T.scoutHabit)}</span><strong>${icon(f.icon)}${esc(f.name)}<small>${esc(f.short)}</small></strong></div><p>${esc(r.scout.habit)}</p><div class="scout-weakness"><small>${esc(T.scoutWeak)}</small><strong>${esc(r.scout.weakness)}</strong></div><div class="scout-equipment"><small>${esc(T.scoutGear)}</small><div>${r.modules.length?r.modules.map(entry=>tag(FC.moduleProfile(typeof entry==='string'?entry:entry.id).def.name)).join(''):esc(T.noFoeGear)}</div>${r.modules.length?`<details class="foe-gear-details"><summary>${esc(T.foeGearDetails)}</summary>${r.modules.map(entry=>{const profile=FC.moduleProfile(typeof entry==='string'?entry:entry.id,typeof entry==='string'?1:entry.rank,typeof entry==='string'?null:entry.forge);return `<section><h4>${esc(profile.def.name)}</h4>${effects(profile.stats)}<p>${profile.traits.map(id=>esc(DB.traits[id].description)).join('<br>')}</p></section>`;}).join('')}</details>`:''}</div></div><div class="scout-actions">${button('counter-plan',`${icon('compare')}${T.counterApply}`,{id:rivalId},'',!!s.activeBout)}${button(active?'resume':'start',`${icon('fight')}${active?T.resume:T.battleReady}`,{id:rivalId},'primary')}<small>${esc(T.planOptional)}</small></div></section><aside class="card departure-plan"><div class="section-heading"><h2>${esc(T.dashboardPlan)}</h2>${tag(s.activeBout?T.inBattle:T.readiness,s.activeBout?'':'positive')}</div><h4>${esc(T.focusTitle)}</h4>${focusChoices(t.focus,'home-focus')}<details class="advanced-plan"><summary>${esc(T.advancedTactics)}</summary>${detailTactics(t,'home-tactic',!!s.activeBout)}</details><p class="plan-caption">${esc(find(DB.tactics.focuses,t.focus).description)}</p>${rpsLegend()}<div class="departure-build"><div class="section-heading"><h3>${esc(T.dashboardBuild)}</h3>${button('tab',T.editBuild,{id:'build'})}</div>${s.loadout.map(id=>{const m=find(DB.modules,id),profile=m&&FC.moduleProfile(id);return `<div>${icon(m?find(DB.forge.categories,m.category).icon:'gear')}<strong>${esc(m?.name||T.emptySlot)}</strong><small>${esc(m?DB.forge.rankNames[profile.rank-1]:'')}</small></div>`;}).join('')}${FC.resonances().filter(x=>x.active).map(x=>`<p class="active-resonance">${esc(x.name)} · ${esc(T.resonanceActive)}</p>`).join('')}</div></aside></div><section class="league-map"><div class="section-heading"><h3>${esc(T.leagueTable)}</h3><small>${esc(T.leagueCaption)}</small></div><div class="league-route">${DB.rivals.map((r,i)=>{const record=s.rivals[r.id],h=find(DB.characters,r.character);return button('rival',`<span>${i+1}</span><strong>${esc(h.name)}</strong><small>${esc(record.wins?T.winsProgress:record.open?T.battleReady:T.locked)}</small>`,{id:r.id},r.id===rivalId?'selected':record.wins?'cleared':'',!record.open);}).join('')}</div></section>`;}
function home(nextTab=tab){if(!FC.state()){showSelection();return;}scene='home';tab=DB.tabs.some(t=>t.id===nextTab)?nextTab:'fight';closeModal();save();header();$('view').innerHTML=`<div class="dashboard-shell">${profileCard()}<nav class="guild-nav" aria-label="${esc(T.home)}">${DB.tabs.map(t=>button('tab',`${icon(t.icon)}<span><strong>${esc(T[t.label])}</strong><small>${esc(T[t.hint])}</small></span>${t.id==='training'&&FC.state().points?`<b>${FC.state().points}</b>`:''}`,{id:t.id},tab===t.id?'active':'')).join('')}</nav><section class="guild-content">${tab==='fight'?matchesPanel():tab==='training'?trainingPanel():buildPanel()}</section></div>`;}
function hudActor(a,side){return `<section class="fighter-hud ${side==='foe'?'foe':''}"><div class="head-art">${portrait(a.characterId)}</div><div class="fighter-data"><div class="fighter-heading"><div class="fighter-name"><small>${esc(side==='player'?T.yourFighter:T.opponent)}</small><strong>${esc(a.name)}</strong></div><span id="${side}-hp-number" class="hp-label"></span></div><div class="bar health"><i id="${side}-hp"></i></div><div class="minor-bars">${['stamina','guard'].map(key=>`<div><small>${esc(T[key])}<b id="${side}-${key}-number"></b></small><div class="bar ${key}"><i id="${side}-${key}"></i></div></div>`).join('')}</div><div class="identity-line"><span id="${side}-identity"></span><small id="${side}-charge"></small></div></div></section>`;}
function coachButtons(){const h=hero();return `<div class="coach-buttons">${DB.coaching.map((c,i)=>`<button data-action="coach" data-id="${c.id}" class="coach-call" aria-pressed="false"><span class="coach-icon">${icon(c.id)}</span><span class="coach-copy"><strong>${esc(c.name)}</strong><small>${esc(DB.tactics.callDescriptions[c.id])}</small></span><kbd>${i+1}</kbd><em class="selected-mark">${esc(T.current)}</em></button>`).join('')}</div>`;}
function fightView(){scene='fight';closeModal();header();const s=G.state();$('view').innerHTML=`<div class="fight-page active-ring"><div class="fight-top">${hudActor(s.player,'player')}<div class="timer"><span class="timer-crest">${icon('brand')}</span><small id="round-label"></small><span id="round-clock"></span></div>${hudActor(s.foe,'foe')}</div><section class="arena-card"><div class="arena-toolbar"><span class="arena-caption">${icon('brand')}<strong>${esc(DB.theme.labels.arenaTitle)}</strong><small>${esc(T.basicAI)}</small></span><div class="arena-controls"><div class="arena-speed" role="group" aria-label="${esc(T.speed)}">${DB.speeds.map(v=>button('speed',v.label,{value:v.value},speed===v.value?'selected':'')).join('')}</div>${button('pause',`${icon('pause')}<span>${esc(T.pause)}</span>`,{},'arena-pause')}</div></div><div class="arena-wrap"><canvas id="arena" aria-label="${esc(T.arenaLabel)}"></canvas><div class="combat-flash" id="combat-flash" role="status"></div><div class="round-intermission" id="round-intermission" hidden><strong>${esc(T.cornerAuto)}</strong><span id="break-clock"></span></div></div><div class="tactic-readout"><div class="foe-read"><small>${esc(T.foePlan)}</small><strong id="foe-focus"></strong><span id="foe-shift"></span></div><div class="clash-read"><small>${esc(T.rpsWins)}</small><strong id="clash-readout"></strong></div><div class="history-read"><small>${esc(T.recentMoves)}</small><span id="move-history"></span></div></div><div class="live-intent"><div><span class="intent-dot"></span><strong id="current-command"></strong><span id="flow-state"></span></div><small id="distance"></small></div></section><section class="coach-dock"><div class="coach-heading"><strong>${icon('scroll')}${esc(DB.theme.labels.commandTitle)}</strong><small id="transition"></small></div><div class="live-focus"><span>${esc(T.focusTitle)}</span>${focusChoices(s.player.tactical.focus,'focus')}${button('tactics',`${icon('settings')}<span>${esc(T.liveTactics)}</span>`,{},'live-details')}</div><div class="coach-command-row">${coachButtons()}<div class="signature-panel"><button id="signature-button" data-action="signature"><span class="signature-seal">${icon('signature')}</span><span class="signature-copy"><small id="signature-meter"></small><strong>${esc(hero().signature.name)}</strong><span id="signature-state"></span></span><span class="signature-gauge"><b id="signature-count"></b><span class="bar"><i id="signature-fill"></i></span></span><kbd>4</kbd></button></div></div><div class="coach-consequence"><span id="command-result"></span><small id="coach-hint"></small><p class="live-advice" id="advice"></p></div></section></div>`;renderer=new window.DuelRenderer($('arena'));updateFight();renderer.render();save();}
function startFight(id=nextRival()){if(active){resume();return;}const prepared=FC.prepare(id);if(!result(prepared))return;const begun=G.start(prepared.bout);if(!begun.ok){FC.cancel();save();toast(begun.message,true);return;}active=true;paused=false;lastFlash=-1;fightView();}
function setHomeTactics(change){if(FC.state().activeBout){toast(T.planLocked,true);return;}const r=FC.setTactics({...FC.state().tactics,...change});if(result(r))home('fight');}
function changeFocus(id){if(!active||modalKind)return;const r=G.tactical({focus:id});if(result(r)){FC.setTactics({...FC.state().tactics,focus:id});save();updateFight();}}
function tacticalModal(){if(!active)return;tacticalDraft=clone(G.state().player.pending?.tactical||G.state().player.tactical);renderTacticalModal();}
function renderTacticalModal(){openModal('tactics',`${closeButton()}<span class="kicker">${esc(T.tacticsPaused)}</span><h2 id="modal-title">${esc(T.tacticalTitle)}</h2>${focusChoices(tacticalDraft.focus,'tactic-focus')}${detailTactics(tacticalDraft,'tactic-option')}${rpsLegend()}<p class="compact-note">${esc(T.rpsExplain)}</p>${button('tactics-apply',T.applyTactics,{},'primary full')}`);}
function updateTacticalReadout(s){const read=G.scouting(),p=s.player;$('foe-focus').innerHTML=icon(read.focus.icon)+esc(read.focus.name);$('foe-shift').textContent=read.pending?`${T.foeChanging} ${T.statArrow} ${read.pending.name}`:`${read.defense} · ${T.counterHint}: ${read.counter.name}`;$('move-history').innerHTML=read.history.map(f=>`<b data-type="${esc(f.id)}">${esc(f.name)}</b>`).join('');const clash=$('clash-readout');clash.textContent=read.clash?(read.clash.side==='player'?T.clashMine:T.clashFoe)+' · '+read.clash.name:T.clashWaiting;clash.className=read.clash?(read.clash.side==='player'?'gain':'loss'):'';for(const b of $('view').querySelectorAll('[data-action="focus"]')){b.classList.toggle('selected',p.tactical.focus===b.dataset.id);b.classList.toggle('queued',p.pending?.tactical?.focus===b.dataset.id&&p.tactical.focus!==b.dataset.id);b.setAttribute('aria-pressed',String(p.tactical.focus===b.dataset.id));}const details=$('view').querySelector('.live-details');if(details)details.title=find(DB.tactics.ranges,p.tactical.range).name+' · '+find(DB.tactics.defenses,p.tactical.defense).name;}
function call(id){if(!active||modalKind)return;const r=G.coach(id);if(result(r)){FC.setCall(id);save();updateFight();}}
function signature(){if(!active||modalKind)return;const r=G.armSignature();if(result(r)){save();updateFight();}}
function stateName(a,s){if(a.brokenUntil>s.elapsed)return T.broken;if(a.exposedUntil>s.elapsed)return T.exposed;if(a.stamina/a.base.stamina<C.lowStamina)return T.fatigued;return T[a.flow]||T.flowHold;}
function updateFight(){if(scene!=='fight'||!active||!$('arena'))return;const s=G.state(),a=s.player;for(const [side,actor]of [['player',a],['foe',s.foe]]){for(const key of ['hp','stamina','guard']){$(side+'-'+key).style.width=`${Math.max(0,actor[key]/actor.base[key]*C.percent)}%`;$(side+'-'+key+'-number').textContent=key==='hp'?`${Math.ceil(actor.hp)}/${actor.base.hp}`:Math.ceil(actor[key]);}const identity=G.identityInfo(actor);$(side+'-identity').textContent=actor.procNotice?.until>s.elapsed?T.procLabel+' · '+actor.procNotice.name:identity.label;$(side+'-identity').classList.toggle('active',identity.ratio>0);$(side+'-charge').textContent=`${identity.meter} ${Math.floor(actor.focus)}/${C.signatureCost}`;}
$('round-label').textContent=`${s.round} / ${C.rounds} ${T.round}`;$('round-clock').textContent=time(s.clock);$('distance').textContent=`${number(Math.hypot(a.x-s.foe.x,a.y-s.foe.y))}${T.meters}`;const h=hero(),queued=a.pending?.call;$('current-command').textContent=G.focusDef(a.tactical.focus).name+' · '+find(DB.coaching,a.activeCall).name;$('flow-state').textContent=stateName(a,s);$('transition').textContent=queued?`${T.coachPending} · ${number(Math.max(0,a.pending.at-s.elapsed))}${T.seconds}`:T[a.plan.pace==='calm'?'hintRecoverActive':'coachShort'];for(const b of $('view').querySelectorAll('[data-action="coach"]')){const id=b.dataset.id;b.classList.toggle('selected',a.activeCall===id);b.setAttribute('aria-pressed',String(a.activeCall===id));b.classList.toggle('queued',queued===id);b.disabled=s.phase==='fighting'&&a.changeReady>s.elapsed;}
$('command-result').textContent=G.commandFeedback(a);$('coach-hint').textContent=G.focusDef(a.pending?.tactical?.focus||a.tactical.focus).description;updateTacticalReadout(s);const info=G.signatureInfo(a),ready=a.focus>=C.signatureCost&&a.signatureReadyAt<=s.elapsed;$('signature-meter').textContent=h.signature.meter;$('signature-count').textContent=`${Math.floor(a.focus)} / ${C.signatureCost}`;$('signature-fill').style.width=`${Math.min(C.percent,a.focus/C.signatureCost*C.percent)}%`;const btn=$('signature-button');btn.disabled=!a.signatureOrder&&!ready||s.phase!=='fighting';btn.classList.toggle('ready',ready);btn.classList.toggle('armed',!!a.signatureOrder);btn.title=h.signature.hint;btn.setAttribute('aria-label',h.signature.name+' · '+h.signature.hint);$('signature-state').textContent=a.signatureOrder?`${T[info.reason]||T.signatureSeeking} · ${T.signatureCancel}`:ready?T.signatureArm:h.signature.hint;const adviceKey=G.advice();$('advice').textContent=T[adviceKey];$('advice').hidden=adviceKey==='hintDefault';$('coach-hint').hidden=adviceKey!=='hintDefault';$('round-intermission').hidden=s.phase!=='corner';$('break-clock').textContent=number(s.breakLeft??C.cornerSeconds)+T.seconds;
const flash=s.events.find(e=>DB.flashEvents.includes(e.key));if(flash&&flash.id>lastFlash){lastFlash=flash.id;$('combat-flash').textContent=flash.text;}else if(!flash||s.elapsed-flash.time>C.flashSeconds)$('combat-flash').textContent='';}
function resume(){if(!active){home();return;}paused=false;if(scene!=='fight')fightView();else closeModal();}
function finish(){if(!active||G.state().phase!=='ended')return;const r=FC.settle(G.state());if(!result(r))return;active=false;save();sound('reward');showReport(r.report);}
function pauseMenu(){if(!active)return;paused=true;openModal('pause',`<h2 id="modal-title">${esc(T.pause)}</h2><div class="button-row">${button('resume',T.resume,{},'primary')}${button('home',T.home)}${button('export',T.save)}${button('rules',T.rules)}${button('surrender',T.surrender,{},'danger')}</div>`);}
function askSurrender(){openModal('surrender',`<h2 id="modal-title">${esc(T.surrenderAsk)}</h2><p>${esc(T.surrenderBody)}</p><div class="button-row">${button('close',T.cancel)}${button('confirm-surrender',T.surrender,{},'danger')}</div>`);}
document.addEventListener('click',event=>{const el=event.target.closest?.('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=el.dataset.id,index=Number(el.dataset.index);if(action==='select-character'){chosen=id;showSelection();}if(action==='contract'){if(FC.state()){toast(T.profileLocked,true);return;}if(result(FC.create(chosen,'',legacy))){if(legacy)toast(T.legacy);legacy=null;try{localStorage.setItem(C.migrationKey,'1');}catch{}home('fight');}}if(action==='home')home();if(action==='tab')home(id);if(action==='rival'){rivalId=id;home('fight');}if(action==='start'||action==='prepare')startFight(id);if(action==='next-match')startFight(nextRival());if(action==='train-home')home('training');if(action==='train')result(FC.train(id),()=>home('training'));if(action==='respec')result(FC.respec(),()=>home('training'));if(action==='slot'){slot=index;if(FC.state().loadout[index])selectedItem=FC.state().loadout[index];home('build');}if(action==='talent-slot'){talentSlot=index;home('build');}if(action==='buy')result(FC.buy(id),refreshWorkshop);if(action==='upgrade')result(FC.upgrade(id,el.dataset.forge),refreshWorkshop);if(action==='equip')result(FC.equip(slot,id),refreshWorkshop);if(action==='unequip')result(FC.equip(index,null),refreshWorkshop);if(action==='talent')result(FC.setTalent(talentSlot,id),refreshWorkshop);if(action==='item-open')openItemInspector();if(action==='workshop-tab'){workshopTab=id;home('build');}if(action==='item-filter'){itemFilter=id;home('build');}if(action==='item'){selectedItem=id;home('build');if(smallWorkbench())openItemInspector();else $('item-detail')?.scrollIntoView({behavior:prefs.reduced?'instant':'smooth',block:'nearest'});}if(action==='buy-equip')result(FC.buyEquip(slot,id),refreshWorkshop);if(action==='forge'||action==='master')result(FC.upgrade(id,el.dataset.forge),refreshWorkshop);if(action==='reforge')result(FC.reforge(id,el.dataset.forge),refreshWorkshop);if(action==='build-save')result(FC.saveBuild(index),refreshWorkshop);if(action==='build-apply')result(FC.applyBuild(index),refreshWorkshop);if(action==='home-focus')setHomeTactics({focus:id});if(action==='home-tactic')setHomeTactics({[el.dataset.key]:el.dataset.value});if(action==='counter-plan'){const rival=FC.previewRival(id);if(result(FC.setTactics(G.focusDef(rival.tactics.focus).counterPlan))){home('fight');toast(T.counterApplied);}}if(action==='focus')changeFocus(id);if(action==='tactics')tacticalModal();if(action==='tactic-focus'){tacticalDraft.focus=id;renderTacticalModal();}if(action==='tactic-option'){tacticalDraft[el.dataset.key]=el.dataset.value;renderTacticalModal();}if(action==='tactics-apply'){const r=G.tactical(tacticalDraft);if(result(r)){FC.setTactics(tacticalDraft);save();closeModal();paused=false;updateFight();}}if(action==='coach')call(id);if(action==='signature')signature();if(action==='pause')pauseMenu();if(action==='resume')resume();if(action==='speed'){speed=Number(el.dataset.value);for(const b of document.querySelectorAll('[data-action="speed"]'))b.classList.toggle('selected',Number(b.dataset.value)===speed);}if(action==='surrender')askSurrender();if(action==='confirm-surrender'){G.surrender();finish();}if(action==='settings')settings();if(action==='close'){closeModal();paused=false;}if(action==='fullscreen')fullscreen();if(action==='export')exportSave();if(action==='load')$('load-file').click();if(action==='new-game')newGame();if(action==='reset-confirm'){active=false;legacy=null;FC.reset();try{localStorage.removeItem(C.storageKey);localStorage.setItem(C.migrationKey,'1');}catch{}closeModal();showSelection();}if(action==='rules')openModal('rules',`${closeButton()}<h2 id="modal-title">${esc(T.rules)}</h2><p>${esc(T.rulesBody)}</p><p>${esc(T.coachHint)}</p><div class="signature-intro"><strong>${esc(hero()?.signature.name||T.signature)}</strong><p>${esc(hero()?.signature.hint||'')}</p></div>`);if(action==='rename')openModal('rename',`${closeButton()}<h2 id="modal-title">${esc(T.profileName)}</h2><input id="new-name" maxlength="${C.nameLength}" value="${esc(FC.state().name)}"><div class="button-row">${button('rename-confirm',T.saveName,{},'primary')}</div>`);if(action==='rename-confirm'){FC.setName($('new-name').value);closeModal();home();}if(action==='records')openModal('records',`${closeButton()}<h2 id="modal-title">${esc(T.records)}</h2>${recordsPanel()}`);if(action==='report'){const r=find(FC.state().history,id);if(r)showReport(r);}if(action==='db')dbModal();if(action==='validate')validateEditor();if(action==='db-export'){const data=validateEditor();if(data)download('window.GAME_DB = '+JSON.stringify(data,null,2).replace(/</g,'\\u003c')+';','text/javascript',T.dbName);}if(action==='html-export'){const data=validateEditor();if(data)exportHTML(data);}});
document.addEventListener('change',event=>{if(event.target.dataset.pref){prefs[event.target.dataset.pref]=event.target.checked;applyPrefs();}});
$('load-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;const before=FC.snapshot(),battle=G.snapshot(),wasActive=active;try{const imported=JSON.parse(await file.text());if(!imported.profile){if(imported.campaign){legacy=imported.campaign;active=false;FC.reset();closeModal();showSelection();toast(T.legacyChoose);return;}throw Error(T.invalidSave);}const loaded=FC.load(imported.profile);if(!loaded.ok)throw Error(loaded.message);active=false;if(imported.battle?.id===FC.state().activeBout&&imported.battle.player.characterId===FC.state().characterId)active=G.load(imported.battle).ok;if(!active&&FC.state().activeBout)FC.cancel();closeModal();save();home();toast(T.loadSuccess);}catch(error){if(before)FC.load(before);else FC.reset();if(battle)G.load(battle);active=wasActive;toast(error.message,true);}event.target.value='';});
document.addEventListener('keydown',event=>{if(event.target.closest?.('input,textarea,select'))return;if(event.key==='Tab'&&modalKind){const nodes=[...$('modal').querySelectorAll('button:not(:disabled),input,select,textarea')],first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}if(active&&scene==='fight'&&!modalKind&&!event.repeat){const cmd=DB.coaching.find(c=>c.key===event.code);if(cmd){event.preventDefault();call(cmd.id);}else if(event.code===C.signatureKey){event.preventDefault();signature();}}if(event.code==='Space'&&active&&scene==='fight'){event.preventDefault();if(!event.repeat){if(modalKind==='pause')resume();else if(!modalKind)pauseMenu();}}if(event.code==='Escape'&&modalKind){closeModal();paused=false;}});
window.addEventListener('resize',()=>renderer?.resize());window.visualViewport?.addEventListener('resize',()=>renderer?.resize());window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(active&&scene==='fight'&&!modalKind)pauseMenu();}});
try{const stored=JSON.parse(localStorage.getItem(C.storageKey)||'null');if(stored?.profile&&FC.load(stored.profile).ok){if(stored.battle?.id===FC.state().activeBout&&stored.battle.player.characterId===FC.state().characterId)active=G.load(stored.battle).ok;if(!active&&FC.state().activeBout)FC.cancel();rivalId=nextRival();}else{const old=JSON.parse(localStorage.getItem(C.legacyKey)||'null');if(old?.campaign&&localStorage.getItem(C.migrationKey)!=='1')legacy=old.campaign;}}catch{}
if(FC.state())home();else showSelection();
function frame(now){const dt=lastFrame?Math.min(C.maxFrame,(now-lastFrame)/C.milliseconds):0;lastFrame=now;if(active&&scene==='fight'&&!modalKind&&!paused&&['fighting','corner'].includes(G.state().phase)){let left=dt*speed;while(left>0){const step=Math.min(left,C.step);G.tick(step);left-=step;if(G.state().phase==='ended')break;}const sounds=[...new Set(G.state().sounds)];G.state().sounds=[];for(const kind of sounds)sound(kind);if(G.state().phase==='ended')finish();saveClock+=dt;if(saveClock>=C.saveInterval){saveClock=0;save();}}hudClock+=dt;if(active&&scene==='fight'){if(hudClock>=C.hudInterval){hudClock=0;updateFight();}renderer?.render();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);window.DuelUI={home,showSelection,startFight,resume,updateFight,call,signature,showReport,exportSave,save,frame,buildPanel,matchesPanel,tacticalModal,getRenderer:()=>renderer};
})();

</script></body></html>
