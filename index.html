  function upgradeUnit(id){const blocked=garageAllowed();if(blocked)return blocked;const def=find(D.units,id);if(!def)return result(false,'unknownUnit');if(!S.ownedUnits.includes(id))return result(false,'unitLocked');if(S.unitRanks[id]>=C.unitMaxRank)return result(false,'maxRank');const cost=getUnitCost(id,true);if(!canAfford(cost))return result(false,'insufficient');pay(cost);S.unitRanks[id]++;return result(true,'upgraded',{name:def.name});}
  function getUnitStats(id){const def=find(D.units,id);if(!def)return null;const support=getSupportStats(),ranks=Math.max(0,(S?.unitRanks[id]||C.unitStartRank)-C.unitStartRank);return {...clone(def),type:id,rank:S?.unitRanks[id]||C.unitStartRank,hp:Math.round(def.hp*(1+ranks*C.unitRankHp)*support.unitHp),damage:Math.round(def.damage*(1+ranks*C.unitRankDamage)*support.unitDamage)};}

  function cancelMission(id=S?.activeMissionId){if(!S||!S.activeMissionId)return result(true,'missionCancelled');if(id!==S.activeMissionId)return result(false,'invalidMission');S.activeMissionId=null;S.activeSectorId=null;return result(true,'missionCancelled');}
  function gainCareer(amount){S.career.xp+=amount;while(S.career.xp>=S.career.xpNext&&S.career.level<C.careerMaxLevel){S.career.xp-=S.career.xpNext;S.career.level++;S.career.xpNext=C.careerXpBase+(S.career.level-C.careerStartLevel)*C.careerXpGrowth;}}
  function getRank(level=S?.career.level??C.careerStartLevel){return D.ranks.filter(rank=>rank.minLevel<=level).at(-1)||D.ranks[0];}
  function getCareerProgress(){const level=S?.career.level??C.careerStartLevel,rank=getRank(level),next=D.ranks[D.ranks.indexOf(rank)+1];let earned=S?.career.xp||0,total=0;for(let step=rank.minLevel;step<(next?.minLevel??rank.minLevel);step++){const cost=C.careerXpBase+(step-C.careerStartLevel)*C.careerXpGrowth;total+=cost;if(step<level)earned+=cost;}return {rank,next,earned:next?Math.min(earned,total):0,total,percent:next?Math.min(1,earned/Math.max(1,total)):1};}
  function settleMission(battle){

    const victory=outcome==='victory',firstWin=victory&&S.sectors[sectorId].wins===0,oldLevel=S.career.level,wasOpen=new Set(D.sectors.filter(s=>S.sectors[s.id].status!=='locked').map(s=>s.id)),loot=resources(),income=resources(),base=resources(),total=resources();

  function grantMilestone(missionId,milestoneId){if(!S||S.activeMissionId!==missionId)return result(false,'invalidMission');const def=DB.operations?.milestones[milestoneId];if(!def)return result(false,'invalidMission');S.bankedMilestones??=[];const key=S.activeSectorId+':'+milestoneId;if(S.bankedMilestones.includes(key))return {ok:true,already:true};const from=S.career.level;credit(def.resources||{});gainCareer(def.xp||0);S.bankedMilestones.push(key);return {ok:true,resources:clone(def.resources),career:{from,to:S.career.level,xpGained:def.xp},name:def.title,message:def.description};}
  function snapshot(){return S?clone(S):null;}

  function migrateLegacyRun(legacy){

  function validateDB(db=DB){

  $('ops-map-stage').addEventListener('click',event=>{const mapUnit=event.target.closest('[data-map-unit]');if(mapUnit){const unit=G.getState().units.find(u=>u.id===mapUnit.dataset.mapUnit);focusedNode=unit.node;if(unit.faction==='player')selectedUnit=unit.id;render();return;}const button=event.target.closest('[data-node]');if(!button||!phaseOpen())return;focusedNode=button.dataset.node;const u=fleet(),result=u?G.orderUnit(u.id,focusedNode):{ok:false,message:D.text.noUnits};if(!result.ok)toast(result.message,true);save();render();});
  $('ops-fleets').addEventListener('click',event=>{const button=event.target.closest('[data-unit]');if(button){selectedUnit=button.dataset.unit;render();}});
  $('ops-guide').addEventListener('click',event=>{const command=event.target.closest('[data-op]'),stance=event.target.closest('[data-stance]'),action=event.target.closest('[data-support]'),unit=event.target.closest('[data-license]');if(command){if(command.dataset.op==='recommend')recommend();if(command.dataset.op==='close-guide')document.body.classList.remove('ops-guide-open');if(command.dataset.op==='cancel-order'){G.cancelOrder(selectedUnit);save();render();}if(command.dataset.op==='retreat'){openModal('retreat',`<h2 id="modal-title">${esc(D.text.retreat)}</h2><p class="lead">${esc(D.text.confirmRetreat)}</p><div class="modal-actions"><button class="secondary-button" data-menu="battle">${esc(T.cancel)}</button><button class="primary" data-menu="retreat">${esc(D.text.retreat)}</button></div>`);}}if(stance){G.setStance(selectedUnit,stance.dataset.stance);save();render();}if(unit){license=unit.dataset.license;render();}if(action){const result=G.useAction(action.dataset.support,selectedUnit,license);if(!result.ok)toast(result.message,true);else {flushAwards();save();sound();if(!finish())render();}}});
  $('ops-advance').addEventListener('click',()=>advance());$('ops-guide-toggle').addEventListener('click',()=>document.body.classList.toggle('ops-guide-open'));$('ops-center').addEventListener('click',()=>focusNode(focusedNode||G.guidance(selectedUnit).targetId));
  for(const [id,label,svg,callback]of [['ops-hub',D.text.back,'flag',()=>showHub()],['ops-help',D.text.help,'help',showHelp],['ops-settings',D.text.settings,'settings',()=>showSettings()],['ops-fullscreen',T.fullscreen,'maximize',toggleFullscreen]]){const el=$(id);el.title=label;el.setAttribute('aria-label',label);el.innerHTML=icon(svg);el.addEventListener('click',callback);}
  $('modal').addEventListener('click',event=>{const size=event.target.closest('[data-size]'),pref=event.target.closest('[data-pref]'),command=event.target.closest('[data-menu]');if(size){prefs.textSize=size.dataset.size;applyPreferences();showSettings();}if(pref){prefs[pref.dataset.pref]=!prefs[pref.dataset.pref];applyPreferences();showSettings();}if(!command)return;const action=command.dataset.menu;
    if(action==='title')showTitle();if(action==='continue')active?resume():showHub();if(action==='hub')showHub();if(action==='garage')showHub('garage');if(action==='newgame')showReset();if(action==='reset-confirm')reset();if(action==='fullscreen')toggleFullscreen();if(action==='save')exportSave();if(action==='load')$('load-file').click();if(action==='help')showHelp();if(action==='settings-help'){settingsParent=modalReturn;showHelp();modalReturn='settings';}if(action==='settings')showSettings();if(action==='close')returnFromAux();if(action==='db')showDB();if(action==='brief-start'||action==='battle'){closeModal();focusNode(G.guidance(selectedUnit).targetId);}if(action==='suggest-start'){closeModal();recommend();}if(action==='wait'){closeModal();advance(true);}if(action==='retreat'){closeModal();const result=G.retreat();if(!result.ok)toast(result.message,true);else finish();}if(action==='validate')validateDB();if(action==='db-download'){const data=validateDB();if(data)download('window.GAME_DB = '+JSON.stringify(data,null,2).replace(/</g,'\\u003c')+';','text/javascript',T.dbName);}if(action==='html-download'){const data=validateDB();if(data)exportHTML(data);}
  });
  $('load-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;const before=CP.snapshot(),battle=G.snapshot(),wasActive=active;try{const value=JSON.parse(await file.text());if(!value.campaign)throw Error(D.text.invalidSave);const loaded=CP.loadState(value.campaign);if(!loaded.ok)throw Error(loaded.message);active=false;if(value.battle?.missionId===CP.getState().activeMissionId){const result=G.loadState(value.battle);active=result.ok;}if(!active&&CP.getState().activeMissionId)CP.cancelMission();if(active){selectedUnit=G.getState().flagship;license=G.getState().unitLicenses[0];}save();showHub();toast(D.text.loadReady);}catch(error){CP.loadState(before);if(battle)G.loadState(battle);active=wasActive;toast(error.message,true);}event.target.value='';});
  document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea'))return;if(modalKind){if(event.key==='Tab'){const controls=[...$('modal').querySelectorAll('button:not(:disabled),input,textarea')],first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}if(event.key==='Escape'){if(['help','settings','db'].includes(modalKind))returnFromAux();else if(['reset'].includes(modalKind))showTitle();}return;}if(event.code==='Space'){event.preventDefault();if(!event.repeat)advance();}if(/^[1-9]$/.test(event.key)&&active){const u=G.getState().units.filter(u=>u.faction==='player'&&u.kind==='fleet'&&u.hp>0)[Number(event.key)-1];if(u){selectedUnit=u.id;render();}}});
  window.addEventListener('beforeunload',save);
  CP.createCampaign(DB.config.defaultSeed);let migrated=false;if(envelope?.campaign){const result=CP.loadState(envelope.campaign);if(result.ok&&envelope.battle?.missionId===CP.getState().activeMissionId)active=G.loadState(envelope.battle).ok;if(!active&&CP.getState().activeMissionId){CP.cancelMission();migrated=true;}}else try{const legacy=JSON.parse(localStorage.getItem(K.legacyKey)||'null');if(legacy)CP.migrateLegacyRun(legacy);}catch{}
  if(active){selectedUnit=G.getState().flagship;focusedNode=G.guidance(selectedUnit).targetId;license=G.getState().unitLicenses[0];}
  campaignUI=new window.CampaignUI({campaign:CP,game:G,openModal,onLaunch:launch,onSave:save,onExport:exportSave,onLoad:()=>$('load-file').click(),onResume:resume,onTitle:showTitle,hasActiveBattle:()=>active,notify:toast,esc,icon});render();showTitle();if(migrated)toast(D.text.legacy);
  window.OperationUI={render,launch,advance,recommend,showTitle,showHub,showSettings,reset,exportSave,toggleFullscreen,campaignUI};
})();

</script>
</body>
