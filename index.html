function matchesPanel(){const s=FC.state();if(!s.rivals[rivalId]?.open)rivalId=nextRival();const rival=FC.previewRival(rivalId),m=matchup(rival.character);return `<div class="card opponent-card"><div class="opponent-art">${portrait(rival.character)}</div><div><span class="kicker">${esc(s.challenge?T.champion:T.nextRival)} · ${esc(T.aiBout)}</span><h2>${esc(rival.hero.name)} <small>${esc(rankName(rival.level))}</small></h2><p>${esc(rival.name)}</p><div class="habit">${tag(DB.styles[rival.hero.style].name)}${tag(DB.ai.profiles[rival.ai].name)}${tag(m.name,m.cls)}</div><div class="button-row">${button(active?'resume':'prepare',active?T.resume:T.prepare,{id:rivalId},'primary')}${button('rules',T.rules)}</div></div></div><div class="rival-list">${DB.rivals.map((r,i)=>{const record=s.rivals[r.id],h=find(DB.characters,r.character);return button('rival',`<strong>${i+1}. ${esc(r.name)}</strong><span>${esc(h.name)} · ${record.wins?`${record.wins}${esc(T.wins)}`:esc(rankName(r.level))}</span>`,{id:r.id},r.id===rivalId?'selected':'',!record.open);}).join('')}</div>`;}
function trainingPanel(){const s=FC.state();return `<div class="page-heading"><div><h2>${esc(T.training)}</h2><p>${esc(T.pointsReturn)}</p></div>${button('respec',T.respec,{},'',!!s.activeBout)}</div><div class="training-grid">${DB.training.map(t=>{const value=s.training[t.id],cost=FC.trainingCost(t.id);return `<section class="card training-card"><h3>${esc(t.name)} <small>${value}/${DB.progression.trainingMax}</small></h3><p>${esc(t.description)}</p>${effects(t.stats)}<div class="bar"><i style="width:${value/DB.progression.trainingMax*C.percent}%"></i></div>${button('train',`${esc(T.train)} · ${cost} ${esc(T.points)}`,{id:t.id},'full',!!s.activeBout||s.points<cost||value>=DB.progression.trainingMax)}</section>`;}).join('')}</div>`;}
function buildPanel(){const s=FC.state();return `<h2>${esc(T.gear)}</h2><div class="loadout">${s.loadout.map((id,i)=>button('slot',`<b>${i+1}. ${esc(find(DB.modules,id)?.name||T.emptySlot)}</b><small>${esc(T.chooseSlot)}${i===slot?' ✓':''}</small>`,{index:i},i===slot?'selected':'')).join('')}</div>${s.loadout[slot]?button('unequip',T.unequip,{index:slot},'',!!s.activeBout):''}<div class="catalog section-title">${DB.modules.map(m=>{const rank=s.ownedModules[m.id]||0,equipped=s.loadout.includes(m.id),cost=FC.moduleCost(m.id,!!rank);return `<section class="card gear-card ${equipped?'equipped':''}"><h3>${esc(m.name)}<small>${rank?`${esc(T.level)} ${rank}/${m.maxRank}`:esc(T.empty)}</small></h3><p>${esc(m.description)}</p>${effects(m.stats,rank||1)}<div class="button-row">${rank?button('equip',equipped?T.equipped:`${slot+1}. ${T.equip}`,{id:m.id},equipped?'':'primary',!!s.activeBout||equipped):button('buy',`${T.buy} · ${cost}`,{id:m.id},'primary',!!s.activeBout||s.coins<cost)}${rank?button('upgrade',rank>=m.maxRank?T.maxed:`${T.upgrade} · ${cost}`,{id:m.id},'',!!s.activeBout||rank>=m.maxRank||s.coins<cost):''}</div></section>`;}).join('')}</div><h2 class="section-title">${esc(T.talents)}</h2><div class="loadout">${Array.from({length:DB.progression.talentSlots},(_,i)=>button('talent-slot',`<b>${i+1}. ${esc(find(DB.talents,s.talents[i])?.name||T.emptySlot)}</b><small>${esc(T.talentSlot)}</small>`,{index:i},i===talentSlot?'selected':'')).join('')}</div><div class="talent-grid">${DB.talents.filter(t=>!t.character||t.character===s.characterId).map(t=>`<section class="card"><h3>${esc(t.name)}</h3><p>${esc(t.description)}</p>${t.stats.length?effects(t.stats):''}${button('talent',s.talents.includes(t.id)?T.equipped:t.level>s.career.level?`${rankName(t.level)} ${T.unlock}`:T.equip,{id:t.id},'',!!s.activeBout||s.talents.includes(t.id)||t.level>s.career.level)}</section>`).join('')}</div>`;}
function recordsPanel(){return FC.state().history.length?`<h2>${esc(T.records)}</h2><table class="table"><thead><tr><th>${esc(T.opponent)}</th><th>${esc(T.reward)}</th><th>${esc(T.damage)}</th><th></th></tr></thead><tbody>${FC.state().history.map(r=>`<tr><td>${esc(r.opponent)}<br><small>${esc(T[r.outcome==='win'?'resultWin':r.outcome==='loss'?'resultLoss':'resultDraw'])}</small></td><td>+${r.coins} ${esc(T.coins)}</td><td>${Math.round(r.stats.damage)}</td><td>${button('report',T.records,{id:r.id})}</td></tr>`).join('')}</tbody></table>`:`<div class="card empty">${esc(T.historyEmpty)}</div>`;}
function home(nextTab=tab){if(!FC.state()){showSelection();return;}scene='home';tab=nextTab;closeModal();save();header();$('view').innerHTML=`<div class="page"><div class="locker-layout">${profileCard()}<section><nav class="tabs">${DB.tabs.map(t=>button('tab',T[t.label],{id:t.id},tab===t.id?'active':'')).join('')}</nav>${tab==='fight'?matchesPanel():tab==='training'?trainingPanel():tab==='build'?buildPanel():tab==='book'?`<section class="card"><h2>${esc(T.book)}</h2>${bookHTML()}<p class="compact-note">${esc(T.manualNote)}</p></section>`:recordsPanel()}</section></div></div>`;}
function planControls(plan){return `<div class="plan-controls">${Object.entries(DB.options).map(([key,options])=>`<div class="plan-group"><label>${esc(T[key])}</label><div class="segments">${options.map(opt=>`<button data-action="plan" data-key="${key}" data-id="${opt.id}" class="${plan[key]===opt.id?'selected':''}">${esc(opt.name)}</button>`).join('')}</div></div>`).join('')}</div>`;}
function quickPlans(){return `<div class="quick-plans">${FC.state().presets.map(p=>button('preset',esc(p.name),{id:p.id})).join('')}</div>`;}
function presetPicker(){return `<div class="preset-picker"><select id="preset-picker">${[...FC.state().presets,...DB.presets].map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>${button('load-preset',T.preset)}</div>`;}
function bookHTML(){const s=FC.state();return `<div class="book-heading"><h3>${esc(T.autoBook)}</h3><label class="switch"><input type="checkbox" id="book-auto" data-change="book" ${s.auto?'checked':''}>${esc(T.enabled)}</label></div><div class="rulebook" id="rulebook">${s.rules.map((r,i)=>`<div class="rule-row" data-rule="${i}"><input type="checkbox" data-rule-enabled data-change="book" ${r.enabled?'checked':''}><select data-rule-condition data-change="book">${DB.conditions.map(c=>`<option value="${c.id}" ${r.condition===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><span>→</span><select data-rule-preset data-change="book">${[...s.presets,...DB.presets].map(p=>`<option value="${p.id}" ${p.id===r.preset?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="rule-controls">${button('rule-up','↑',{index:i},'',i===0)}${button('rule-remove','×',{index:i})}</div></div>`).join('')}</div><div class="button-row" style="margin-top:12px">${button('rule-add',T.addRule,{},'',s.rules.length>=C.maxRules)}</div><p class="compact-note">${esc(T.ruleSlots)}</p>`;}
function saveBook(){const root=$('rulebook');if(!root)return;const rules=[...root.querySelectorAll('[data-rule]')].map(row=>({condition:row.querySelector('[data-rule-condition]').value,preset:row.querySelector('[data-rule-preset]').value,enabled:row.querySelector('[data-rule-enabled]').checked}));const r=FC.setRules(rules,$('book-auto').checked);if(r.ok){if(active)G.setBook(rules,FC.state().auto);save();}else toast(r.message,true);}
function refreshBook(){if(modalKind==='book'){openBook();return;}if(scene==='prepare')prepareView(rivalId,true);else home('book');}
function openBook(){openModal('book',`${closeButton()}<h2 id="modal-title">${esc(T.book)}</h2>${bookHTML()}<p class="compact-note">${esc(T.manualNote)}</p><div class="button-row">${button('close',T.resume,{},'primary')}</div>`);}
function prepareView(id=rivalId,keepDraft=false){if(active){resume();return;}rivalId=id;scene='prepare';if(!keepDraft||!draft)draft=clone(FC.state().plan);dirty=false;header();const rival=FC.previewRival(id),m=matchup(rival.character),plan=rival.plan;const habits=[find(DB.options.range,plan.range).name,find(DB.options.pace,plan.pace).name,find(DB.options.intent,plan.intent).name];$('view').innerHTML=`<div class="page"><div class="page-heading"><div><span class="kicker">${esc(T.aiBout)}</span><h1>${esc(T.prepare)}</h1></div><div class="button-row">${button('home',T.back)}${button('start',T.start,{id},'primary')}</div></div><div class="preparation"><aside class="card scout"><div class="scout-art">${portrait(rival.character)}</div><h2>${esc(rival.hero.name)} <small>${esc(rankName(rival.level))}</small></h2><p>${esc(rival.name)}</p><div class="habit">${tag(DB.styles[rival.hero.style].name)}${habits.map(h=>tag(h)).join('')}</div><div class="matchup">${esc(m.name)} · ${m.value>1?'+':''}${Math.round((m.value-1)*C.percent)}% ${esc(T.damage)}</div><p class="compact-note">${esc(rival.hero.strength)} / ${esc(rival.hero.weakness)}</p>${statGrid(rival.stats,DB.scoutStats)}<div class="trait-box"><strong>${esc(DB.traits[rival.hero.trait].name)}</strong><p>${esc(DB.traits[rival.hero.trait].description)}</p></div></aside><div><section class="card"><h2>${esc(T.initialPlan)}</h2>${presetPicker()}${planControls(draft)}${quickPlans()}<div class="preset-save">${FC.state().presets.map((p,i)=>button('save-preset',`${i+1}. ${T.storePreset}`,{index:i})).join('')}</div></section><section class="card section-title">${bookHTML()}<p class="compact-note">${esc(T.manualNote)}</p></section></div></div></div>`;}
function hudActor(a,side){return `<section class="fighter-hud ${side==='foe'?'foe':''}"><div class="head-art">${portrait(a.characterId)}</div><div><h3>${esc(a.name)} <small>${esc(DB.styles[find(DB.characters,a.characterId).style].name)} · ${esc(rankName(a.level))}</small><span id="${side}-hp-number" class="hp-label"></span></h3><div class="bar health"><i id="${side}-hp"></i></div><div class="minor-bars">${['stamina','guard','focus'].map(key=>`<div><small>${esc(T[key])}<b id="${side}-${key}-number"></b></small><div class="bar ${key}"><i id="${side}-${key}"></i></div></div>`).join('')}</div></div></section>`;}
function fightView(){scene='fight';closeModal();header();const s=G.state();draft=clone(s.player.pending?.plan||s.player.plan);dirty=false;$('view').innerHTML=`<div class="fight-page"><div class="fight-top">${hudActor(s.player,'player')}<div class="timer"><small id="round-label"></small><span id="round-clock"></span></div>${hudActor(s.foe,'foe')}</div><div class="fight-layout"><div class="arena-card"><div class="arena-toolbar"><span>${esc(T.aiBout)} · ${esc(T.rules)}</span><div class="button-row">${DB.speeds.map(v=>button('speed',v.label,{value:v.value},speed===v.value?'selected':'')).join('')}${button('pause',T.pause)}</div></div><div class="arena-wrap"><canvas id="arena" aria-label="${esc(T.arenaLabel)}"></canvas><div class="combat-flash" id="combat-flash"></div></div><div class="ring-facts"><div>${esc(T.distance)}<strong id="distance"></strong></div><div>${esc(T.yourFighter)}<strong id="player-state"></strong></div><div>${esc(T.opponent)}<strong id="foe-state"></strong></div></div></div><aside class="card tactic-panel"><h2>${esc(T.draft)} ${tag(T.aiBout)}</h2><div class="tactic-current">${esc(T.current)}<strong id="current-plan"></strong></div>${planControls(draft)}${quickPlans()}<div class="apply-row"><small id="transition"></small>${button('apply',T.apply,{},'primary')}</div><div class="auto-note"><span id="auto-note"></span>${button('book',T.book)}</div><section class="focus-area"><span>${esc(T.focus)}</span><small id="focus-note"></small><div class="focus-buttons">${DB.focusActions.map(a=>button('focus',esc(a.name),{id:a.id},'',true)).join('')}</div></section></aside></div><div class="fight-bottom"><section class="card observation"><h3>${esc(T.observed)}</h3><div class="observed-bars" id="observations"></div><p class="advice" id="advice"></p></section><section class="card fight-log" id="fight-log"></section></div></div>`;renderer=new window.DuelRenderer($('arena'));updateFight();renderer.render();save();}
function startFight(id){FC.setPlan(draft||FC.state().plan);saveBook();const prepared=FC.prepare(id);if(!result(prepared))return;const begun=G.start(prepared.bout);if(!begun.ok){FC.cancel();save();toast(begun.message,true);return;}active=true;paused=false;lastFlash=-1;fightView();}
function stateName(a,s){if(a.brokenUntil>s.elapsed)return T.broken;if(a.exposedUntil>s.elapsed)return T.exposed;if(a.stamina/a.base.stamina<C.lowStamina)return T.fatigued;if(Math.hypot(a.x,a.y)/C.ringRadius>C.edgeRatio)return T.edge;return T.normal;}
function updateFight(){if(scene!=='fight'||!active||!$('arena'))return;const s=G.state(),a=s.player;for(const [side,actor]of [['player',s.player],['foe',s.foe]]){for(const key of ['hp','stamina','guard','focus']){const max=key==='focus'?actor.base.focusMax:actor.base[key];$(side+'-'+key).style.width=`${Math.max(0,actor[key]/max*C.percent)}%`;$(side+'-'+key+'-number').textContent=key==='hp'?`${Math.ceil(actor.hp)}/${actor.base.hp}`:Math.ceil(actor[key]);}$(side+'-state').textContent=stateName(actor,s);}if(!dirty){draft=clone(a.pending?.plan||a.plan);syncPlanButtons();}$('round-label').textContent=`${s.round} / ${C.rounds} ${T.round}`;$('round-clock').textContent=time(s.clock);$('distance').textContent=`${number(Math.hypot(a.x-s.foe.x,a.y-s.foe.y))}${T.meters}`;$('current-plan').textContent=G.planName(a.plan);$('transition').textContent=a.pending?`${T.pending} · ${number(Math.max(0,a.pending.at-s.elapsed))}${T.seconds}`:a.changeReady>s.elapsed?`${T.changeWaiting} ${number(a.changeReady-s.elapsed)}${T.seconds}`:T.readyApply;const apply=$('view').querySelector('[data-action="apply"]');apply.disabled=a.changeReady>s.elapsed||JSON.stringify(draft)===JSON.stringify(a.pending?.plan||a.plan);$('auto-note').textContent=a.manualUntil>s.elapsed?`${T.manual} ${Math.ceil(a.manualUntil-s.elapsed)}${T.seconds}`:a.auto?T.auto:T.manualOnly;$('focus-note').textContent=a.focusReady>s.elapsed?`${T.wait} ${Math.ceil(a.focusReady-s.elapsed)}${T.seconds}`:`${Math.floor(a.focus)} / ${C.focusCost}`;for(const btn of $('view').querySelectorAll('[data-action="focus"]'))btn.disabled=a.focus<C.focusCost||a.focusReady>s.elapsed;
const counts=G.observation(),total=Object.values(counts).reduce((n,v)=>n+v,0);$('observations').innerHTML=DB.options.intent.map(o=>`<div>${esc(o.name)}<b>${counts[o.id]||0}</b><div class="bar"><i style="width:${(counts[o.id]||0)/Math.max(1,total)*C.percent}%"></i></div></div>`).join('');$('advice').textContent=T[G.advice()];$('fight-log').innerHTML=s.events.filter(e=>DB.visibleEvents.includes(e.key)).slice(0,C.visibleLog).map(e=>`<div><time>${time(e.time)}</time>${esc(e.text)}</div>`).join('');const flash=s.events.find(e=>DB.flashEvents.includes(e.key));if(flash&&flash.id>lastFlash){lastFlash=flash.id;$('combat-flash').textContent=flash.text;}else if(!flash||s.elapsed-flash.time>C.flashSeconds)$('combat-flash').textContent='';}
function syncPlanButtons(){for(const el of document.querySelectorAll('[data-action="plan"]'))el.classList.toggle('selected',draft[el.dataset.key]===el.dataset.id);}
function resume(){if(!active){home();return;}paused=false;if(G.state().phase==='corner'){if(scene!=='fight')fightView();showCorner();return;}if(scene!=='fight')fightView();else closeModal();}
function showCorner(){const s=G.state();openModal('corner',`<span class="kicker">${s.round} ${esc(T.round)}</span><h2 id="modal-title">${esc(T.corner)}</h2><div class="result-stats"><div class="card"><h3>${esc(s.player.name)}</h3><p>${esc(T.damage)} ${Math.round(s.player.roundDamage)} · ${esc(T.stamina)} +${Math.round(s.player.base.stamina*C.cornerStamina)}</p></div><div class="card"><h3>${esc(s.foe.name)}</h3><p>${esc(T.damage)} ${Math.round(s.foe.roundDamage)} · ${esc(T.stamina)} +${Math.round(s.foe.base.stamina*C.cornerStamina)}</p></div></div><p>${esc(T[G.advice()])}</p>${presetPicker()}${quickPlans()}<p class="compact-note" id="corner-plan">${esc(G.planName(draft))}</p><div class="button-row">${button('next-round',T.nextRound,{},'primary')}${button('surrender',T.surrender,{},'danger')}</div>`);}
function finish(){if(!active||G.state().phase!=='ended')return;const settled=FC.settle(G.state());if(!result(settled))return;active=false;save();sound('reward');showReport(settled.report);}
function reportStats(metrics,name){return `<section class="card"><h3>${esc(name)}</h3><dl>${[['damage',Math.round(metrics.damage)],['counters',metrics.counters],['throws',metrics.throws],['breaks',metrics.breaks]].map(([k,v])=>`<dt>${esc(T[k])}</dt><dd>${v}</dd>`).join('')}</dl></section>`;}
function showReport(report){closeModal();scene='report';header();const outcome=report.outcome==='win'?T.resultWin:report.outcome==='loss'?T.resultLoss:T.resultDraw,from=rankName(report.from),to=rankName(report.to);$('view').innerHTML=`<div class="result-page"><section class="result-banner"><span class="kicker">${esc(report.opponent)} · ${esc(T[report.reason]||report.reason)}</span><h1>${esc(outcome)}</h1><div class="rank-result ${from!==to?'new-rank':''}">${esc(from===to?to:from+' → '+to)}</div><div class="rewards"><div><strong>+${report.coins}</strong><small>${esc(T.coins)}</small></div><div><strong>+${report.xp}</strong><small>${esc(T.xp)}</small></div><div><strong>+${report.points}</strong><small>${esc(T.points)}</small></div></div>${report.first?tag(T.first,'positive'):''}<p class="compact-note">${esc(T.kept)}</p><div class="button-row" style="justify-content:center">${button('train-home',T.spendPoints)}${button('prepare',T.rematch,{id:report.rivalId})}${button('next-match',T.nextMatch,{},'primary')}</div></section><div class="result-stats">${reportStats(report.stats,FC.state().name)}${reportStats(report.foeStats,T.opponent)}</div><section class="card"><h3>${esc(T.bestMoment)}</h3><div class="moments">${report.moments.map(e=>`<div>${time(e.time)} · ${esc(e.text)}</div>`).join('')||esc(T.empty)}</div></section></div>`;}
function time(v){const secs=Math.max(0,Math.ceil(v));return `${Math.floor(secs/C.secondsPerMinute)}:${String(secs%C.secondsPerMinute).padStart(2,'0')}`;}
function pauseMenu(){if(!active)return;paused=true;openModal('pause',`<h2 id="modal-title">${esc(T.pause)}</h2><div class="button-row">${button('resume',T.resume,{},'primary')}${button('book',T.book)}${button('home',T.home)}${button('export',T.save)}${button('rules',T.rules)}${button('surrender',T.surrender,{},'danger')}</div>`);}
function settings(){openModal('settings',`${closeButton()}<h2 id="modal-title">${esc(T.settings)}</h2><label class="check-row">${esc(T.sound)}<input type="checkbox" data-pref="sound" ${prefs.sound?'checked':''}></label><label class="check-row">${esc(T.reduced)}<input type="checkbox" data-pref="reduced" ${prefs.reduced?'checked':''}></label><div class="button-row">${button('fullscreen',T.fullscreen)}${button('export',T.save,{},'',!FC.state())}${button('load',T.load)}${button('db',T.db)}${button('new-game',T.newGame,{},'danger')}</div>`);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'});else toast(T.fullscreenHint);renderer?.resize();}catch{toast(T.fullscreenHint);}}
function dbModal(){openModal('db',`${closeButton()}<h2 id="modal-title">${esc(T.db)}</h2><p>${esc(T.dbHelp)}</p><textarea id="db-editor" spellcheck="false"></textarea><small id="db-status"></small><div class="button-row">${button('validate',T.validate)}${button('db-export',T.dbExport)}${button('html-export',T.htmlExport,{},'primary')}</div>`);$('db-editor').value=JSON.stringify(DB,null,2);}
function validateEditor(){try{const value=JSON.parse($('db-editor').value),errors=FC.validate(value);if(errors.length)throw Error(errors.join('\n'));$('db-status').textContent=T.valid;return value;}catch(error){$('db-status').textContent=error.message;return null;}}
function exportHTML(data){const root=document.documentElement.cloneNode(true),script=root.querySelector('#game-db');script.removeAttribute('src');script.textContent='window.GAME_DB = '+JSON.stringify(data,null,2).replace(/</g,'\\u003c')+';';root.querySelector('#view').innerHTML='';root.querySelector('#modal-backdrop').hidden=true;root.querySelector('#modal').innerHTML='';download('<!doctype html>\n'+root.outerHTML,'text/html;charset=utf-8',T.htmlName);}
function newGame(){openModal('reset',`<h2 id="modal-title">${esc(T.newTitle)}</h2><p>${esc(T.newBody)}</p><div class="button-row">${button('close',T.cancel)}${button('export',T.save,{},'',!FC.state())}${button('reset-confirm',T.confirmReset,{},'danger')}</div>`);}
function bookAction(action,index){saveBook();const rules=clone(FC.state().rules);if(action==='rule-add'&&rules.length<C.maxRules)rules.push(clone(DB.defaultRules[0]));if(action==='rule-remove')rules.splice(index,1);if(action==='rule-up'&&index>0)[rules[index],rules[index-1]]=[rules[index-1],rules[index]];result(FC.setRules(rules));if(active)G.setBook(rules,FC.state().auto);refreshBook();}
function planChange(key,value){draft[key]=value;dirty=true;syncPlanButtons();if(!active){FC.setPlan(draft);save();}if($('corner-plan'))$('corner-plan').textContent=G.planName(draft);if(scene==='fight')updateFight();}
document.addEventListener('click',event=>{const el=event.target.closest?.('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=el.dataset.id,index=Number(el.dataset.index);if(action==='select-character'){callsign=$('callsign').value;chosen=id;showSelection();}if(action==='contract'){if(FC.state()){toast(T.profileLocked,true);return;}callsign=$('callsign').value;const r=FC.create(chosen,callsign,legacy);if(result(r)){if(legacy)toast(T.legacy);try{localStorage.setItem(C.migrationKey,'1');}catch{}legacy=null;rivalId=nextRival();home();}}if(action==='home')home();if(action==='tab')home(id);if(action==='rival'){rivalId=id;home('fight');}if(action==='prepare'){closeModal();prepareView(id);}if(action==='next-match')prepareView(nextRival());if(action==='train-home')home('training');if(action==='train')result(FC.train(id),()=>home('training'));if(action==='respec')result(FC.respec(),()=>home('training'));if(action==='slot'){slot=index;home('build');}if(action==='talent-slot'){talentSlot=index;home('build');}if(action==='buy')result(FC.buy(id),()=>home('build'));if(action==='upgrade')result(FC.upgrade(id),()=>home('build'));if(action==='equip')result(FC.equip(slot,id),()=>home('build'));if(action==='unequip')result(FC.equip(index,null),()=>home('build'));if(action==='talent')result(FC.setTalent(talentSlot,id),()=>home('build'));if(action==='plan')planChange(el.dataset.key,id);if(action==='preset'||action==='load-preset'){const p=FC.preset(action==='preset'?id:$('preset-picker').value);draft=clone(p.plan);dirty=true;syncPlanButtons();if(!active){FC.setPlan(draft);save();}if($('corner-plan'))$('corner-plan').textContent=G.planName(draft);if(scene==='fight')updateFight();}if(action==='save-preset')openModal('preset',`${closeButton()}<h2 id="modal-title">${esc(T.storePreset)}</h2><input id="preset-name" maxlength="${C.nameLength}" value="${esc(FC.state().presets[index].name)}"><div class="button-row">${button('save-preset-confirm',T.savePlan,{index},'primary')}</div>`);if(action==='save-preset-confirm'){if(result(FC.setPreset(index,$('preset-name').value,draft))){closeModal();if(scene==='prepare')prepareView(rivalId,true);else home('book');}}if(action.startsWith('rule-'))bookAction(action,index);if(action==='start')startFight(id);if(action==='apply'){const r=G.queue(draft);if(result(r)){FC.setPlan(draft);dirty=false;save();updateFight();}}if(action==='focus')result(G.useFocus(id),updateFight);if(action==='book')openBook();if(action==='pause')pauseMenu();if(action==='resume')resume();if(action==='speed'){speed=Number(el.dataset.value);for(const b of document.querySelectorAll('[data-action="speed"]'))b.classList.toggle('selected',Number(b.dataset.value)===speed);}if(action==='next-round'){G.nextRound(draft);paused=false;closeModal();dirty=false;save();updateFight();}if(action==='surrender')openModal('surrender',`<h2 id="modal-title">${esc(T.surrenderAsk)}</h2><p>${esc(T.surrenderBody)}</p><div class="button-row">${button('close',T.cancel)}${button('confirm-surrender',T.surrender,{},'danger')}</div>`);if(action==='confirm-surrender'){G.surrender();finish();}if(action==='settings')settings();if(action==='close'){closeModal();paused=false;if(active&&G.state().phase==='corner')showCorner();}if(action==='fullscreen')fullscreen();if(action==='export')exportSave();if(action==='load')$('load-file').click();if(action==='new-game')newGame();if(action==='reset-confirm'){active=false;legacy=null;FC.reset();try{localStorage.removeItem(C.storageKey);localStorage.setItem(C.migrationKey,'1');}catch{}closeModal();callsign='';showSelection();}if(action==='rules')openModal('rules',`${closeButton()}<h2 id="modal-title">${esc(T.rules)}</h2><p>${esc(T.rulesBody)}</p><p>${esc(T.matchupNote)}</p><div class="trait-box"><strong>${esc(T.focus)}</strong>${DB.focusActions.map(a=>`<p>${esc(a.name)} · ${esc(a.description)}</p>`).join('')}</div>`);if(action==='rename')openModal('rename',`${closeButton()}<h2 id="modal-title">${esc(T.profileName)}</h2><input id="new-name" maxlength="${C.nameLength}" value="${esc(FC.state().name)}"><div class="button-row">${button('rename-confirm',T.saveName,{},'primary')}</div>`);if(action==='rename-confirm'){FC.setName($('new-name').value);closeModal();home();}if(action==='report'){const r=find(FC.state().history,id);if(r)showReport(r);}if(action==='db')dbModal();if(action==='validate')validateEditor();if(action==='db-export'){const data=validateEditor();if(data)download('window.GAME_DB = '+JSON.stringify(data,null,2).replace(/</g,'\\u003c')+';','text/javascript',T.dbName);}if(action==='html-export'){const data=validateEditor();if(data)exportHTML(data);}});
document.addEventListener('change',event=>{if(event.target.dataset.change==='book')saveBook();if(event.target.dataset.pref){prefs[event.target.dataset.pref]=event.target.checked;applyPrefs();}});
$('load-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;const before=FC.snapshot(),battle=G.snapshot(),wasActive=active;try{const imported=JSON.parse(await file.text());if(!imported.profile){if(imported.campaign){legacy=imported.campaign;active=false;FC.reset();closeModal();showSelection();toast(T.legacyChoose);return;}throw Error(T.invalidSave);}const loaded=FC.load(imported.profile);if(!loaded.ok)throw Error(loaded.message);active=false;if(imported.battle?.id===FC.state().activeBout&&imported.battle.player.characterId===FC.state().characterId)active=G.load(imported.battle).ok;if(!active&&FC.state().activeBout)FC.cancel();closeModal();save();home();toast(T.loadSuccess);}catch(error){if(before)FC.load(before);else FC.reset();if(battle)G.load(battle);active=wasActive;toast(error.message,true);}event.target.value='';});
document.addEventListener('keydown',event=>{if(event.target.closest?.('input,textarea,select'))return;if(event.key==='Tab'&&modalKind){const nodes=[...$('modal').querySelectorAll('button:not(:disabled),input,select,textarea')],first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}if(event.code==='Space'&&active&&scene==='fight'){event.preventDefault();if(!event.repeat){if(modalKind==='pause')resume();else if(!modalKind)pauseMenu();}}if(event.code==='Escape'&&modalKind&&modalKind!=='corner'){event.preventDefault();closeModal();paused=false;if(active&&G.state().phase==='corner')showCorner();}});
window.addEventListener('resize',()=>renderer?.resize());window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(active&&scene==='fight'&&!modalKind)pauseMenu();}});
try{const stored=JSON.parse(localStorage.getItem(C.storageKey)||'null');if(stored?.profile&&FC.load(stored.profile).ok){if(stored.battle?.id===FC.state().activeBout&&stored.battle.player.characterId===FC.state().characterId)active=G.load(stored.battle).ok;if(!active&&FC.state().activeBout)FC.cancel();rivalId=nextRival();}else{const old=JSON.parse(localStorage.getItem(C.legacyKey)||'null');if(old?.campaign&&localStorage.getItem(C.migrationKey)!=='1')legacy=old.campaign;}}catch{}
if(FC.state())home();else showSelection();
function frame(now){const dt=lastFrame?Math.min(C.maxFrame,(now-lastFrame)/C.milliseconds):0;lastFrame=now;if(active&&scene==='fight'&&!modalKind&&!paused&&G.state().phase==='fighting'){let left=dt*speed;while(left>0){const step=Math.min(left,C.step);G.tick(step);left-=step;if(G.state().phase!=='fighting')break;}const sounds=[...new Set(G.state().sounds)];G.state().sounds=[];for(const kind of sounds)sound(kind);if(G.state().phase==='corner'){updateFight();showCorner();}else if(G.state().phase==='ended')finish();saveClock+=dt;if(saveClock>=C.saveInterval){saveClock=0;save();}}hudClock+=dt;if(active&&scene==='fight'){if(hudClock>=C.hudInterval){hudClock=0;updateFight();}renderer?.render();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);window.DuelUI={home,showSelection,prepareView,startFight,resume,updateFight,openBook,showReport,exportSave,save,frame,getRenderer:()=>renderer};
})();

</script></body></html>
