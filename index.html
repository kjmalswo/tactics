function recordsPanel(){return FC.state().history.length?`<h2>${esc(T.records)}</h2><table class="table"><thead><tr><th>${esc(T.opponent)}</th><th>${esc(T.reward)}</th><th>${esc(T.damage)}</th><th></th></tr></thead><tbody>${FC.state().history.map(r=>`<tr><td>${esc(r.opponent)}<br><small>${esc(T[r.outcome==='win'?'resultWin':r.outcome==='loss'?'resultLoss':'resultDraw'])}</small></td><td>+${r.coins} ${esc(T.coins)}</td><td>${Math.round(r.stats.damage)}</td><td>${button('report',T.records,{id:r.id})}</td></tr>`).join('')}</tbody></table>`:`<div class="card empty">${esc(T.historyEmpty)}</div>`;}
function header(){const s=FC.state();$('brand').textContent=DB.meta.title;$('header-profile').textContent=s?`${s.name} · ${FC.getRank().name}`:DB.meta.subtitle;$('header-tools').innerHTML=(s?button('home',T.home)+(active?button('resume',T.backToRing,{},'primary'):''):'')+button('settings',T.settings);}
function showSelection(){scene='select';header();const ch=find(DB.characters,chosen);$('view').innerHTML=`<div class="page selection-page"><div class="page-heading"><div><span class="kicker">${esc(DB.meta.subtitle)}</span><h1>${esc(T.selectCharacter)}</h1><p>${esc(T.chooseNote)}</p></div></div><div class="select-layout"><div class="character-grid">${DB.characters.map(h=>`<button class="character-card ${h.id===chosen?'selected':''}" data-action="select-character" data-id="${h.id}"><div>${portrait(h.id)}</div><div class="char-label"><strong>${esc(h.name)} ${tag(DB.styles[h.style].name)}</strong><small>${esc(h.signature.name)}</small></div></button>`).join('')}</div><aside class="card character-preview"><div class="portrait">${portrait(ch.id)}</div><span class="kicker">${esc(ch.epithet)}</span><h2>${esc(ch.name)}</h2><div class="signature-intro"><small>${esc(T.iconicMove)}</small><strong>${esc(ch.signature.name)}</strong><p>${esc(ch.signature.hint)}</p></div><div class="strength-pair"><div><span>${esc(T.strengthShort)}</span><b>${esc(ch.strength)}</b></div><div><span>${esc(T.weaknessShort)}</span><b>${esc(ch.weakness)}</b></div></div>${button('contract',`${esc(ch.name)} · ${T.choose}`,{},'primary full')}<details class="compact-note"><summary>${esc(T.background)}</summary><p>${esc(ch.story)}</p><p>${esc(DB.world.body)}</p></details></aside></div></div>`;}
function profileCard(){const s=FC.state(),h=hero(),p=FC.progress();return `<aside class="card profile-card iconic-profile"><div class="profile-art">${portrait(h.id)}</div><span class="kicker">${esc(h.epithet)}</span><h2>${esc(s.name)}</h2><div class="rank-line"><strong>${esc(p.rank.name)}</strong><small>${s.wins}${esc(T.wins)} ${s.losses}${esc(T.losses)}</small></div><div class="bar"><i style="width:${p.ratio*C.percent}%"></i></div><small>${p.next?`${esc(T.nextRank)} ${esc(p.next.name)} · ${p.earned}/${p.total}`:T.maxRank}</small><div class="profile-signature"><small>${esc(T.iconicMove)}</small><strong>${esc(h.signature.name)}</strong></div><div class="wallet"><div><strong>${s.coins}</strong><small>${esc(T.coins)}</small></div><div><strong>${s.points}</strong><small>${esc(T.points)}</small></div></div><details class="profile-numbers"><summary>${esc(T.fighterStats)}</summary>${statGrid(FC.stats())}</details></aside>`;}
function matchesPanel(){const s=FC.state();if(!s.rivals[rivalId]?.open)rivalId=nextRival();const r=FC.previewRival(rivalId),m=matchup(r.character);return `<section class="card quick-bout"><div class="opponent-art">${portrait(r.character)}</div><div class="next-opponent"><span class="kicker">${esc(s.challenge?T.champion:T.nextRival)}</span><h2>${esc(r.hero.name)} <small>${esc(DB.styles[r.hero.style].name)}</small></h2><p>${esc(r.hero.epithet)} · ${esc(r.name)}</p><div class="habit">${tag(m.name,m.cls)}${tag(r.hero.signature.name)}</div><div class="opponent-tell"><small>${esc(T.watchFor)}</small><strong>${esc(r.hero.signature.hint)}</strong></div>${button(active?'resume':'start',active?T.resume:T.directFight,{id:rivalId},'primary full fight-now')}<small>${esc(T.optionalBuild)}</small></div></section><details class="league-details"><summary>${esc(T.leagueTable)}</summary><div class="rival-list">${DB.rivals.map((r,i)=>{const record=s.rivals[r.id],h=find(DB.characters,r.character);return button('rival',`<strong>${i+1}. ${esc(r.name)}</strong><span>${esc(h.name)} · ${record.wins?`${record.wins}${T.wins}`:rankName(r.level)}</span>`,{id:r.id},r.id===rivalId?'selected':'',!record.open);}).join('')}</div></details>`;}
function home(nextTab=tab){if(!FC.state()){showSelection();return;}scene='home';tab=DB.tabs.some(t=>t.id===nextTab)?nextTab:'fight';closeModal();save();header();$('view').innerHTML=`<div class="page"><div class="locker-layout">${profileCard()}<section><nav class="tabs">${DB.tabs.map(t=>button('tab',T[t.label],{id:t.id},tab===t.id?'active':'')).join('')}</nav>${tab==='fight'?matchesPanel():tab==='training'?trainingPanel():buildPanel()}</section></div></div>`;}
function hudActor(a,side){const h=find(DB.characters,a.characterId);return `<section class="fighter-hud ${side==='foe'?'foe':''}"><div class="head-art">${portrait(a.characterId)}</div><div><h3>${esc(a.name)}<small>${esc(h.epithet)}</small><span id="${side}-hp-number" class="hp-label"></span></h3><div class="bar health"><i id="${side}-hp"></i></div><div class="minor-bars">${['stamina','guard'].map(key=>`<div><small>${esc(T[key])}<b id="${side}-${key}-number"></b></small><div class="bar ${key}"><i id="${side}-${key}"></i></div></div>`).join('')}</div><div class="identity-line"><span id="${side}-identity"></span><small id="${side}-charge"></small></div></div></section>`;}
function coachButtons(){const h=hero();return `<div class="coach-buttons">${DB.coaching.map((c,i)=>`<button data-action="coach" data-id="${c.id}" class="coach-call"><span class="coach-icon">${esc(c.glyph)}</span><span><strong>${esc(c.name)}</strong><small>${esc(h.commands[c.id].name)}</small></span><kbd>${i+1}</kbd></button>`).join('')}</div>`;}
function fightView(){scene='fight';closeModal();header();const s=G.state();$('view').innerHTML=`<div class="fight-page active-ring"><div class="fight-top">${hudActor(s.player,'player')}<div class="timer"><small id="round-label"></small><span id="round-clock"></span></div>${hudActor(s.foe,'foe')}</div><section class="arena-card"><div class="arena-toolbar"><span>${esc(T.basicAI)}</span><div class="button-row">${DB.speeds.map(v=>button('speed',v.label,{value:v.value},speed===v.value?'selected':'')).join('')}${button('pause',T.pause)}</div></div><div class="arena-wrap"><canvas id="arena" aria-label="${esc(T.arenaLabel)}"></canvas><div class="combat-flash" id="combat-flash"></div><div class="round-intermission" id="round-intermission" hidden><strong>${esc(T.cornerAuto)}</strong><span id="break-clock"></span></div></div><div class="live-intent"><div><span class="intent-dot"></span><strong id="current-command"></strong><span id="flow-state"></span></div><small id="distance"></small></div></section><section class="coach-dock"><div class="coach-main"><div class="coach-heading"><strong>${esc(T.coachCurrent)}</strong><small id="transition"></small></div>${coachButtons()}<div class="coach-consequence"><span id="command-result"></span><small id="coach-hint"></small></div></div><div class="signature-panel"><div class="signature-gauge"><span id="signature-meter"></span><strong id="signature-count"></strong></div><div class="bar"><i id="signature-fill"></i></div><button id="signature-button" data-action="signature"><span>${esc(hero().signature.name)}</span><small id="signature-state"></small><kbd>4</kbd></button></div></section><p class="live-advice" id="advice"></p></div>`;renderer=new window.DuelRenderer($('arena'));updateFight();renderer.render();save();}
function startFight(id=nextRival()){if(active){resume();return;}const prepared=FC.prepare(id);if(!result(prepared))return;const begun=G.start(prepared.bout);if(!begun.ok){FC.cancel();save();toast(begun.message,true);return;}active=true;paused=false;lastFlash=-1;fightView();}
function call(id){if(!active||modalKind)return;const r=G.coach(id);if(result(r)){FC.setCall(id);save();updateFight();}}
function signature(){if(!active||modalKind)return;const r=G.armSignature();if(result(r)){save();updateFight();}}
function stateName(a,s){if(a.brokenUntil>s.elapsed)return T.broken;if(a.exposedUntil>s.elapsed)return T.exposed;if(a.stamina/a.base.stamina<C.lowStamina)return T.fatigued;return T[a.flow]||T.flowHold;}
function updateFight(){if(scene!=='fight'||!active||!$('arena'))return;const s=G.state(),a=s.player;for(const [side,actor]of [['player',a],['foe',s.foe]]){for(const key of ['hp','stamina','guard']){$(side+'-'+key).style.width=`${Math.max(0,actor[key]/actor.base[key]*C.percent)}%`;$(side+'-'+key+'-number').textContent=key==='hp'?`${Math.ceil(actor.hp)}/${actor.base.hp}`:Math.ceil(actor[key]);}const identity=G.identityInfo(actor);$(side+'-identity').textContent=identity.label;$(side+'-identity').classList.toggle('active',identity.ratio>0);$(side+'-charge').textContent=`${identity.meter} ${Math.floor(actor.focus)}/${C.signatureCost}`;}
$('round-label').textContent=`${s.round} / ${C.rounds} ${T.round}`;$('round-clock').textContent=time(s.clock);$('distance').textContent=`${number(Math.hypot(a.x-s.foe.x,a.y-s.foe.y))}${T.meters}`;const h=hero(),queued=a.pending?.call;$('current-command').textContent=h.commands[a.activeCall].name;$('flow-state').textContent=stateName(a,s);$('transition').textContent=queued?`${T.coachPending} · ${number(Math.max(0,a.pending.at-s.elapsed))}${T.seconds}`:T[h.commands[a.activeCall].plan.pace==='calm'?'hintRecoverActive':'coachShort'];for(const b of $('view').querySelectorAll('[data-action="coach"]')){const id=b.dataset.id;b.classList.toggle('selected',a.activeCall===id);b.classList.toggle('queued',queued===id);b.disabled=s.phase==='fighting'&&a.changeReady>s.elapsed;}
$('command-result').textContent=G.commandFeedback(a);$('coach-hint').textContent=h.commands[queued||a.activeCall].hint;const info=G.signatureInfo(a),ready=a.focus>=C.signatureCost&&a.signatureReadyAt<=s.elapsed;$('signature-meter').textContent=h.signature.meter;$('signature-count').textContent=`${Math.floor(a.focus)} / ${C.signatureCost}`;$('signature-fill').style.width=`${Math.min(C.percent,a.focus/C.signatureCost*C.percent)}%`;const btn=$('signature-button');btn.disabled=!a.signatureOrder&&!ready||s.phase!=='fighting';btn.classList.toggle('ready',ready);btn.classList.toggle('armed',!!a.signatureOrder);$('signature-state').textContent=a.signatureOrder?`${T[info.reason]||T.signatureSeeking} · ${T.signatureCancel}`:ready?T.signatureArm:h.signature.hint;$('advice').textContent=T[G.advice()];$('round-intermission').hidden=s.phase!=='corner';$('break-clock').textContent=number(s.breakLeft??C.cornerSeconds)+T.seconds;
const flash=s.events.find(e=>DB.flashEvents.includes(e.key));if(flash&&flash.id>lastFlash){lastFlash=flash.id;$('combat-flash').textContent=flash.text;}else if(!flash||s.elapsed-flash.time>C.flashSeconds)$('combat-flash').textContent='';}
function resume(){if(!active){home();return;}paused=false;if(scene!=='fight')fightView();else closeModal();}
function finish(){if(!active||G.state().phase!=='ended')return;const r=FC.settle(G.state());if(!result(r))return;active=false;save();sound('reward');showReport(r.report);}
function pauseMenu(){if(!active)return;paused=true;openModal('pause',`<h2 id="modal-title">${esc(T.pause)}</h2><div class="button-row">${button('resume',T.resume,{},'primary')}${button('home',T.home)}${button('export',T.save)}${button('rules',T.rules)}${button('surrender',T.surrender,{},'danger')}</div>`);}
function askSurrender(){openModal('surrender',`<h2 id="modal-title">${esc(T.surrenderAsk)}</h2><p>${esc(T.surrenderBody)}</p><div class="button-row">${button('close',T.cancel)}${button('confirm-surrender',T.surrender,{},'danger')}</div>`);}
document.addEventListener('click',event=>{const el=event.target.closest?.('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action,id=el.dataset.id,index=Number(el.dataset.index);if(action==='select-character'){chosen=id;showSelection();}if(action==='contract'){if(FC.state()){toast(T.profileLocked,true);return;}if(result(FC.create(chosen,'',legacy))){if(legacy)toast(T.legacy);legacy=null;try{localStorage.setItem(C.migrationKey,'1');}catch{}startFight(nextRival());}}if(action==='home')home();if(action==='tab')home(id);if(action==='rival'){rivalId=id;home('fight');}if(action==='start'||action==='prepare')startFight(id);if(action==='next-match')startFight(nextRival());if(action==='train-home')home('training');if(action==='train')result(FC.train(id),()=>home('training'));if(action==='respec')result(FC.respec(),()=>home('training'));if(action==='slot'){slot=index;home('build');}if(action==='talent-slot'){talentSlot=index;home('build');}if(action==='buy')result(FC.buy(id),()=>home('build'));if(action==='upgrade')result(FC.upgrade(id),()=>home('build'));if(action==='equip')result(FC.equip(slot,id),()=>home('build'));if(action==='unequip')result(FC.equip(index,null),()=>home('build'));if(action==='talent')result(FC.setTalent(talentSlot,id),()=>home('build'));if(action==='coach')call(id);if(action==='signature')signature();if(action==='pause')pauseMenu();if(action==='resume')resume();if(action==='speed'){speed=Number(el.dataset.value);for(const b of document.querySelectorAll('[data-action="speed"]'))b.classList.toggle('selected',Number(b.dataset.value)===speed);}if(action==='surrender')askSurrender();if(action==='confirm-surrender'){G.surrender();finish();}if(action==='settings')settings();if(action==='close'){closeModal();paused=false;}if(action==='fullscreen')fullscreen();if(action==='export')exportSave();if(action==='load')$('load-file').click();if(action==='new-game')newGame();if(action==='reset-confirm'){active=false;legacy=null;FC.reset();try{localStorage.removeItem(C.storageKey);localStorage.setItem(C.migrationKey,'1');}catch{}closeModal();showSelection();}if(action==='rules')openModal('rules',`${closeButton()}<h2 id="modal-title">${esc(T.rules)}</h2><p>${esc(T.rulesBody)}</p><p>${esc(T.coachHint)}</p><div class="signature-intro"><strong>${esc(hero()?.signature.name||T.signature)}</strong><p>${esc(hero()?.signature.hint||'')}</p></div>`);if(action==='rename')openModal('rename',`${closeButton()}<h2 id="modal-title">${esc(T.profileName)}</h2><input id="new-name" maxlength="${C.nameLength}" value="${esc(FC.state().name)}"><div class="button-row">${button('rename-confirm',T.saveName,{},'primary')}</div>`);if(action==='rename-confirm'){FC.setName($('new-name').value);closeModal();home();}if(action==='records')openModal('records',`${closeButton()}<h2 id="modal-title">${esc(T.records)}</h2>${recordsPanel()}`);if(action==='report'){const r=find(FC.state().history,id);if(r)showReport(r);}if(action==='db')dbModal();if(action==='validate')validateEditor();if(action==='db-export'){const data=validateEditor();if(data)download('window.GAME_DB = '+JSON.stringify(data,null,2).replace(/</g,'\\u003c')+';','text/javascript',T.dbName);}if(action==='html-export'){const data=validateEditor();if(data)exportHTML(data);}});
document.addEventListener('change',event=>{if(event.target.dataset.pref){prefs[event.target.dataset.pref]=event.target.checked;applyPrefs();}});
$('load-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;const before=FC.snapshot(),battle=G.snapshot(),wasActive=active;try{const imported=JSON.parse(await file.text());if(!imported.profile){if(imported.campaign){legacy=imported.campaign;active=false;FC.reset();closeModal();showSelection();toast(T.legacyChoose);return;}throw Error(T.invalidSave);}const loaded=FC.load(imported.profile);if(!loaded.ok)throw Error(loaded.message);active=false;if(imported.battle?.id===FC.state().activeBout&&imported.battle.player.characterId===FC.state().characterId)active=G.load(imported.battle).ok;if(!active&&FC.state().activeBout)FC.cancel();closeModal();save();home();toast(T.loadSuccess);}catch(error){if(before)FC.load(before);else FC.reset();if(battle)G.load(battle);active=wasActive;toast(error.message,true);}event.target.value='';});
document.addEventListener('keydown',event=>{if(event.target.closest?.('input,textarea,select'))return;if(event.key==='Tab'&&modalKind){const nodes=[...$('modal').querySelectorAll('button:not(:disabled),input,select,textarea')],first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}if(active&&scene==='fight'&&!modalKind&&!event.repeat){const cmd=DB.coaching.find(c=>c.key===event.code);if(cmd){event.preventDefault();call(cmd.id);}else if(event.code===C.signatureKey){event.preventDefault();signature();}}if(event.code==='Space'&&active&&scene==='fight'){event.preventDefault();if(!event.repeat){if(modalKind==='pause')resume();else if(!modalKind)pauseMenu();}}if(event.code==='Escape'&&modalKind){closeModal();paused=false;}});
window.addEventListener('resize',()=>renderer?.resize());window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(active&&scene==='fight'&&!modalKind)pauseMenu();}});
try{const stored=JSON.parse(localStorage.getItem(C.storageKey)||'null');if(stored?.profile&&FC.load(stored.profile).ok){if(stored.battle?.id===FC.state().activeBout&&stored.battle.player.characterId===FC.state().characterId)active=G.load(stored.battle).ok;if(!active&&FC.state().activeBout)FC.cancel();rivalId=nextRival();}else{const old=JSON.parse(localStorage.getItem(C.legacyKey)||'null');if(old?.campaign&&localStorage.getItem(C.migrationKey)!=='1')legacy=old.campaign;}}catch{}
if(FC.state())home();else showSelection();
function frame(now){const dt=lastFrame?Math.min(C.maxFrame,(now-lastFrame)/C.milliseconds):0;lastFrame=now;if(active&&scene==='fight'&&!modalKind&&!paused&&['fighting','corner'].includes(G.state().phase)){let left=dt*speed;while(left>0){const step=Math.min(left,C.step);G.tick(step);left-=step;if(G.state().phase==='ended')break;}const sounds=[...new Set(G.state().sounds)];G.state().sounds=[];for(const kind of sounds)sound(kind);if(G.state().phase==='ended')finish();saveClock+=dt;if(saveClock>=C.saveInterval){saveClock=0;save();}}hudClock+=dt;if(active&&scene==='fight'){if(hudClock>=C.hudInterval){hudClock=0;updateFight();}renderer?.render();}requestAnimationFrame(frame);}
requestAnimationFrame(frame);window.DuelUI={home,showSelection,startFight,resume,updateFight,call,signature,showReport,exportSave,save,frame,getRenderer:()=>renderer};
})();

</script></body></html>
