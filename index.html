<script id="game-db" src="./game-db.js"></script><script>
/* Permanent career, deliberate loadouts and the campaign economy. Data: game-db.js. */
(() => {
  'use strict';
  const DB=window.GAME_DB,D=DB.campaign,C=D.config;
  const clone=v=>JSON.parse(JSON.stringify(v));
  const find=(list,id)=>list.find(item=>item.id===id);
  const finite=v=>Number.isFinite(v);
  let S=null;
  const fmt=(key,args={})=>(D.text[key]||key).replace(/\{(\w+)\}/g,(_,k)=>args[k]??'');
  const result=(ok,key,args={})=>({ok,message:fmt(key,args)});
  const resources=()=>Object.fromEntries(Object.keys(D.resources).map(id=>[id,0]));
  function scaleCost(cost,factor){return Object.fromEntries(Object.entries(cost||{}).map(([id,value])=>[id,Math.ceil(value*factor)]));}
  function canAfford(cost){return !!S&&Object.entries(cost||{}).every(([id,value])=>finite(value)&&value>=0&&Object.hasOwn(D.resources,id)&&(S.resources[id]||0)>=value);}
  function pay(cost){for(const [id,value]of Object.entries(cost||{}))S.resources[id]-=value;}
  function credit(values){for(const [id,value]of Object.entries(values||{}))if(Object.hasOwn(D.resources,id))S.resources[id]=Math.min(C.resourceCap,S.resources[id]+Math.max(0,Math.floor(value)));}
  function garageAllowed(){return !S?result(false,'invalidSave'):S.activeMissionId?result(false,'activeChange'):null;}
  function apply(stats,changes,repeats=1){for(let n=0;n<repeats;n++)for(const change of changes||[]){const base=stats[change.stat]??(change.op==='multiply'?1:0);stats[change.stat]=change.op==='multiply'?base*change.value:base+change.value;}return stats;}
  function getLoadoutStats(loadout=S?.loadout||[],rigId=S?.rigId||DB.config.defaultRig,moduleRanks=S?.ownedModules||{}){
    const rig=find(DB.rigs,rigId),stats={...DB.config.baseStats,...rig.stats};
    if(!S)return stats;
    apply(stats,C.careerStats,Math.max(0,S.career.level-C.careerStartLevel));
    apply(stats,C.rigStats,Math.max(0,(S.rigRanks[rigId]||C.rigStartRank)-C.rigStartRank));
    for(const id of loadout)if(id){const mod=find(D.modules,id);apply(stats,mod.stats,moduleRanks[id]||0);}
    for(const id of S.researched)apply(stats,find(D.research,id)?.stats);
    apply(stats,find(D.doctrines,S.doctrineId)?.stats);
    return stats;
  }
  function getSupportStats(){const stats=clone(C.supportBase);if(!S)return stats;for(const id of S.researched)apply(stats,find(D.research,id)?.supportStats);apply(stats,find(D.doctrines,S.doctrineId)?.supportStats);return stats;}
  function getCapacity(){return C.powerBase+(S?.researched||[]).reduce((n,id)=>n+(find(D.research,id)?.powerBonus||0),0);}
  function modulePower(id,rank){const mod=find(D.modules,id);return mod?mod.power+Math.max(0,(rank??S.ownedModules[id]??1)-1)*(mod.rankPower||0):0;}
