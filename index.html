<script id="game-db" src="./game-db.js"></script><script>/* World, movement, autonomous combat and persistent RPG progression. Content is GAME_DB. */
(() => {
'use strict';
const DB=window.GAME_DB,C=DB.config,copy=v=>JSON.parse(JSON.stringify(v)),find=(a,id)=>a.find(x=>x.id===id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const talentIndex=Object.fromEntries(DB.talents.map(n=>[n.id,n]));
let S=null,H={},networkStats=null;
const text=(key,args={})=>(DB.ui[key]||key).replace(/\{(\w+)\}/g,(_,k)=>args[k]??'');
const ok=(message='',extra={})=>({ok:true,message,...extra}),fail=(key,args)=>({ok:false,message:text(key,args)});
function rng(){S.rng=(Math.imul(S.rng,C.randomMultiplier)+C.randomIncrement)>>>0;return S.rng/C.randomModulus;}
function chooseWeighted(list,weight=x=>x.weight){let n=rng()*list.reduce((a,v)=>a+weight(v),0);for(const v of list){n-=weight(v);if(n<=0)return v;}return list.at(-1);}
function notice(key,args={},kind='info'){const value=text(key,args);S.notices.unshift({text:value,kind,until:S.time+C.noticeTime});S.notices=S.notices.slice(0,C.toastMax);return value;}
function sound(id){S.sounds.push(id);}
function float(x,y,value,color){S.floats.push({x,y,text:String(value),color,life:C.floatTime,maxLife:C.floatTime});S.floats=S.floats.slice(-C.maxFloats);}
function effect(kind,x,y,radius,color,to=null){S.effects.push({kind,x,y,radius,color,to,life:C.effectTime,maxLife:C.effectTime});}
function apply(values,changes,times=1){for(let n=0;n<times;n++)for(const change of changes||[])values[change.stat]=change.op==='multiply'?(values[change.stat]??1)*change.value:(values[change.stat]??0)+change.value;return values;}
function worldPhase(){const span=C.dayLength+C.nightLength,phase=S.time%span,night=phase>=C.dayLength;return {night,label:text(night?'night':'day'),damageMultiplier:night?C.nightDamageMultiplier:1};}
function activeNpcs(){return mapDef().npcs.filter(n=>!n.schedule||(S.time+n.schedule.offset)%n.schedule.period<n.schedule.activeFor);}
function canTravel(){if(inCombat()||mapDef().group)return fail('busy');return activeNpcs().some(n=>n.service==='waystone'&&dist(n,S.player)<=C.interactRadius)?ok():fail('waystoneOnly');}
function blessingInfo(){const active=S.buffs.find(b=>b.until>S.time&&find(DB.blessings,b.id));if(!active)return null;return {...find(DB.blessings,active.id),stats:active.stats,remaining:Math.max(0,active.until-S.time)};}
function refreshDash(){const p=S.player;if(p.dashCharges>=C.dashCharges){p.dashCharges=C.dashCharges;p.dashReadyAt=0;return;}if(!p.dashReadyAt)p.dashReadyAt=S.time+C.dashCooldown;while(p.dashCharges<C.dashCharges&&p.dashReadyAt<=S.time){p.dashCharges++;p.dashReadyAt+=C.dashCooldown;}if(p.dashCharges>=C.dashCharges)p.dashReadyAt=0;}
function dashInfo(){const p=S.player;return {charges:p.dashCharges,max:C.dashCharges,remaining:p.dashCharges<C.dashCharges?Math.max(0,p.dashReadyAt-S.time):0,active:p.dashUntil>S.time};}
function dash(){if(!S)return fail('locked');refreshDash();const p=S.player;if(p.dashUntil>S.time)return fail('dashActive');if(p.dashCharges<=0)return fail('dashWait');let x=S.input.x,y=S.input.y,length=Math.hypot(x,y);if(length<C.dashDeadzone){x=p.lastMoveX||p.facing;y=p.lastMoveY||0;length=Math.hypot(x,y)||1;}p.dashX=x/length;p.dashY=y/length;p.dashUntil=S.time+C.dashDuration;p.dashCharges--;if(!p.dashReadyAt)p.dashReadyAt=S.time+C.dashCooldown;p.invulnerableUntil=Math.max(p.invulnerableUntil,S.time+C.dashInvulnerability);if(p.dashX)p.facing=p.dashX>0?1:-1;sound('dash');return ok();}
function consumableCount(id){const def=find(DB.consumables,id);if(!def)return 0;return def.pool?S[def.pool]||0:S.supplies[id]||0;}
function useConsumable(id){const def=find(DB.consumables,id),p=S.player;if(!def||consumableCount(id)<=0)return fail(id===C.healingConsumable?'noPotion':'noConsumable');const ready=p.consumableReady[id]||0;if(ready>S.time)return fail('consumableWait');const st=stats();if(def.resource&&p[def.resource]>=st[def.resource])return fail(def.resource==='hp'?'fullHp':'fullMp');if(def.pool)S[def.pool]--;else S.supplies[id]--;p.consumableReady[id]=S.time+def.cooldown;if(id===C.healingConsumable)p.potionAt=p.consumableReady[id];if(id===C.manaConsumable)p.manaPotionAt=p.consumableReady[id];if(def.resource==='hp')heal(st.hp*def.ratio*st.potionPower);else if(def.resource==='mp'){const amount=Math.min(st.mp-p.mp,st.mp*def.ratio);p.mp+=amount;float(p.x,p.y,'+'+Math.round(amount),DB.theme.colors.mp);}else{const exclusive=DB.consumables.filter(v=>v.category&&v.category===def.category).map(v=>v.buff);S.buffs=S.buffs.filter(b=>!exclusive.includes(b.id));addBuff(def.buff,def.stats,def.duration);}sound('heal');return ok();}

function fieldSpawns(){const map=mapDef(),inst=instance();inst.events??={};if(map.kind!=='field')return;const used=new Set();for(const spawn of map.spawns){let e=inst.enemies.find(e=>!used.has(e.id)&&(e.spawnId===spawn.id||!e.spawnId&&e.template===spawn.monster&&Math.abs(e.homeX-spawn.x)<C.spawnClearance&&Math.abs(e.homeY-spawn.y)<C.spawnClearance));if(!e){e=spawnEnemy(spawn,0);inst.enemies.push(e);}used.add(e.id);e.spawnId=spawn.id;e.patrol??=copy(spawn.patrol||[]);e.patrolIndex??=0;}}

function engrave(itemId,runeId){if(!activeNpcs().some(n=>n.service==='smith'&&dist(n,S.player)<=C.interactRadius))return fail('townOnly');const item=S.inventory.find(i=>i.id===itemId),rune=find(DB.runes,runeId);if(!item||find(DB.items,item.template).slot!=='weapon'||!rune)return fail('locked');if(S.gold<rune.gold||Object.entries(rune.materials).some(([id,n])=>S.materials[id]<n))return fail('notEnough');S.gold-=rune.gold;for(const [id,n]of Object.entries(rune.materials))S.materials[id]-=n;item.rune=runeId;item.bound=true;return ok();}
function receiveSupport(support,id){const st=stats();if(support.heal)heal(st.hp*support.heal);if(support.shield)shield(st.hp*support.shield);if(support.mana)S.player.mp=Math.min(st.mp,S.player.mp+st.mp*support.mana);if(support.stats)addBuff(id,support.stats,support.duration);effect('buff',S.player.x,S.player.y,1,DB.theme.colors.brassLight);}

function stepSharedHazards(id){const startMap=S.mapId;for(const h of S.hazards){const source=instance().enemies.find(e=>e.id===h.source);if(h.source&&(!source||source.dead))continue;h.hitPlayers??={};if(h.at<=S.time&&!h.hitPlayers[id]){h.hitPlayers[id]=true;if(pointInHazard(h,S.player))hurtPlayer(h.damage,source,h.element);if(S.mapId!==startMap)break;}}}

 S.masteryLevel??=0;S.masteryXp??=0;S.masteryPoints??=0;S.masteryRanks??={};S.collection??={};S.spirits??={};S.spiritId??=null;S.metrics??={};S.reputation??={};S.codexClaims??={};S.choices??={};S.companions??={};S.companionId??=null;S.companionAt??=0;S.trial??=null;S.expeditionRule??=DB.expeditionRules[0].id;

 for(const map of Object.values(S.instances)){map.mechanisms??={};map.zoneAt??={};map.events??={};}

function selectedBranches(){return Object.values(S.advancements);}
function advancementOptions(stage){const def=DB.advancementStages.find(v=>v.id===stage);if(!def)return [];return Object.values(DB.branches).filter(b=>b.class===S.classId&&b.stage===stage&&(stage===1||b.parent===S.advancements[stage-1]));}
function advance(id){const branch=DB.branches[id];if(!branch||branch.class!==S.classId)return fail('locked');if(mapDef().kind!=='town')return fail('townOnly');if(S.advancements[branch.stage])return fail('advancementConflict');if(S.level<branch.level)return fail('advancementLevel',{level:branch.level});if(branch.parent&&S.advancements[branch.stage-1]!==branch.parent)return fail('advancementLocked');const stage=find(DB.advancementStages,branch.stage);if(branch.parent&&branchPoints(branch.parent)<stage.requiredPoints)return fail('requiresBranch',{count:stage.requiredPoints});S.advancements[branch.stage]=id;sound('level');return ok();}
function reputationStatus(id){const def=find(DB.factions,id),value=S.reputation[id]||0,rank=[...def.ranks].reverse().find(r=>value>=r.value)||def.ranks[0];return {value,rank,next:def.ranks.find(r=>r.value>value)};}

function expedition(){return find(DB.expeditionRules,S.expeditionRule)||DB.expeditionRules[0];}
function companionInfo(){const def=find(DB.companions,S.companionId);return def&&S.companions[def.id]?.unlocked?{...def,bond:S.companions[def.id].bond||0}:null;}
function selectCompanion(id){if(mapDef().kind!=='town')return fail('townOnly');if(id&&!S.companions[id]?.unlocked)return fail('companionLocked');S.companionId=id||null;S.companionAt=S.time+(companionInfo()?.cooldown||0);return ok();}
function addBond(n){const c=companionInfo();if(c)S.companions[c.id].bond=clamp((S.companions[c.id].bond||0)+n,0,C.companionBondCap);}
function updateCompanion(){const c=companionInfo();if(!c||mapDef().kind==='town'||!inCombat()||S.companionAt>S.time)return;const st=stats(),p=S.player,target=nearestEnemy(c.range);if(c.mode==='heal'&&p.hp/st.hp>c.hpThreshold)return;if(c.mode!=='heal'&&!target)return;const value=st[c.scale]*c.power*(1+c.bond*C.companionBondScale);if(c.mode==='heal')heal(value);else if(c.mode==='shield')shield(value);else if(target)areaDamage(target.x,target.y,c.radius,value,{color:DB.theme.colors.mp});S.companionAt=S.time+c.cooldown;effect('buff',p.x,p.y,1,DB.theme.colors.mp);sound(c.mode==='heal'?'heal':'buff');}
function claimCodex(id,index){const def=DB.monsters[id],reward=DB.codexRewards[index],key=id+':'+index;if(!def||!reward||S.codexClaims[key]||(S.killCounts[id]||0)<reward.kills)return fail('locked');S.codexClaims[key]=true;grant(reward.rewards);return ok();}
function emitPattern(enemy,pattern){
 const p=S.player,d=dist(enemy,p)||1,dx=(p.x-enemy.x)/d,dy=(p.y-enemy.y)/d,base=Math.atan2(dy,dx),bursts=pattern.bursts||1,angles=pattern.angles||[0],offsets=pattern.offsets||[[0,0]];
 for(let burst=0;burst<bursts;burst++)for(const rotation of angles){if(S.hazards.length>=C.enemyPatternMax)return;const offset=offsets[burst%offsets.length],angle=base+rotation,kind=pattern.kind==='target'?'circle':pattern.kind,at=S.time+pattern.windup+burst*(pattern.interval||0);S.hazards.push({id:entityId('hazard'),source:enemy.id||null,element:pattern.element||DB.monsters[enemy.template]?.element||DB.elements[0].id,circuit:pattern.circuit||null,kind,name:pattern.name||DB.monsters[enemy.template]?.name||'',x:(pattern.kind==='target'?p.x:enemy.x)+offset[0],y:(pattern.kind==='target'?p.y:enemy.y)+offset[1],dx:Math.cos(angle),dy:Math.sin(angle),radius:pattern.radius||pattern.range||1,innerRadius:pattern.innerRadius||0,angle:pattern.angle||C.hazardDefaultAngle,length:pattern.length||pattern.range||1,damage:enemy.attack*(pattern.damage||1),at,expires:at+C.hazardActiveTime,hit:false,dash:!!pattern.dash&&burst===0});}
}
function useMechanism(id){const def=mapDef().mechanisms.find(m=>m.id===id);if(!def||dist(def,S.player)>C.interactRadius||instance().mechanisms[id])return fail('locked');instance().mechanisms[id]=true;if(def.circuit)S.hazards=S.hazards.filter(h=>h.circuit!==def.circuit);metric('mechanism:'+id);effect('buff',def.x,def.y,2,DB.theme.colors.brassLight);sound('buff');return ok();}

function spawnEventWave(event,state){const waves=event.waves||[event.spawns];state.enemies=[];for(const spawn of waves[state.wave||0]){const e=spawnEnemy(spawn,0);e.eventId=event.id;instance().enemies.push(e);state.enemies.push(e.id);}state.phase='active';}
function startTrial(id){const def=find(DB.trials,id);if(!def||!activeNpcs().some(n=>n.service==='arena'&&dist(n,S.player)<=C.interactRadius)||mapDef().id===def.map)return fail('noInteraction');if(S.level<def.minLevel)return fail('trialLocked');if(S.gold<def.fee)return fail('notEnough');S.gold-=def.fee;delete S.instances[def.map];S.expeditionRule=DB.expeditionRules[0].id;enterMap(def.map);S.trial={id,wave:0,enemies:[],phase:'waiting',next:S.time+C.trialNextWave};return ok();}
function updateTrial(){const run=S.trial;if(!run||mapDef().id!==find(DB.trials,run.id)?.map)return;const def=find(DB.trials,run.id);if(run.phase==='active'&&run.enemies.every(id=>!instance().enemies.some(e=>e.id===id&&!e.dead))){run.wave++;run.phase=run.wave>=def.waves.length?'ready':'waiting';run.next=S.time+C.trialNextWave;if(run.phase==='ready')notice('trialReady',{},'good');}if(run.phase==='waiting'&&run.next<=S.time){run.enemies=[];instance().enemies=instance().enemies.filter(e=>!e.dead);for(const spawn of def.waves[run.wave]){const e=spawnEnemy(spawn,0);e.engagedUntil=S.time+C.outOfCombat;e.eventId='trial';instance().enemies.push(e);run.enemies.push(e.id);}run.phase='active';}}

function xpNeeded(level=S.level){return Math.round((C.xpBase+C.xpGrowth*Math.pow(Math.max(0,level-1),C.xpPower))*([...DB.xpBands].reverse().find(b=>level>=b.level)?.multiplier||1));}
function itemStats(item){const def=find(DB.items,item.template),rarity=find(DB.rarities,item.rarity),scale=(1+(item.level-1)*C.itemLevelScale)*rarity.multiplier*(1+item.enhance*C.upgradePower),changes=[];for(const st of def.stats)changes.push({...st,value:st.op==='multiply'?1+(st.value-1)*scale:st.value*scale});for(const id of item.affixes){const affix=find(DB.affixes,id);for(const st of affix?.stats||[])changes.push({...st,value:st.op==='multiply'?1+(st.value-1)*(1+(item.level-1)*C.affixScale):st.value*(1+(item.level-1)*C.affixScale)});}if(item.rune)changes.push(...copy(find(DB.runes,item.rune)?.stats||[]));return changes;}
function stats(equipment=S?.equipment,overrides={}){if(!S)return null;if(networkStats&&equipment===S.equipment&&!Object.keys(overrides).length)return {...networkStats};const ch=classDef(),values={...DB.baseStats,...ch.stats};for(const [key,value]of Object.entries(ch.growth))values[key]+=value*(S.level-1);apply(values,raceDef().stats);for(const id of Object.values(equipment||{})){const item=overrides[id]||S.inventory.find(i=>i.id===id);if(item)apply(values,itemStats(item));}for(const [id,rank]of Object.entries(S.talents)){const node=talentIndex[id];if(node&&selectedBranches().includes(node.branch))apply(values,node.stats,rank);}const companion=companionInfo();if(companion)apply(values,companion.stats);if(mapDef()?.group)values.manaRegen*=expedition().manaRegen;for(const b of S.buffs)if(b.until>S.time)apply(values,b.stats);for(const id of Object.keys(S.discoveries||{}))if(S.discoveries[id])apply(values,discoveryDef(id)?.stats);for(const set of DB.equipmentSets){const count=Object.values(equipment||{}).filter(id=>find(DB.items,(overrides[id]||S.inventory.find(i=>i.id===id))?.template)?.set===set.id).length;for(const bonus of set.bonuses)if(count>=bonus.count)apply(values,bonus.stats);}for(const track of DB.masteryTracks)apply(values,track.stats,S.masteryRanks[track.id]||0);const spirit=find(DB.spirits,S.spiritId);if(spirit&&S.spirits[spirit.id])apply(values,spirit.stats);if(H.stats)Object.assign(values,H.stats(values));for(const [key,[min,max]]of Object.entries(DB.statCaps))values[key]=clamp(values[key],min,max);values.hp=Math.round(values.hp);values.mp=Math.round(values.mp);return values;}
function itemName(item){const def=find(DB.items,item.template),prefix=item.affixes[0]&&find(DB.affixes,item.affixes[0])?.name;return (prefix?prefix+' ':'')+def.name+(item.enhance?' +'+item.enhance:'');}
function itemScore(item){return itemStats(item).reduce((a,s)=>a+Math.abs(s.op==='multiply'?(s.value-1)*C.percentage:s.value),0)+find(DB.rarities,item.rarity).multiplier*C.percentage;}
function makeItem(template,rarity='common',level=S.level){const def=find(DB.items,template),rar=find(DB.rarities,rarity);if(!def||!rar)return null;const pool=copy(DB.affixes),affixes=[];while(affixes.length<rar.affixes&&pool.length){const i=Math.floor(rng()*pool.length);affixes.push(pool.splice(i,1)[0].id);}return {id:'item_'+(++S.itemSeq),template,rarity,level:clamp(Math.floor(level),1,C.maxMonsterLevel),enhance:0,affixes,favorite:false};}

function updateEnemies(dt,only=null){const map=mapDef(),p=S.player;for(const e of only?[only]:instance().enemies){const m=DB.monsters[e.template];e.flash=Math.max(0,e.flash-dt);e.moving=false;if(e.dead){if(map.kind==='field'&&!e.eventId&&S.time>=e.respawnAt&&dist(e,p)>C.aggroRange){e.dead=false;e.hp=e.maxHp;e.x=e.homeX;e.y=e.homeY;e.phase=0;e.patternIndex=0;e.addsSpawned=false;e.threat={};e.contributions={};e.lastOwner=null;e.engagedUntil=0;e.castingUntil=0;e.attackAt=S.time+C.enemyAttackStartDelay;}continue;}for(const status of e.statuses)if(status.until>S.time&&status.id!=='slow'&&status.next<=S.time){status.next+=C.statusTick;damageEnemy(e,status.power*C.statusTick,{dot:true,sourceOwner:status.owner,element:DB.online.statusElements[status.id]});}e.statuses=e.statuses.filter(s=>s.until>S.time);if(e.dead)continue;if(m.boss){const phase=m.phases?.[e.phase]||(!m.phases&&!e.addsSpawned?{threshold:C.bossPhaseRatio,adds:m.adds}:null);if(phase&&e.hp/e.maxHp<phase.threshold){e.phase++;e.addsSpawned=true;e.patternIndex=0;for(const [i,id]of phase.adds.entries()){const off=C.bossAddOffsets[i%C.bossAddOffsets.length];instance().enemies.push(spawnEnemy({monster:id,level:e.level,x:e.x+off[0],y:e.y+off[1]},0));}sound('boss');}}if(e.castingUntil>S.time)continue;const d=dist(e,p),engaged=e.engagedUntil>S.time;if(e.patrol?.length&&d>C.aggroRange&&!engaged){const point=e.patrol[e.patrolIndex%e.patrol.length],aim={x:point[0],y:point[1]};if(dist(e,aim)<C.pathWaypointTolerance)e.patrolIndex++;steerEnemy(e,aim,e.speed,dt);e.homeX=e.x;e.homeY=e.y;continue;}const home=Math.hypot(e.x-e.homeX,e.y-e.homeY);if(home>C.leashRange||d>C.aggroRange&&!engaged&&home>C.playerRadius){steerEnemy(e,{x:e.homeX,y:e.homeY},e.speed,dt);e.hp=Math.min(e.maxHp,e.hp+e.maxHp*C.returnHeal*dt);e.moving=true;continue;}if(d>C.aggroRange&&!engaged)continue;e.facing=p.x>=e.x?1:-1;const range=m.range;if(d>range){const speed=e.speed*(e.statuses.some(s=>s.id==='slow')?C.slowFactor:1);steerEnemy(e,p,speed,dt);}if(d<=range function pointInHazard(h,p){if(h.kind==='line'){const x=p.x-h.x,y=p.y-h.y,along=x*h.dx+y*h.dy,across=Math.abs(x*h.dy-y*h.dx);return along>=-C.playerRadius&&along<=h.length+C.playerRadius&&across<h.radius+C.playerRadius;}const d=Math.hypot(p.x-h.x,p.y-h.y);if(h.kind==='ring')return d<h.radius+C.playerRadius&&d>Math.max(0,h.innerRadius-C.playerRadius);if(h.kind==='cone'){const angle=Math.atan2(p.y-h.y,p.x-h.x)-Math.atan2(h.dy,h.dx),delta=Math.atan2(Math.sin(angle),Math.cos(angle));return d<h.radius+C.playerRadius&&(d<C.playerRadius||Math.abs(delta)<h.angle/2);}return d<h.radius+C.playerRadius;}
function updateHazards(){for(const h of S.hazards){const source=instance().enemies.find(e=>e.id===h.source);if(h.source&&(!source||source.dead)){h.expires=S.time;continue;}if(!h.hit&&h.at<=S.time){h.hit=true;if(pointInHazard(h,S.player))hurtPlayer(h.damage,source,h.element);if(source&&h.kind==='line'&&h.dash)moveActor(source,h.dx*h.length*C.hazardDashFraction,h.dy*h.length*C.hazardDashFraction);}}S.hazards=S.hazards.filter(h=>h.expires>S.time);}
function updateProjectiles(dt){for(const shot of S.projectiles){shot.life-=dt;shot.x+=shot.vx*dt;shot.y+=shot.vy*dt;if(occupied(mapDef(),shot.x,shot.y,0)){shot.life=0;continue;}for(const e of instance().enemies){if(e.dead||shot.hitIds.includes(e.id)||Math.hypot(e.x-shot.x,e.y-shot.y)>shot.radius+C.playerRadius*DB.monsters[e.template].size)continue;shot.hitIds.push(e.id);if(shot.options.radius)areaDamage(shot.x,shot.y,shot.options.radius,shot.damage,shot.options);else damageEnemy(e,shot.damage,shot.options);shot.pierce--;if(shot.pierce<=0||shot.hitIds.length>=C.maxProjectileHits){shot.life=0;break;}}}S.projectiles=S.projectiles.filter(s=>s.life>0);}
function advanceMovement(p,input,st,dt,previousTime){const len=Math.hypot(input.x,input.y),dx=len>C.inputDeadzone?input.x/Math.max(1,len):0,dy=len>C.inputDeadzone?input.y/Math.max(1,len):0;const dashTime=Math.max(0,Math.min(previousTime+dt,p.dashUntil)-previousTime),walkTime=dt-dashTime;p.moving=!!(dx||dy||dashTime);if(dx||dy){p.lastMoveX=dx;p.lastMoveY=dy;}if(dashTime){moveActor(p,p.dashX*C.dashDistance/C.dashDuration*dashTime,p.dashY*C.dashDistance/C.dashDuration*dashTime);if(p.dashX)p.facing=p.dashX>0?1:-1;}else if(dx)p.facing=dx>0?1:-1;if(walkTime>0)moveActor(p,dx*st.speed*walkTime,dy*st.speed*walkTime);}
function predictMovement(p,input,dt,previousTime){advanceMovement(p,input,stats(),dt,previousTime);}
function tick(dt,shared=false){if(!S)return;dt=Math.min(dt,C.step);const previousTime=S.time;S.time+=dt;refreshDash();S.playTime+=dt;S.buffs=S.buffs.filter(b=>b.until>S.time);S.notices=S.notices.filter(n=>n.until>S.time);S.lootFeed=S.lootFeed.filter(n=>n.until>S.time);const p=S.player,st=stats();advanceMovement(p,S.input,st,dt,previousTime);p.hp=Math.min(st.hp,p.hp+(st.hpRegen+(mapDef().kind==='town'?st.hp*C.safeRegen:0))*dt);p.mp=Math.min(st.mp,p.mp+st.manaRegen*dt*(mapDef().kind==='town'?1+C.safeRegen:1));p.shield=Math.min(p.shield,st.hp*C.shieldCapRatio);p.flash=Math.max(0,p.flash-dt);p.attackFlash=Math.max(0,(p.attackFlash||0)-dt);if(mapDef().kind!=='town'){if(!shared){updateMechanics();updateTrial();updateEnemies(dt);}playerCombat();updateProjectiles(dt);if(!shared)updateHazards();updateCompanion();}if(!shared)updateWorld();for(const list of [S.effects,S.floats,S.orbs])for(const e of list)e.life-=dt;S.effects=S.effects.filter(x=>x.life>0);S.floats=S.floats.filter(x=>x.life>0);for(const orb of S.orbs)if(S.time-orb.at>C.orbDelay){const d=dist(orb,p)||1;orb.x+=(p.x-orb.x)/d*C.dropMagnetSpeed*dt;orb.y+=(p.y-orb.y)/d*C.dropMagnetSpeed*dt;if(d<C.pickupRadius)orb.life=0;}S.orbs=S.orbs.filter(x=>x.life>0);S.shake=Math.max(0,S.shake-DB.render.shakeDecay*dt);}
function setInput(x,y){if(S)S.input={x:clamp(x,-1,1),y:clamp(y,-1,1)};}
function objectiveProgress(quest,index){const o=quest.objectives[index],record=S.quests[quest.id];let value=0;const key=o.kind==='kill'?(o.group?'killGroup:'+o.group+':'+o.target:'kill:'+o.map+':'+o.target):o.kind+':'+o.target;if(o.kind==='kill')value=record?.baselineMetrics?(S.metrics[key]||0)-(record.baselineMetrics[key]||0):(S.killCounts[o.target]||0)-(record?.baseline?.[o.target]||0);if(o.kind==='boss')value=S.bossKills[o.target]||0;if(['event','tier','trial','mechanism'].includes(o.kind))value=(S.metrics[key]||0)-(quest.repeatable?(record?.baselineMetrics?.[key]||0):0);if(o.kind==='interact')value=S.interactions[o.target]||0;if(o.kind==='material')value=S.materials[o.target]||0;if(o.kind==='visit')value=S.visited[o.target]?1:0;if(o.kind==='discover')value=S.discoveries[o.target]?1:0;return clamp(value,0,o.count);}
function questStatus(id){const q=find(DB.quests,id),r=S.quests[id];if(!q)return 'locked';if(r?.status==='complete'&&!q.repeatable)return 'complete';if(r?.status==='active')return q.objectives.every((o,i)=>objectiveProgress(q,i)>=o.count)?'ready':'active';if(q.repeatable&&r?.completedAt!=null&&S.time-r.completedAt<(q.cooldown||C.questRepeatCooldown))return 'cooling';if((!q.requires||S.quests[q.requires]?.status==='complete')&&S.level>=(q.minLevel||1))return 'available';return 'locked';}
function nearNpc(id){return activeNpcs().some(n=>n.id===id&&dist(n,S.player)<=C.interactRadius);}
function acceptQuest(id){const q=find(DB.quests,id);if(!q||questStatus(id)!=='available')return fail('locked');if(!nearNpc(q.npc))return fail('returnNpc');S.quests[id]={status:'active',baseline:copy(S.killCounts),baselineMetrics:copy(S.metrics),completions:S.quests[id]?.completions||0};notice('questAccepted',{},'good');return ok();}
function grant(reward){if(reward.xp)gainXp(reward.xp);if(reward.gold)S.gold=clamp(S.gold+reward.gold,0,C.maxGold);if(reward.potions)S.potions+=reward.potions;if(reward.points)S.points+=reward.points;for(const [id,n]of Object.entries(reward.materials||{}))addMaterial(id,n);for(const [id,n]of Object.entries(reward.reputation||{}))S.reputation[id]=clamp((S.reputation[id]||0)+n,0,C.repMax);for(const [id,n]of Object.entries(reward.supplies||{})){const c=find(DB.consumables,id);if(c?.pool)S[c.pool]=(S[c.pool]||0)+n;else S.supplies[id]=(S.supplies[id]||0)+n;}if(reward.companion){S.companions[reward.companion]={unlocked:true,bond:S.companions[reward.companion]?.bond||0};if(!S.companionId)S.companionId=reward.companion;}}
function completeQuest(id,choiceId=null){const q=find(DB.quests,id);if(!q||questStatus(id)!=='ready')return fail('locked');if(!nearNpc(q.npc))return fail('returnNpc');const choice=q.choices&&find(q.choices,choiceId);if(q.choices&&!choice)return fail('choiceRequired');for(const o of q.objectives)if(o.consume&&o.kind==='material')S.materials[o.target]-=o.count;const record=S.quests[id];record.status='complete';record.completedAt=S.time;record.completions=(record.completions||0)+1;if(choice){record.choice=choice.id;S.choices[id]=choice.id;}grant(q.rewards);if(choice)grant(choice.rewards);if(q.final)S.chapterDone=true;notice('questCompleted',{},'good');sound('level');return ok('',{final:!!q.final});}
function trackedQuest(){const active=DB.quests.find(q=>q.main&&['ready','active'].includes(questStatus(q.id)))||DB.quests.find(q=>['ready','active'].includes(questStatus(q.id)));if(active){const status=questStatus(active.id),index=active.objectives.findIndex((o,i)=>objectiveProgress(active,i)<o.count),objective=active.objectives[Math.max(0,index)],npc=Object.values(DB.maps).flatMap(m=>m.npcs.map(n=>({...n,map:m.id}))).find(n=>n.id===active.npc);return {quest:active,status,line:status==='ready'?text('readyToClaim'):objective.label+' '+objectiveProgress(active,Math.max(0,index))+'/'+objective.count,map:status==='ready'?npc?.map:objective.map||npc?.map,npc:status==='ready'?active.npc:null};}const offer=DB.quests.find(q=>q.main&&questStatus(q.id)==='available');if(offer){const map=Object.values(DB.maps).find(m=>m.npcs.some(n=>n.id===offer.npc));return {quest:offer,status:'available',line:text('questAvailable'),map:map?.id,npc:offer.npc};}return null;}
function guardiansRemaining(){return instance().enemies.filter(e=>e.guardian&&!e.dead).length;}
function nearby(){const map=mapDef(),list=[];for(const n of activeNpcs())list.push({...n,kind:'npc',label:n.name});for(const p of map.portals)list.push({...p,kind:'portal',label:p.name});for(const ch of map.chests)if(!instance().chests[ch.id])list.push({...ch,kind:'chest',label:text('chest')});for(const r of map.resources)if(!instance().resources[r.id]||r.respawn&&S.time-instance().resources[r.id]>=r.respawn)list.push({...r,kind:'resource',label:find(DB.materials,r.type).name});for(const d of map.discoveries)if(!S.discoveries[d.id])list.push({...d,kind:'discovery',label:d.name});for(const m of map.mechanisms)if(!instance().mechanisms[m.id])list.push({...m,kind:'mechanism',label:m.name});for(const e of map.events)list.push({...e,kind:'event',label:e.name});return list.filter(v=>dist(v,S.player)<=C.interactRadius).sort((a,b)=>dist(a,S.player)-dist(b,S.player))[0]||null;}
function portalAllowed(portal){if(portal.requiresQuest&&S.quests[portal.requiresQuest]?.status!=='complete')return fail('requiresQuest',{quest:find(DB.quests,portal.requiresQuest).name});if(portal.requiresGuardians&&guardiansRemaining()>0)return fail('requiresGuardians');return ok();}
function interact(){const n=nearby();if(!n)return fail('noInteraction');if(n.kind==='mechanism')return useMechanism(n.id);if(n.kind==='npc'){S.interactions[n.id]=(S.interactions[n.id]||0)+1;return ok('',{interaction:n});}if(n.kind==='discovery'||n.kind==='event')return ok('',{interaction:n});if(n.kind==='portal'){const allowed=portalAllowed(n);if(!allowed.ok)return allowed;if(DB.maps[n.to].kind==='dungeon'&&mapDef().group!==DB.maps[n.to].group)return ok('',{interaction:{...n,kind:'dungeon'}});return enterMap(n.to,n.spawn,S.runTier);}if(n.kind==='chest'){instance().chests[n.id]=true;grant(n);if(rng()<(n.equipmentChance??C.defaultChestEquipmentChance))giveItem(rollEquipment(mapDef().level+(find(DB.dungeonTiers,S.runTier)?.levelBonus||0),n.rarity));return ok();}if(n.kind==='resource'){instance().resources[n.id]=S.time||C.step;addMaterial(n.type,n.amount);float(n.x,n.y,'+'+n.amount+' '+find(DB.materials,n.type).name,DB.theme.colors.good);sound('loot');return ok();}return ok();}
function enterDungeon(portal,tierId,ruleId=DB.expeditionRules[0].id){const actual=mapDef().portals.find(p=>p.id===portal.id&&p.to===portal.to),tier=find(DB.dungeonTiers,tierId);if(!actual||dist(actual,S.player)>C.interactRadius||!tier)return fail('locked');const allowed=portalAllowed(actual);if(!allowed.ok)return allowed;const map=DB.maps[actual.to];if((S.clears[map.group]||0)<tier.requiredClears)return fail('tierLocked',{count:tier.requiredClears});if(!find(DB.expeditionRules,ruleId))return fail('locked');S.expeditionRule=ruleId;return enterMap(actual.to,actual.spawn,tierId);}
function travel(id){const map=DB.maps[id];if(!map||!map.waypoint||!S.visited[id])return fail('locked');const allowed=canTravel();if(!allowed.ok)return allowed;return enterMap(id,map.waypoint);}
function potion(){return useConsumable(C.healingConsumable);}

function dispose(id,mode='salvage'){if(mapDef().kind!=='town')return fail('townOnly');const item=S.inventory.find(i=>i.id===id);if(!canDispose(item))return fail('deleteProtected');if(mode==='sell'){S.gold=Math.min(C.maxGold,S.gold+Math.round(C.sellValue*find(DB.rarities,item.rarity).multiplier*item.level));S.inventory=S.inventory.filter(i=>i.id!==id);return ok(text('sold'));}return salvageItem(item);}

function upgrade(id){if(mapDef().kind!=='town'||!activeNpcs().some(n=>n.service==='smith'&&dist(n,S.player)<=C.interactRadius))return fail('townOnly');const item=S.inventory.find(i=>i.id===id);if(!item||item.enhance>=C.upgradeMax)return fail('maxUpgrade');const cost=upgradeCost(item);if(S.gold<cost.gold||S.materials.ore<cost.ore)return fail('notEnough');S.gold-=cost.gold;S.materials.ore-=cost.ore;item.enhance++;sound('heavy');return ok(text('upgraded'));}
function craft(id){if(!activeNpcs().some(n=>n.service==='smith'&&dist(n,S.player)<=C.interactRadius))return fail('townOnly');const recipe=find(DB.recipes,id);if(recipe&&S.level<(recipe.minLevel||1))return fail('craftLevelGate',{level:recipe.minLevel});if(recipe&&!reputationAllowed(recipe.reputation))return fail('reputationGate');if(!recipe||recipe.classes&&!recipe.classes.includes(S.classId)||S.gold<recipe.gold||Object.entries(recipe.materials).some(([k,v])=>S.materials[k]<v))return fail('notEnough');S.gold-=recipe.gold;for(const [k,v]of Object.entries(recipe.materials))S.materials[k]-=v;giveItem(makeItem(recipe.smartWeapon?classDef().starter:recipe.item,recipe.rarity,S.level));return ok(text('crafted'));}
function buy(id){const npc=activeNpcs().find(n=>n.service==='merchant'&&dist(n,S.player)<=C.interactRadius);if(!npc)return fail('noInteraction');const item=shopInventory(npc).find(i=>i.id===id);if(!item)return fail('locked');const stock=shopStatus(item,npc);if(stock.locked)return fail('shopLevelGate',{level:item.minLevel});if(stock.remaining===0)return fail('soldOut');if(S.gold<item.price)return fail('notEnough');S.gold-=item.price;if(item.kind==='equipment')giveItem(makeItem(item.item,item.rarity,item.level));else if(item.kind==='material')addMaterial(item.material,item.amount);else{const def=find(DB.consumables,item.consumable);if(def.pool)S[def.pool]=(S[def.pool]||0)+item.amount;else S.supplies[def.id]=(S.supplies[def.id]||0)+item.amount;}S.shopPurchases[stock.key]=(S.shopPurchases[stock.key]||0)+1;sound('loot');return ok();}
function rest(meal=false){if(!activeNpcs().some(n=>n.service==='inn'&&dist(n,S.player)<=C.interactRadius))return fail('townOnly');const cost=meal?DB.inn.cost:DB.inn.restCost;if(S.gold<cost)return fail('notEnough');S.gold-=cost;if(meal){addBuff(C.foodBuffId,DB.inn.stats,DB.inn.duration);sound('buff');return ok(text('mealApplied'));}S.player.hp=stats().hp;S.player.mp=stats().mp;sound('heal');return ok(text('healed'));}
function bless(id){if(!activeNpcs().some(n=>n.service==='temple'&&dist(n,S.player)<=C.interactRadius))return fail('townOnly');const blessing=find(DB.blessings,id);if(!blessing)return fail('locked');const current=blessingInfo();if(current?.id===id&&current.remaining>=blessing.duration-C.blessingRefreshTolerance)return fail('blessingFull');if(S.gold<blessing.cost)return fail('notEnough');S.gold-=blessing.cost;S.buffs=S.buffs.filter(b=>!DB.blessings.some(x=>x.id===b.id));addBuff(id,blessing.stats,blessing.duration);sound('buff');return ok();}
function branchPoints(id){return Object.entries(S.talents).reduce((sum,[key,rank])=>sum+(talentIndex[key]?.branch===id?rank:0),0);}
function learn(id){const node=find(DB.talents,id);if(!node||node.class!==S.classId)return fail('locked');if(!selectedBranches().includes(node.branch))return fail('advancementRequired');if(S.level<(node.minLevel||1))return fail('talentLevel',{level:node.minLevel});if((S.talents[id]||0)>=node.maxRank)return fail('learned');if(S.points<node.cost)return fail('noPoints');if(branchPoints(node.branch)<node.requires)return fail('requiresBranch',{count:node.requires});S.points-=node.cost;S.talents[id]=(S.talents[id]||0)+1;sound('buff');return ok(text('talentNotice'));}

  if(this.segments.length>this.options.maxPendingInputs)this.segments.splice(0,this.segments.length-this.options.maxPendingInputs);const decay=Math.exp(-this.options.predictionLerp*dt);this.offset.x*=decay;this.offset.y*=decay;if(Math.hypot(this.offset.x,this.offset.y)<this.options.motionEpsilon)this.offset={x:0,y:0};return packet;}

async function establish(){if(active)return;const startGeneration=generation,session=await request('session');if(startGeneration!==generation)return;if(!session.ok){showAuth();return;}backup=G.snapshot();active=true;connected=false;blocked=false;movement.clear();generation++;G.acceptNetworkState(session.state);ui().showGame();status();if(health?.transport==='websocket'){connectSocket();return;}const connectionGeneration=generation;source=new EventSource('/api/v1/events?protocol='+O.protocol,{withCredentials:true});let first=true;source.addEventListener('state',event=>{if(connectionGeneration!==generation)return;const data=JSON.parse(event.data);acceptPacket({event:'state',data},first||data.network?.connectionId!==movement.connectionId);first=false;});source.addEventListener('frame',event=>{if(connectionGeneration===generation)acceptPacket({event:'frame',data:JSON.parse(event.data)});});source.addEventListener('replaced',()=>{if(connectionGeneration===generation)replaced();});source.onerror=()=>{if(connectionGeneration!==generation||blocked)return;connected=false;G.setInput(0,0);status();return checkSession(connectionGeneration);};}

function tradeBody(context){const trade=context.trade;if(!trade)return '';const mine=trade.offers[view.profile.id],items=tradeItems();return `<section class="trade-panel"><h3>${T.trade}</h3><p>${T.tradeHint}</p><div class="trade-offers">${trade.members.map(id=>`<article><strong>${esc(trade.names[id])}</strong><p>${trade.offers[id]?.coins||0} ${T.crowns}</p>${(trade.offers[id]?.items||[]).map(i=>`<small>${esc(G.itemName(i))}</small>`).join('')}${trade.confirmed[id]===trade.revision?tag(T.tradeWaiting):''}</article>`).join('')}</div><label>${T.tradeSelect}<select id="online-trade-items" multiple size="${O.tradeSelectRows}">${[...items,...mine?.items||[]].map(i=>`<option value="${i.id}" ${mine?.items.some(v=>v.id===i.id)?'selected':''}>${esc(G.itemName(i))}</option>`).join('')}</select></label><label>${T.tradeCoins}<input id="online-trade-coins" type="number" min="0" value="${mine?.coins||0}"></label><div class="button-row">${button('trade-offer',T.tradeOffer)}${button('rpc',T.tradeConfirm,{method:'trade.confirm',number:trade.revision},!trade.members.every(id=>trade.offers[id]),'primary')}${button('rpc',T.tradeCancel,{method:'trade.cancel'})}</div></section>`;}
function mailBody(p){const mails=p.mails.filter(m=>!m.claimed);return `<div class="online-mail-list">${mails.map(m=>`<article><div><strong>${T[m.subject]||esc(m.subject)}</strong>${m.coins?`<p>${m.coins} ${T.crowns}</p>`:''}${m.items.map(i=>`<small>${esc(G.itemName(i))}</small>`).join('')}</div>${button('rpc',T.mailClaim,{method:'mail.claim',target:m.id},false,'primary')}</article>`).join('')||`<p>${T.mailEmpty}</p>`}</div>`;}
function pvpBody(context){return `<p>${T.pvpHint}</p><p>${T.pvpRating} <b>${view.profile.rating}</b> · ${T.pvpWins} ${view.profile.metrics.pvpWins||0}</p>${invitesBody(context)}<div class="online-player-list">${context.players.filter(p=>p.id!==view.profile.id).map(p=>`<article><strong>${esc(p.name)} · ${esc(DB.classes.find(c=>c.id===p.classId).name)}</strong>${button('rpc',T.pvpInvite,{method:'pvp.invite',target:p.id},false,'primary')}</article>`).join('')}</div><h3>${T.leaderboard}</h3><ol class="online-ranking">${view.ranking.map(r=>`<li><span>${esc(r.name)}</span><b>${r.rating}</b></li>`).join('')}</ol>`;}
function rewardLabel(reward){return Object.entries(reward).map(([key,n])=>`${n} ${T[key]||key}`).join(' · ');}
function recordsBody(p){return `<h3>${T.expeditionBook}</h3><div class="online-card-grid">${DB.expeditionGoals.map(g=>{const period=g.period+':'+view[g.period],value=p.periods[period]?.[g.metric]||0,claimed=p.claims[period+':'+g.id];return `<article><h4>${esc(g.name)}</h4><b>${value}/${g.target}</b><p>${esc(rewardLabel(g.rewards))}</p>${button('rpc',claimed?T.complete:T.claim,{method:'goal.claim',target:g.id},claimed||value<g.target,'primary')}</article>`;}).join('')}</div><h3>${T.achievements}</h3><div class="achievement-list">${DB.achievements.map(a=>{const value=a.metric==='mastery'?G.state().masteryLevel:p.metrics[a.metric]||0,claimed=p.claims[a.id];return `<article><div><strong>${esc(a.name)}</strong><small>${value}/${a.target} · ${esc(rewardLabel(a.rewards))}</small></div>${button('rpc',claimed?T.complete:T.achievementClaim,{method:'achievement.claim',target:a.id},claimed||value<a.target)}</article>`;}).join('')}</div>`;}
function summonBody(p){return `<p>${T.summonHint}</p><div class="summon-controls"><strong>${T.summonPity} ${O.drawPity-p.pity}</strong>${button('rpc',`${T.summonOne} · ${O.drawCost} ${T.stars}`,{method:'summon',number:1},p.stars<O.drawCost,'primary')}${button('rpc',`${T.summonTen} · ${O.drawCost*O.drawTen} ${T.stars}`,{method:'summon',number:O.drawTen},p.stars<O.drawCost*O.drawTen)}${button('rpc',T.shardExchange,{method:'shards.exchange'},p.shards<O.shardExchange)}</div>${draws.length?`<div class="summon-results">${draws.map(r=>{const spirit=find(DB.spirits,r.id);return `<article style="--spirit:${spirit.color}"><strong>${esc(spirit.name)}</strong><small>${esc(find(DB.rarities,spirit.rarity).name)}</small>${r.duplicate?tag(T.summonDuplicate):''}</article>`;}).join('')}</div>`:''}<div class="spirit-grid">${DB.spirits.map(s=>`<article style="--spirit:${s.color}" class="${p.spirits[s.id]?'owned':'locked'}"><span class="spirit-orb"></span><h4>${esc(s.name)}</h4>${ui().changes(s.stats)}${button('rpc',G.state().spiritId===s.id?T.spiritActive:T.spiritEquip,{method:'spirit.equip',target:s.id},!p.spirits[s.id]||G.state().spiritId===s.id)}</article>`).join('')}</div>`;}
function masteryBody(s){return `<p>${T.masteryHint}</p><div class="mastery-budget"><strong>${T.mastery} ${s.masteryLevel}/${O.masteryCap}</strong><b>${T.masteryPoints} ${s.masteryPoints}</b><small>${s.masteryXp}/${G.masteryNeeded()} ${T.xp}</small></div><div class="online-card-grid">${DB.masteryTracks.map(m=>`<article><h4>${esc(m.name)}</h4>${ui().changes(m.stats)}<b>${s.masteryRanks[m.id]||0}/${m.maxRank}</b>${button('mastery',T.masteryLearn,{id:m.id},s.level<C.maxLevel||!s.masteryPoints||(s.masteryRanks[m.id]||0)>=m.maxRank)}</article>`).join('')}</div>`;}
async function rpc(method,args=[]){const result=await command('social.'+method,args);if(result.ok){if(result.draws)draws=result.draws;if(G.mapDef().id==='duel_arena'||method==='raid.enter'){ui().closeModal();return;}await refresh();}}
async function handleAction(action,el){const name=action.slice('online-'.length),data=el.dataset;
 if(name==='open'){await show();return;}if(name==='auth-mode'){authMode=data.id;showAuth();return;}if(name==='authenticate'){const values={username:$('online-username').value,password:$('online-password').value};if(data.mode==='register'){Object.assign(values,{name:$('online-name').value,raceId:$('online-race').value,classId:$('online-class').value});if($('online-legacy')?.checked)values.legacy=G.snapshot();}el.disabled=true;try{const result=await request('auth/'+data.mode,values);if(!result.ok){message(result.message,true);el.disabled=false;return;}await start();}catch{el.disabled=false;message(T.onlineError,true);}return;}
 if(name==='open-server'){try{const url=new URL($('online-server-address').value);if(!/^https?:$/.test(url.protocol))throw Error();window.open(url.origin,'_blank','noopener,noreferrer');}catch{message(T.onlineInvalid,true);}return;}
 if(name==='logout'){await logout();return;}if(name==='tab'){tab=data.id;await refresh();return;}if(name==='rpc'){await rpc(data.method,data.target!==undefined?[data.target]:data.number!==undefined?[Number(data.number)]:[]);return;}if(name==='chat'){await rpc('chat',[$('online-chat-input').value,chatChannel]);return;}if(name==='join-party'){await rpc('party.join',[$('online-party-code').value]);return;}if(name==='role'){await rpc('party.role',[$('online-party-role').value]);return;}if(name==='create-guild'){await rpc('guild.create',[$('online-guild-name').value]);return;}if(name==='join-guild'){await rpc('guild.join',[$('online-guild-code').value]);return;}if(name==='donate'){await rpc('guild.donate',[Number($('online-guild-donation').value)]);return;}if(name==='list'){await rpc('market.list',[$('online-market-item').value,Number($('online-market-price').value)]);return;}if(name==='trade-offer'){await rpc('trade.offer',[[...$('online-trade-items').selectedOptions].map(v=>v.value),Number($('online-trade-coins').value)]);return;}if(name==='mastery'){const result=await command('learnMastery',[data.id]);if(result.ok)await refresh();}}
async function exportSave(){if(!active)return;try{const result=await request('save');if(!result.ok){message(result.message,true);return;}const blob=new Blob([JSON.stringify(result.save,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=T.exportName;link.click();setTimeout(()=>URL.revokeObjectURL(url),C.noticeTime*C.milliseconds);}catch{message(T.onlineError,true);}}
window.RPGOnline={exportSave,stopInput,init,show,start,logout,step,route,command,handleAction,status,isActive:()=>active,isConnected:()=>connected};
})();
</script><script>/* Playable world shell, persistent RPG menus and keyboard / touch movement. */
(() => {
'use strict';const G=window.RPG,DB=G.DB,C=DB.config,T=DB.ui,A=window.RPGAudio,$=id=>document.getElementById(id),find=(a,id)=>a.find(x=>x.id===id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),copy=v=>JSON.parse(JSON.stringify(v));
let scene='title',modalKind=null,renderer=null,lastFrame=0,hudClock=0,saveClock=0,selectedRace=DB.races[0].id,selectedClass=DB.classes[0].id,characterName='',selectedItem=null,bagFilter='all',talentTab='tree',skillSlot=0,smithTab='enhance',currentNpc=null,entryPortal=null,mapFocus=null,shopFilter='consumable',worldInteraction=null,toastTimer,joystickPointer=null;
let journalTab='quests',questFilter='all',questPage=0,regionFilter=null,expeditionRule=DB.expeditionRules[0].id;
const keys=new Set(),stick={x:0,y:0};let preferences={music:DB.audio.music,effects:DB.audio.effects,musicVolume:C.musicVolume,effectVolume:C.effectVolume};try{preferences={...preferences,...JSON.parse(localStorage.getItem(C.prefsKey)||'{}')};}catch{}
for(const [key,value]of Object.entries(DB.theme.colors))document.documentElement.style.setProperty('--'+key,value);for(const [key,value]of Object.entries(DB.theme.fonts))document.documentElement.style.setProperty('--font-'+key,value);document.title=DB.meta.title+' · '+DB.meta.subtitle;document.querySelector('meta[name="theme-color"]')?.setAttribute('content',DB.theme.colors.bg);A.applyPreferences(preferences);
function icon(id){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${DB.theme.icons[id]||DB.theme.icons.signature}</svg>`;}
function button(action,label,data={},cls='',disabled=false){return `<button data-action="${action}" ${Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')} class="${cls}" ${cls.includes('icon-button')?`aria-label="${esc(T[action]||action)}"`: ''} ${disabled?'disabled':''}>${label}</button>`;}
function tag(label,cls=''){return `<span class="tag ${cls}">${esc(label)}</span>`;}
function num(v){return Number(Number(v).toFixed(C.decimalDigits));}
function statValue(key,value){if(DB.percentStats.includes(key))return num(value*C.percentage)+'%';if(DB.multiplierStats.includes(key))return num(value)+'×';return String(num(value));}
function changeValue(ch){const value=ch.op==='multiply'?(ch.value-1)*C.percentage:ch.value*(DB.percentStats.includes(ch.stat)?C.percentage:1);return (value>0?'+':'')+num(value)+(ch.op==='multiply'||DB.percentStats.includes(ch.stat)?'%':'');}
function changes(list){return `<ul class="effect-list">${list.map(ch=>{const delta=(ch.op==='multiply'?ch.value-1:ch.value)*(DB.statDirections[ch.stat]||1);return `<li class="${delta>=0?'positive':'negative'}"><span>${esc(DB.statLabels[ch.stat])}</span><strong>${esc(changeValue(ch))}</strong></li>`;}).join('')}</ul>`;}
function toast(value,bad=false){if(!value)return;clearTimeout(toastTimer);$('toast').textContent=value;$('toast').className='toast visible'+(bad?' bad':'');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),C.noticeTime*C.milliseconds);}
function result(r,refresh=false){if(!r?.ok){toast(r?.message||T.locked,true);return false;}if(r.message)toast(r.message);save();if(refresh)refreshModal();updateHUD();return true;}
function save(){if(!G.state()||window.RPGOnline?.isActive())return;try{localStorage.setItem(C.storageKey,JSON.stringify(G.snapshot()));}catch{}}
function clearInput(){window.RPGOnline?.stopInput();keys.clear();stick.x=0;stick.y=0;joystickPointer=null;G.setInput(0,0);const knob=$('joystick-knob');if(knob)knob.style.transform='translate(0,0)';}
function openModal(kind,title,body,wide=false){modalKind=kind;clearInput();$('modal').className='modal '+(wide?'wide':'')+' modal-'+kind;$('modal').innerHTML=`<div class="modal-heading"><div><small>${esc(DB.meta.title)} · ${esc(window.RPGOnline?.isActive()?T.onlineLive:T.paused)}</small><h2 id="modal-title">${esc(title)}</h2></div>${button('close',icon('close'),{},'icon-button close-button')}</div><div id="modal-scroll" class="modal-scroll">${body}</div>`;$('modal-backdrop').hidden=false;requestAnimationFrame(()=>$('modal').querySelector('button:not(:disabled),input')?.focus());}
function closeModal(){modalKind=null;$('modal-backdrop').hidden=true;clearInput();$('world')?.focus({preventScroll:true});}
function showTitle(){scene='title';renderer=null;closeModal();const s=G.state();$('app').innerHTML=`<main class="title-page"><div class="title-landscape"><div class="title-sun"></div><div class="title-hills"></div><div class="title-castle">${icon('home')}</div></div><section class="title-card"><span class="eyebrow">${esc(T.titleTag)}</span><div class="brand-seal">${icon('brand')}</div><h1>${esc(DB.meta.title)}</h1><h2>${esc(DB.meta.subtitle)}</h2><p>${esc(DB.world.body)}</p><div class="title-actions">${button('online-open',`${icon('online')}${esc(T.online)}`,{},'primary online-start')}${s?button('continue',`${icon('resume')}<span>${esc(T.continue)}<small>${esc(s.name)} · ${esc(T.level)}${s.level} · ${esc(DB.maps[s.mapId].name)}</small></span>`,{},'primary'):''}${button('new',`${icon('plus')}${esc(T.newGame)}`,{},s?'':'primary')}${button('settings',`${icon('settings')}${esc(T.settings)}`)}</div><small class="title-control">${esc(T.autoCombat)}</small></section></main>`;}
function showCreation(){scene='create';closeModal();const race=find(DB.races,selectedRace),ch=find(DB.classes,selectedClass),st=G.previewCharacter(race.id,ch.id);$('app').innerHTML=`<main class="creation-page"><header class="creation-heading"><div><span class="eyebrow">${esc(DB.meta.title)} · ${esc(T.newAdventure)}</span><h1>${esc(T.createTitle)}</h1><p>${esc(T.createHint)}</p></div>${button('title',`${icon('home')}${T.back}`)}</header><div class="creation-layout"><section class="create-options parchment"><h2>${esc(T.selectRace)}</h2><div class="race-grid">${DB.races.map(r=>button('race',`<span>${window.RPGArt.heroPortrait(r.id,selectedClass)}</span><strong>${esc(r.name)}</strong><small>${esc(r.tag)}</small>`,{id:r.id},r.id===selectedRace?'selected':'')).join('')}</div><h2>${esc(T.selectClass)}</h2><div class="class-grid">${DB.classes.map(c=>button('class',`${icon(c.icon)}<span><strong>${esc(c.name)}</strong><small>${esc(c.role)}</small></span>`,{id:c.id},c.id===selectedClass?'selected':'')).join('')}</div></section><aside class="character-preview parchment"><div class="character-portrait">${window.RPGArt.heroPortrait(race.id,ch.id,C.titlePreviewScale)}</div><span class="eyebrow">${esc(race.name)} · ${esc(ch.name)}</span><h2>${esc(ch.name)}</h2><p>${esc(ch.description)}</p><div class="base-stats">${['hp','mp','attack','spell','speed','defense'].map(key=>`<span>${esc(DB.statLabels[key])}<strong>${esc(statValue(key,st[key]))}</strong></span>`).join('')}</div><div class="race-trait"><strong>${esc(race.name)}</strong><p>${esc(race.description)}</p>${changes(race.stats)}</div><label class="name-input">${esc(T.name)}<input id="character-name" maxlength="${C.nameLength}" value="${esc(characterName)}" placeholder="${esc(T.namePlaceholder)}"></label>${button('start',`${icon('fight')}${esc(T.start)}`,{},'primary full')}<small>${esc(T.autoCombat)}</small></aside></div></main>`;}
function startGame(){if(!result(G.create(selectedRace,selectedClass,characterName)))return;save();showGame();toast(T.characterCreated);}
function showGame(){scene='game';closeModal();const s=G.state(),ch=find(DB.classes,s.classId);$('app').innerHTML=`<div class="game-layout"><header class="game-header"><div class="hero-header"><span class="hero-mini">${window.RPGArt.heroPortrait(s.raceId,s.classId)}</span><div><strong>${esc(s.name)} <b id="hero-level"></b></strong><small>${esc(find(DB.races,s.raceId).name)} · ${esc(ch.name)}</small></div></div><div class="vitals"><div class="vital hp"><span>${esc(T.hp)}</span><div class="meter"><i id="hp-fill"></i></div><b id="hp-number"></b></div><div class="vital mp"><span>${esc(T.mp)}</span><div class="meter"><i id="mp-fill"></i></div><b id="mp-number"></b></div><div class="xp-meter"><i id="xp-fill"></i></div><div id="blessing-indicator" class="blessing-indicator" hidden>${icon('heart')}<span id="blessing-name"></span><b id="blessing-time"></b></div></div><div class="location-header"><strong id="map-name"></strong><small id="map-status"></small></div><div class="header-buttons">${button('online-open',icon('online'),{},'icon-button')}${button('help',icon('quest'),{},'icon-button')}${button('fullscreen',icon('fullscreen'),{},'icon-button')}${button('settings',icon('settings'),{},'icon-button')}</div></header><main id="play-stage" class="play-stage"><canvas id="world" tabindex="0" aria-label="${esc(T.controls)}"></canvas><button class="quest-tracker" data-action="quests"><small>${icon('quest')}<span id="quest-type"></span></small><strong id="quest-title"></strong><span id="quest-line"></span><em id="quest-route"></em></button><button class="minimap" data-action="map" aria-label="${esc(T.map)}"><canvas id="minimap"></canvas><span>${icon('map')}<b id="mini-name"></b></span></button><div id="boss-hud" class="boss-hud" hidden><div><strong id="boss-name"></strong><small id="boss-health"></small></div><div class="meter"><i id="boss-fill"></i></div></div><div id="map-objective" class="map-objective" hidden></div><div id="loot-feed" class="loot-feed"></div><button id="online-status" class="online-status" data-action="online-open">${esc(T.online)}</button><div id="online-party-hud" class="online-party-hud" hidden></div><div id="world-notices" class="world-notices" role="status"></div><div id="joystick" class="joystick" aria-label="${esc(T.mobileControls)}"><span></span><b id="joystick-knob"></b></div><div class="quick-actions">${dashButton()}${button('potion',`${icon('potion')}<strong id="potion-count"></strong><small>${esc(keyLabel('potion'))}</small><i id="potion-cooldown"></i>`,{},'potion-button')}${button('interact',`<span class="interact-key">${esc(keyLabel('interact'))}</span><span><strong id="interaction-name"></strong><small id="interaction-action"></small></span>`,{},'interact-button')}</div></main><footer class="game-footer"><nav>${[['inventory','bag',T.bag],['talents','training',T.talents],['quests','quest',T.quests],['map','map',T.map]].map(([action,id,label])=>button(action,`${icon(id)}<span>${esc(label)}</span>${action==='talents'?'<b id="point-count"></b>':''}`,{},'footer-button')).join('')}</nav><div id="auto-skills" class="auto-skills"></div><div class="footer-wallet">${icon('coins')}<strong id="gold-count"></strong></div></footer></div>`;renderer=new window.RPGRenderer($('world'),$('minimap'));bindJoystick();updateHUD();renderer.render(1);save();}
function updateHUD(){if(scene!=='game'||!$('world'))return;const s=G.state(),p=s.player,st=G.stats(),map=G.mapDef();$('play-stage').dataset.kind=map.kind;$('hero-level').textContent=T.level+s.level;for(const key of ['hp','mp']){$(key+'-fill').style.width=Math.max(0,p[key]/st[key]*C.percentage)+'%';$(key+'-number').textContent=Math.ceil(p[key])+' / '+st[key];}$('xp-fill').style.width=(s.level>=C.maxLevel?C.percentage:s.xp/G.xpNeeded()*C.percentage)+'%';$('map-name').textContent=map.name;$('mini-name').textContent=map.name+' · '+G.worldPhase().label;$('map-status').title=T.nightHint;$('map-status').textContent=DB.mapKinds[map.kind]+' · '+G.worldPhase().label+' · '+(map.kind==='town'?T.safe:G.inCombat()?T.combat:T.explore);$('gold-count').textContent=s.gold;$('point-count').textContent=s.points||'';$('point-count').hidden=!s.points;$('potion-count').textContent=s.potions;updateStatus();$('potion-cooldown').style.height=Math.max(0,(p.potionAt-s.time)/C.potionCooldown*C.percentage)+'%';const nearby=G.nearby();$('interaction-name').textContent=nearby?nearby.label:T.interact;$('interaction-action').textContent=nearby?nearby.kind==='npc'?DB.npcTypes[nearby.service].name:nearby.kind==='portal'?T.enter:nearby.kind==='chest'?T.open:nearby.kind==='discovery'?T.discover:nearby.kind==='event'?T.worldEvent:nearby.kind==='mechanism'?T.mechanism:T.gather:T.noInteraction;$('play-stage').classList.toggle('has-context',!!nearby);const track=G.trackedQuest();$('quest-type').textContent=track?.quest.main?T.mainQuest:T.sideQuest;$('quest-title').textContent=track?.quest.name||T.storyComplete;$('quest-line').textContent=track?.line||DB.world.goal;const route=track?.map?G.routeTo(track.map):[];$('quest-route').textContent=route.length?T.routeNext+' · '+route[0].name:track?.status==='ready'?T.readyToClaim:map.name;const boss=G.instance().enemies.find(e=>DB.monsters[e.template].boss&&!e.dead);$('boss-hud').hidden=!boss;if(boss){$('boss-name').textContent=DB.monsters[boss.template].name+' · '+T.level+boss.level+' · '+T.phase+' '+(boss.phase+1);$('boss-health').textContent=Math.ceil(boss.hp)+' / '+Math.ceil(boss.maxHp)+(G.wardCount()?' · '+T.bossWards+' '+G.wardCount():'');$('boss-fill').style.width=Math.max(0,boss.hp/boss.maxHp*C.percentage)+'%';}const remaining=G.guardiansRemaining();const event=map.events.map(e=>G.eventStatus(e.id)).find(e=>['active','waiting','ready'].includes(e.phase));$('map-objective').hidden=!map.guardianTotal&&!event&&!s.trial;$('map-objective').textContent=map.guardianTotal?T.guardians+' '+(map.guardianTotal-remaining)+' / '+map.guardianTotal:event?event.definition.name+' · '+(event.phase==='ready'?T.eventReady:T.eventRemaining+' '+event.remaining):s.trial?find(DB.trials,s.trial.id).name+' · '+T.wave+' '+Math.min(s.trial.wave+1,find(DB.trials,s.trial.id).waves.length)+'/'+find(DB.trials,s.trial.id).waves.length:'';$('loot-feed').innerHTML=s.lootFeed.map(l=>`<div style="--rarity:${find(DB.rarities,l.rarity).color}">${icon('bag')}<span>${esc(l.name)}</span></div>`).join('');$('world-notices').innerHTML=s.notices.map(n=>`<div class="${n.kind}">${esc(n.text)}</div>`).join('');updateAutoSkills();}
function updateAutoSkills(){const s=G.state(),p=s.player,parent=$('auto-skills'),key=s.skills.map(id=>id||'').join(':');if(parent.dataset.skills!==key){parent.dataset.skills=key;parent.innerHTML=s.skills.map((id,i)=>{const skill=DB.skills[id];return button('skills',`${icon(skill?.icon||chIcon())}<span><small>${esc(T.auto)}</small><strong>${esc(skill?.name||T.skillEmpty)}</strong></span><b id="auto-cooldown-${i}"></b>`,{index:i},'auto-skill');}).join('');}for(const [i,id]of s.skills.entries()){const left=id?Math.max(0,(p.skillCooldowns[id]||0)-s.time):0;$('auto-cooldown-'+i).textContent=left>0?num(left):id?T.ready:'';}}

function updateStatus(){const s=G.state(),info=G.blessingInfo(),bar=$('blessing-indicator');bar.hidden=!info;if(info){$('blessing-name').textContent=info.name;$('blessing-time').textContent=timeLabel(info.remaining);bar.title=info.description+' · '+T.blessingRemaining+' '+timeLabel(info.remaining);}const dash=G.dashInfo(),p=s.player;$('dash-count').textContent=dash.charges+' / '+dash.max;$('dash-clock').textContent=dash.charges<dash.max?num(Math.max(0,p.dashReadyAt-s.time))+'s':'';$('dash-progress').style.height=dash.charges<dash.max?Math.max(0,(p.dashReadyAt-s.time)/C.dashCooldown*C.percentage)+'%':'0%';$('dash-button').disabled=dash.charges===0||p.dashUntil>s.time;$('dash-button').classList.toggle('empty',dash.charges===0);$('play-stage').dataset.phase=G.worldPhase().night?'night':'day';}

function smithBody(){if(smithTab==='engrave')return runeSmithBody();const s=G.state();if(!s.inventory.some(i=>i.id===selectedItem))selectedItem=s.equipment.weapon;const item=s.inventory.find(i=>i.id===selectedItem),cost=item&&G.upgradeCost(item),maxed=item&&item.enhance>=C.upgradeMax;return `${wallet()}<p>${esc(T.smithHint)}</p><nav class="filter-tabs">${button('smith-tab',T.enhance,{id:'enhance'},smithTab==='enhance'?'selected':'')}${button('smith-tab',T.craft,{id:'craft'},smithTab==='craft'?'selected':'')}${button('smith-tab',T.engrave,{id:'engrave'},smithTab==='engrave'?'selected':'')}</nav>${smithTab==='enhance'?`<div class="smith-layout"><section class="bag-grid smith-items">${[...s.inventory].sort((a,b)=>G.itemScore(b)-G.itemScore(a)).map(i=>itemCard(i,'smith-item')).join('')}</section><aside class="smith-detail">${item?`<span class="eyebrow">${T.enchantLevel} ${item.enhance} / ${C.upgradeMax}</span><h3>${esc(G.itemName(item))}</h3>${changes(G.itemStats(item))}${!maxed?comparison(G.previewItem({...item,enhance:item.enhance+1}),G.previewItem(item),T.upgradePreview):''}<p>${esc(T.upgradeHint)}</p>${button('upgrade',maxed?T.maxUpgrade:`${T.upgrade} · ${cost.gold} ${T.gold} / ${cost.ore} ${find(DB.materials,'ore').name}`,{id:item.id},'primary full',maxed||s.gold<cost.gold||s.materials.ore<cost.ore)}`:''}</aside></div>`:`<div class="recipe-grid">${DB.recipes.filter(r=>!r.classes||r.classes.includes(s.classId)).map(r=>`<article class="recipe-card"><span>${icon('anvil')}</span><h3>${esc(r.name)}</h3><p>${esc(r.description||find(DB.items,r.item).description)}</p>${r.reputation?`<small>${Object.entries(r.reputation).map(([id,n])=>esc(find(DB.factions,id).name)+' '+n).join(' · ')}</small>`:''}<div class="recipe-cost"><span>${r.gold} ${T.gold}</span>${Object.entries(r.materials).map(([id,n])=>`<span>${esc(find(DB.materials,id).name)} ${n}</span>`).join('')}</div>${button('craft',s.level<(r.minLevel||1)?G.text('craftLevelGate',{level:r.minLevel}):T.craft,{id:r.id},'primar function exportSave(){if(window.RPGOnline?.isActive()){window.RPGOnline.exportSave();return;}if(!G.state())return;save();const blob=new Blob([JSON.stringify(G.snapshot(),null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=T.exportName;a.click();setTimeout(()=>URL.revokeObjectURL(url),C.noticeTime*C.milliseconds);toast(T.saved);}
function bindJoystick(){const zone=$('joystick');if(!zone)return;const update=event=>{const b=zone.getBoundingClientRect(),dx=(event.clientX-b.left-b.width/2)/C.joystickRadius,dy=(event.clientY-b.top-b.height/2)/C.joystickRadius,len=Math.max(1,Math.hypot(dx,dy));stick.x=dx/len;stick.y=dy/len;$('joystick-knob').style.transform=`translate(${stick.x*C.joystickRadius}px,${stick.y*C.joystickRadius}px)`;};zone.addEventListener('pointerdown',event=>{if(modalKind)return;A.unlock();event.preventDefault();joystickPointer=event.pointerId;zone.setPointerCapture(event.pointerId);update(event);});zone.addEventListener('pointermove',event=>{if(event.pointerId===joystickPointer){event.preventDefault();update(event);}});for(const type of ['pointerup','pointercancel','lostpointercapture'])zone.addEventListener(type,()=>{stick.x=0;stick.y=0;joystickPointer=null;$('joystick-knob').style.transform='translate(0,0)';});}
function handleAction(action,el){const id=el.dataset.id,index=Number(el.dataset.index);if(action.startsWith('online-')){window.RPGOnline?.handleAction(action,el);return;}if(window.RPGOnline?.isActive()){if(['new','confirm-new','import'].includes(action)){toast(T.onlineActionBlocked,true);return;}if(action==='title'){window.RPGOnline.logout();return;}if(DB.online.actionBindings[action]){window.RPGOnline.route(action,el,{id,index,skillSlot,entryPortal,expeditionRule,item:selectedItem,manaId:C.manaConsumable,input:movementInput()});return;}}if(action==='close'){closeModal();return;}if(action==='new')askNew();if(action==='confirm-new')showCreation();if(action==='title'){save();showTitle();}if(action==='continue')showGame();if(action==='race'){characterName=$('character-name')?.value||characterName;selectedRace=id;showCreation();}if(action==='class'){characterName=$('character-name')?.value||characterName;selectedClass=id;showCreation();}if(action==='start'){characterName=$('character-name')?.value||characterName;startGame();}if(action==='settings')openSettings();if(action==='help')openModal('help',T.help,`<p>${esc(T.helpBody)}</p><div class="help-controls">${icon('fight')}<strong>${esc(T.controls)}</strong><p>${esc(T.mobileControls)}</p></div>`);if(action==='fullscreen')fullscreen();if(action==='export')exportSave();if(action==='import')$('import-save').click();if(action==='advance')result(G.advance(id),true);if(action==='journal-tab'){journalTab=id;questPage=0;refreshModal();}if(action==='quest-filter'){questFilter=id;questPage=0;refreshModal();}if(action==='quest-page'){questPage=index;refreshModal();}if(action==='map-region'){regionFilter=id;refreshModal();}if(action==='select-companion')result(G.selectCompanion(id),true);if(action==='codex-claim')result(G.claimCodex(id,index),true);if(action==='expedition-rule'){expeditionRule=id;refreshModal();}if(action==='start-trial'){if(result(G.startTrial(id))){closeModal();renderer?.resize();updateHUD();}}if(action==='claim-trial')result(G.claimTrial(),true);if(action==='inventory')openInventory();if(action==='talents')openTalents();if(action==='quests')openQuests();if(action==='map'){mapFocus=null;openMap();}if(action==='potion')result(G.potion());if(action==='manaPotion')result(G.useConsumable(C.manaConsumable));if(action==='dash'){const input=movementInput();G.setInput(input.x,input.y);result(G.dash());}if(action==='use-supply')result(G.useConsumable(id),true);if(action==='shop-filter'){shopFilter=id;refreshModal();}if(action==='discover')result(G.discover(id),true);if(action==='start-event'){if(result(G.startEvent(id))){closeModal();updateHUD();}}if(action==='claim-event')result(G.claimEvent(id),true);if(action==='interact')doInteract();if(action==='item'){selectedItem=id;if(window.matchMedia(`(max-width: ${C.mobileMenuWidth}px)`).matches)openItem();else openInventory();}if(action==='bag-filter'){bagFilter=id;refreshModal();}if(action==='equip')result(G.equip(id),true);if(action==='unequip')result(G.unequip(id),true);if(action==='favorite')result(G.favorite(id),true);if(action==='salvage'||action==='sell')result(G.dispose(id,action),true);if(action==='talent-tab'){talentTab=id;refreshModal();}if(action==='learn')result(G.learn(id),true);if(action==='ask-respec')openModal('respec',T.respecConfirm,`<p>${T.respecConfirmHint}</p><div class="button-row">${button('talents',T.cancel)}${button('respec',T.respec,{},'primary')}</div>`);if(action==='respec'){if(result(G.respec()))openTalents();}if(action==='skills'){talentTab='skills';skillSlot=index;openTalents();}if(action==='skill-slot'){skillSlot=index;refreshModal();}if(action==='equip-skill')result(G.equipSkill(skillSlot,id),true);if(action==='accept')result(G.acceptQuest(id),true);if(action==='claim'){const r=G.completeQuest(id,el.dataset.choice);if(result(r,true)&&r.final)victory();}if(action==='quest-map'){const q=find(DB.quests,id),status=G.questStatus(id),npcMap=Object.values(DB.maps).find(m=>m.npcs.some(n=>n.id===q.npc));mapFocus=status==='ready'||status==='available'?npcMap?.id:q.objectives.find((o,i)=>G.objectiveProgress(q,i)<o.count)?.map;regionFilter=DB.regions.find(r=>r.maps.includes(mapFocus))?.id||regionFilter;openMap();}if(action==='travel'){if(result(G.travel(id))){closeModal();updateHUD();}}if(action==='smith-tab'){smithTab=id;refreshModal();}if(action==='smith-item'){selectedItem=id;refreshModal();}if(action==='upgrade')result(G.upgrade(id),true);if(action==='craft')result(G.craft(id),true);if(action==='buy')result(G.buy(id),true);if(action==='rest')result(G.rest(false),true);if(action==='meal')result(G.rest(true),true);if(action==='bless')result(G.bless(id),true);if(action==='enter-dungeon'){if(result(G.enterDungeon(entryPortal,Number(el.dataset.tier),expeditionRule))){closeModal();updateHUD();}}}
document.addEventListener('click',event=>{const el=event.target.closest?.('[data-action]');if(!el||el.disabled)return;A.unlock();A.play('click');handleAction(el.dataset.action,el);});
document.addEventListener('input',event=>{if(event.target.id==='character-name')characterName=event.target.value;if(event.target.dataset.volume){preferences[event.target.dataset.volume]=Number(event.target.value)/C.percentage;A.applyPreferences(preferences);try{localStorage.setItem(C.prefsKey,JSON.stringify(preferences));}catch{}}});
document.addEventListener('change',event=>{const key=event.target.dataset.pref;if(key){preferences[key]=event.target.checked;A.applyPreferences(preferences);try{localStorage.setItem(C.prefsKey,JSON.stringify(preferences));}catch{}}});
document.addEventListener('keydown',event=>{if(event.target.closest?.('input,textarea,select,[contenteditable=true]'))return;if(event.ctrlKey||event.metaKey||event.altKey)return;if(event.code==='Escape'){event.preventDefault();if(modalKind)closeModal();else if(scene==='game')openSettings();return;}if(scene==='game'&&DB.controls.inventory.includes(event.code)&&!event.shiftKey){event.preventDefault();if(!event.repeat){A.unlock();if(modalKind==='inventory'||modalKind==='item')closeModal();else openInventory();}return;}if(event.key==='Tab'&&modalKind){const nodes=[...$('modal').querySelectorAll('button:not(:disabled),input,select')],first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}if(scene!=='game'||modalKind)return;if(event.ctrlKey||event.metaKey||event.altKey)return;A.unlock();for(const dir of ['up','down','left','right'])if(DB.controls[dir].includes(event.code)){event.preventDefault();keys.add(event.code);return;}if(event.repeat)return;const action=Object.keys(DB.controls).find(k=>DB.controls[k].includes(event.code));if(action){event.preventDefault();handleAction(action,{dataset:{}});}});
$('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop'))closeModal();});
document.addEventListener('keyup',event=>keys.delete(event.code));
$('import-save').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;if(window.RPGOnline?.isActive()){toast(T.onlineActionBlocked,true);event.target.value='';return;}try{const data=JSON.parse(await file.text()),r=G.load(data);if(!r.ok)throw Error(r.message);save();closeModal();showGame();toast(T.loaded);}catch(error){toast(error.message||T.invalidSave,true);}event.target.value='';});
window.addEventListener('resize',()=>renderer?.resize());window.visualViewport?.addEventListener('resize',()=>renderer?.resize());window.addEventListener('blur',clearInput);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{clearInput();save();if(document.hidden)A.suspend();});
function frame(now){const dt=lastFrame?Math.min(C.maxFrame,(now-lastFrame)/C.milliseconds):0;lastFrame=now;if(scene==='game'&&G.state()){if(window.RPGOnline?.isActive()){window.RPGOnline.step(dt,!modalKind&&!document.hidden?movementInput():{x:0,y:0});}else if(!modalKind&&!document.hidden){const input=movementInput();G.setInput(input.x,input.y);let left=dt;while(left>0){const step=Math.min(C.step,left);G.tick(step);left-=step;}saveClock+=dt;if(saveClock>=C.saveInterval){saveClock=0;save();}}const sounds=[...new Set(G.state().sounds)];G.state().sounds=[];for(const id of sounds)A.play(id);hudClock+=dt;if(hudClock>=C.hudInterval){hudClock=0;updateHUD();}renderer?.render(dt);}A.update(scene==='game'&&G.state()?G.mapDef().music:'town');requestAnimationFrame(frame);}
try{const saved=JSON.parse(localStorage.getItem(C.storageKey)||'null');if(saved)G.load(saved);}catch{}
showTitle();requestAnimationFrame(frame);window.RPGUI={openModal,closeModal,refreshModal,openWorldInteraction,openInteraction,toast,changes,victory,showTitle,showCreation,showGame,openInventory,openTalents,openQuests,openMap,openNpc,openSettings,updateHUD,handleAction,frame,save,getRenderer:()=>renderer};window.RPGOnline?.init();
})();
</script></body></html>
