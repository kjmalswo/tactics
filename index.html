<script>
/* Permanent career, deliberate loadouts and the campaign economy. Data: game-db.js. */
(() => {
  'use strict';
  const DB=window.GAME_DB,D=DB.campaign,C=D.config;
  const clone=v=>JSON.parse(JSON.stringify(v));
  const find=(list,id)=>list.find(item=>item.id===id);
  const finite=v=>Number.isFinite(v);
  let S=null;
  const fmt=(key,args={})=>(D.text[key]||key).replace(/\{(\w+)\}/g,(_,k)=>args[k]??'');
  const result=(ok,key,args={})=>({ok,message:fmt(key,args)});
  const resources=()=>Object.fromEntries(Object.keys(D.resources).map(id=>[id,0]));
  function scaleCost(cost,factor){return Object.fromEntries(Object.entries(cost||{}).map(([id,value])=>[id,Math.ceil(value*factor)]));}
  function canAfford(cost){return !!S&&Object.entries(cost||{}).every(([id,value])=>finite(value)&&value>=0&&Object.hasOwn(D.resources,id)&&(S.resources[id]||0)>=value);}
  function pay(cost){for(const [id,value]of Object.entries(cost||{}))S.resources[id]-=value;}
  function credit(values){for(const [id,value]of Object.entries(values||{}))if(Object.hasOwn(D.resources,id))S.resources[id]=Math.min(C.resourceCap,S.resources[id]+Math.max(0,Math.floor(value)));}
  function garageAllowed(){return !S?result(false,'invalidSave'):S.activeMissionId?result(false,'activeChange'):null;}
  function apply(stats,changes,repeats=1){for(let n=0;n<repeats;n++)for(const change of changes||[]){const base=stats[change.stat]??(change.op==='multiply'?1:0);stats[change.stat]=change.op==='multiply'?base*change.value:base+change.value;}return stats;}
  function getLoadoutStats(loadout=S?.loadout||[],rigId=S?.rigId||DB.config.defaultRig){
    const rig=find(DB.rigs,rigId),stats={...DB.config.baseStats,...rig.stats};
    if(!S)return stats;
    apply(stats,C.careerStats,Math.max(0,S.career.level-C.careerStartLevel));
    apply(stats,C.rigStats,Math.max(0,(S.rigRanks[rigId]||C.rigStartRank)-C.rigStartRank));
    for(const id of loadout)if(id){const mod=find(D.modules,id);apply(stats,mod.stats,S.ownedModules[id]||0);}
    for(const id of S.researched)apply(stats,find(D.research,id)?.stats);
    apply(stats,find(D.doctrines,S.doctrineId)?.stats);
    return stats;
  }
  function getSupportStats(){const stats=clone(C.supportBase);if(!S)return stats;for(const id of S.researched)apply(stats,find(D.research,id)?.supportStats);apply(stats,find(D.doctrines,S.doctrineId)?.supportStats);return stats;}
  function getCapacity(){return C.powerBase+(S?.researched||[]).reduce((n,id)=>n+(find(D.research,id)?.powerBonus||0),0);}
  function modulePower(id,rank){const mod=find(D.modules,id);return mod?mod.power+Math.max(0,(rank??S.ownedModules[id]??1)-1)*(mod.rankPower||0):0;}
  function getPowerUsage(loadout=S?.loadout||[]){return loadout.reduce((n,id)=>n+(id?modulePower(id):0),0);}
  function eligible(rule,stats,rigId=S.rigId){if(!rule)return true;if(rule.any)return rule.any.some(r=>eligible(r,stats,rigId));if(rule.all)return rule.all.every(r=>eligible(r,stats,rigId));const weapon=DB.weapons[find(DB.rigs,rigId).weaponId];if(rule.weaponMode)return weapon.mode===rule.weaponMode;if(rule.weaponStat)return (weapon[rule.weaponStat]||0)>=rule.min;if(rule.stat)return (stats[rule.stat]||0)>=rule.min;return true;}
  function moduleCompatible(id,rigId=S?.rigId,loadout=S?.loadout||[]){const mod=find(D.modules,id);if(!mod||!rigId)return false;const stats=getLoadoutStats(loadout,rigId);return eligible(mod.requires,stats,rigId);}
  function getModuleStats(id,rank=S?.ownedModules[id]||1){const stats={};apply(stats,find(D.modules,id)?.stats,rank);return stats;}
  function getModuleCost(id,forUpgrade=false){const mod=find(D.modules,id);if(!mod)return null;return forUpgrade?scaleCost(mod.upgradeCost,Math.pow(mod.upgradeGrowth,Math.max(0,(S?.ownedModules[id]||1)-1))):clone(mod.cost);}
  function getResearchCost(id){return clone(find(D.research,id)?.cost||{});}
  function getRigCost(id=S?.rigId){const rank=S?.rigRanks[id]||C.rigStartRank;return scaleCost(C.rigCost,Math.pow(C.rigCostGrowth,rank-C.rigStartRank));}
  function getUnitCost(id,forUpgrade=false){const def=find(D.units,id);if(!def)return null;return forUpgrade?scaleCost(C.unitCost,Math.pow(C.unitCostGrowth,Math.max(0,(S?.unitRanks[id]||C.unitStartRank)-C.unitStartRank))):clone(def.cost);}
  function updateSectors(){

  }
  function createCampaign(seed=C.defaultSeed){

  function buyModule(id){const blocked=garageAllowed();if(blocked)return blocked;const mod=find(D.modules,id);if(!mod)return result(false,'unknownModule');if(S.ownedModules[id])return result(false,'owned');if(mod.research&&!S.researched.includes(mod.research))return result(false,'researchLocked');const cost=getModuleCost(id);if(!canAfford(cost))return result(false,'insufficient');pay(cost);S.ownedModules[id]=1;return result(true,'purchased',{name:mod.name});}
  function upgradeModule(id){const blocked=garageAllowed();if(blocked)return blocked;const mod=find(D.modules,id);if(!mod)return result(false,'unknownModule');const rank=S.ownedModules[id];if(!rank)return result(false,'notOwned');if(rank>=mod.maxRank)return result(false,'maxRank');if(S.loadout.includes(id)&&getPowerUsage()+modulePower(id,rank+1)-modulePower(id,rank)>getCapacity())return result(false,'powerShort');const cost=getModuleCost(id,true);if(!canAfford(cost))return result(false,'insufficient');pay(cost);S.ownedModules[id]++;return result(true,'upgraded',{name:mod.name});}
  function canEquip(slot,id){const blocked=garageAllowed();if(blocked)return blocked;if(!Number.isInteger(slot)||slot<0||slot>=C.slots)return result(false,'invalidSlot');const mod=find(D.modules,id);if(!mod)return result(false,'unknownModule');if(!S.ownedModules[id])return result(false,'notOwned');if(S.loadout.some((current,i)=>i!==slot&&current===id))return result(false,'duplicateModule');const candidate=S.loadout.slice();candidate[slot]=id;if(candidate.some(current=>current&&!moduleCompatible(current,S.rigId,candidate)))return result(false,'incompatible');if(getPowerUsage(candidate)>getCapacity())return result(false,'powerShort');return result(true,'equipped',{name:mod.name});}
  function equipModule(slot,id){const check=canEquip(slot,id);if(!check.ok)return check;S.loadout[slot]=id;return check;}
  function unequipModule(slot){const blocked=garageAllowed();if(blocked)return blocked;if(!Number.isInteger(slot)||slot<0||slot>=C.slots)return result(false,'invalidSlot');const candidate=S.loadout.slice();candidate[slot]=null;if(candidate.some(current=>current&&!moduleCompatible(current,S.rigId,candidate)))return result(false,'incompatible');S.loadout=candidate;return result(true,'unequipped');}
  function research(id){const blocked=garageAllowed();if(blocked)return blocked;const def=find(D.research,id);if(!def)return result(false,'unknownResearch');if(S.researched.includes(id))return result(false,'researchDone');if(!(def.requires||[]).every(req=>S.researched.includes(req)))return result(false,'researchLocked');if(!canAfford(def.cost))return result(false,'insufficient');pay(def.cost);S.researched.push(id);return result(true,'researched',{name:def.name});}
  function upgradeRig(id=S?.rigId){const blocked=garageAllowed();if(blocked)return blocked;const def=find(DB.rigs,id);if(!def)return result(false,'unknownRig');if(S.rigRanks[id]>=C.rigMaxRank)return result(false,'maxRank');const cost=getRigCost(id);if(!canAfford(cost))return result(false,'insufficient');pay(cost);S.rigRanks[id]++;return result(true,'upgraded',{name:def.name});}
  function setRig(id){const blocked=garageAllowed();if(blocked)return blocked;const def=find(DB.rigs,id);if(!def)return result(false,'unknownRig');S.rigId=id;for(let pass=0;pass<C.slots;pass++)for(let i=0;i<S.loadout.length;i++)if(S.loadout[i]&&!moduleCompatible(S.loadout[i],id))S.loadout[i]=null;return result(true,'rigChanged',{name:def.name});}
  function buyUnit(id){const blocked=garageAllowed();if(blocked)return blocked;const def=find(D.units,id);if(!def)return result(false,'unknownUnit');if(S.ownedUnits.includes(id))return result(false,'owned');if(def.research&&!S.researched.includes(def.research))return result(false,'researchLocked');if(!canAfford(def.cost))return result(false,'insufficient');pay(def.cost);S.ownedUnits.push(id);S.unitRanks[id]=C.unitStartRank;return result(true,'unitPurchased',{name:def.name});}
  function upgradeUnit(id){const blocked=garageAllowed();if(blocked)return blocked;const def=find(D.units,id);if(!def)return result(false,'unknownUnit');if(!S.ownedUnits.includes(id))return result(false,'unitLocked');if(S.unitRanks[id]>=C.unitMaxRank)return result(false,'maxRank');const cost=getUnitCost(id,true);if(!canAfford(cost))return result(false,'insufficient');pay(cost);S.unitRanks[id]++;return result(true,'upgraded',{name:def.name});}
  function getUnitStats(id){const def=find(D.units,id);if(!def)return null;const support=getSupportStats(),ranks=Math.max(0,(S?.unitRanks[id]||C.unitStartRank)-C.unitStartRank);return {...clone(def),type:id,rank:S?.unitRanks[id]||C.unitStartRank,hp:Math.round(def.hp*(1+ranks*C.unitRankHp)*support.unitHp),damage:Math.round(def.damage*(1+ranks*C.unitRankDamage)*support.unitDamage)};}
  function setSquad(slot,id){const blocked=garageAllowed();if(blocked)return blocked;if(!Number.isInteger(slot)||slot<0||slot>=C.squadSlots)return result(false,'invalidSlot');if(id!==null&&!find(D.units,id))return result(false,'unknownUnit');if(id!==null&&!S.ownedUnits.includes(id))return result(false,'unitLocked');S.squad[slot]=id;return result(true,'squadChanged');}
  function setDoctrine(id){const blocked=garageAllowed();if(blocked)return blocked;const def=find(D.doctrines,id);if(!def)return result(false,'unknownDoctrine');S.doctrineId=id;return result(true,'doctrineChanged',{name:def.name});}
  function getAvailableSectors(){if(!S)return [];return D.sectors.map(d=>({...clone(d),...clone(S.sectors[d.id]),available:S.sectors[d.id].status!=='locked'}));}
  function canLaunch(id){if(!S)return result(false,'invalidSave');if(S.activeMissionId)return result(false,'missionActive');const def=find(D.sectors,id);if(!def)return result(false,'unknownSector');if(S.sectors[id].status==='locked')return result(false,'sectorLocked');if(getPowerUsage()>getCapacity())return result(false,'powerShort');return result(true,'missionReady',{name:def.name});}
  function makeMission(id){
    const check=canLaunch(id);if(!check.ok)return check;const sector=find(D.sectors,id),record=S.sectors[id];S.nextMissionNonce++;const missionId=[S.seed,id,S.nextMissionNonce].join(':');S.activeMissionId=missionId;S.activeSectorId=id;
    const difficulty=sector.difficulty+record.wins*C.repeatDifficulty+(S.completed?C.completedDifficulty:0),rig=find(DB.rigs,S.rigId);
    const mission={id:missionId,sectorId:id,name:sector.name,description:sector.description,kind:sector.kind,difficulty,seed:missionId,rigId:S.rigId,weaponId:rig.weaponId,playerStats:getLoadoutStats(),careerLevel:S.career.level,allies:S.squad.filter(Boolean).map(getUnitStats),unitLicenses:S.ownedUnits.slice(),unitCatalog:Object.fromEntries(S.ownedUnits.map(type=>[type,getUnitStats(type)])),doctrineId:S.doctrineId,supportStats:getSupportStats(),world:clone(sector.mission.world||{}),mission:clone(sector.mission),reward:clone(sector.reward)};
    mission.mission.enemyScale=difficulty;return {...check,mission};
  }
  function cancelMission(id=S?.activeMissionId){if(!S||!S.activeMissionId)return result(true,'missionCancelled');if(id!==S.activeMissionId)return result(false,'invalidMission');S.activeMissionId=null;S.activeSectorId=null;return result(true,'missionCancelled');}
  function gainCareer(amount){S.career.xp+=amount;while(S.career.xp>=S.career.xpNext&&S.career.level<C.careerMaxLevel){S.career.xp-=S.career.xpNext;S.career.level++;S.career.xpNext=C.careerXpBase+(S.career.level-C.careerStartLevel)*C.careerXpGrowth;}}
  function settleMission(battle){
    if(!S||!battle||!S.activeMissionId||battle.missionId!==S.activeMissionId||S.lastSettledId===battle.missionId)return result(false,'duplicateSettlement');
    const sectorId=battle.sectorId||S.activeSectorId,sector=find(D.sectors,sectorId);if(!sector||sectorId!==S.activeSectorId)return result(false,'invalidMission');
    const outcome=battle.missionResult||(['won','lost'].includes(battle.phase)?battle.phase==='won'?'victory':'defeat':null);if(!['victory','defeat','withdraw'].includes(outcome))return result(false,'invalidMission');
    const victory=outcome==='victory',firstWin=victory&&S.sectors[sectorId].wins===0,oldLevel=S.career.level,wasOpen=new Set(D.sectors.filter(s=>S.sectors[s.id].status!=='locked').map(s=>s.id)),loot=resources(),income=resources(),base=resources(),total=resources();
    const raw=battle.missionLoot||{},fraction=victory?1:outcome==='withdraw'?C.withdrawLootFraction:C.defeatLootFraction;
    for(const key of Object.keys(D.resources)){const value=finite(raw[key])?Math.max(0,raw[key]):0;loot[key]=Math.floor(value*fraction);base[key]=victory?(sector.reward[key]||0):(C.defeatResources[key]||0);}
    S.sorties++;S.sectors[sectorId].attempts++;
    if(victory){S.sectors[sectorId].status='owned';S.sectors[sectorId].wins++;if(sector.final)S.completed=true;for(const def of D.sectors)if(S.sectors[def.id].status==='owned')for(const key of Object.keys(D.resources))income[key]+=def.income[key]||0;}
    for(const key of Object.keys(D.resources))total[key]=loot[key]+base[key]+income[key];credit(total);
    const battleXp=finite(raw.xp)?Math.max(0,raw.xp):Math.max(0,(battle.stats?.kills||0))*C.killXp;
    const xpGained=Math.floor(battleXp*fraction)+(victory?C.victoryXp:outcome==='withdraw'?C.withdrawXp:C.defeatXp);gainCareer(xpGained);updateSectors();
    const newlyUnlocked=D.sectors.filter(s=>!wasOpen.has(s.id)&&S.sectors[s.id].status!=='locked').map(s=>s.id);
    S.lastDebrief={missionId:battle.missionId,result:outcome,sectorId,sectorName:sector.name,resources:total,loot,income,base,career:{from:oldLevel,to:S.career.level,xpGained},newlyUnlocked,completed:S.completed,firstWin,stats:clone(battle.stats||{}),time:Math.max(0,battle.time||0),retained:true};S.lastSettledId=S.activeMissionId;S.activeMissionId=null;S.activeSectorId=null;
    return {...result(true,'settled'),debrief:clone(S.lastDebrief)};
  }
  function snapshot(){return S?clone(S):null;}
  function loadState(value){
    const previous=S;
    try{
      const saved=clone(value);if(saved.version!==C.version||!find(DB.rigs,saved.rigId)||!saved.resources||!saved.career||!saved.sectors||!saved.rigRanks||!saved.ownedModules||!saved.unitRanks)return result(false,'invalidSave');
      if(!['loadout','researched','ownedUnits','squad'].every(k=>Array.isArray(saved[k]))||saved.loadout.length!==C.slots||saved.squad.length!==C.squadSlots)return result(false,'invalidSave');
      if(Object.keys(D.resources).some(id=>!finite(saved.resources[id])||saved.resources[id]<0)||!Number.isInteger(saved.career.level)||saved.career.level<C.careerStartLevel||saved.career.level>C.careerMaxLevel||!finite(saved.career.xp)||saved.career.xp<0||!finite(saved.career.xpNext)||saved.career.xpNext<=0)return result(false,'invalidSave');
      if(Object.entries(saved.ownedModules).some(([id,rank])=>!find(D.modules,id)||!Number.isInteger(rank)||rank<1||rank>find(D.modules,id).maxRank)||saved.loadout.some(id=>id!==null&&!saved.ownedModules[id])||new Set(saved.loadout.filter(Boolean)).size!==saved.loadout.filter(Boolean).length)return result(false,'invalidSave');
      if(saved.researched.some(id=>!find(D.research,id))||saved.ownedUnits.some(id=>!find(D.units,id))||saved.squad.some(id=>id!==null&&!saved.ownedUnits.includes(id))||!find(D.doctrines,saved.doctrineId))return result(false,'invalidSave');
      if(DB.rigs.some(r=>!Number.isInteger(saved.rigRanks[r.id])||saved.rigRanks[r.id]<C.rigStartRank||saved.rigRanks[r.id]>C.rigMaxRank)||saved.ownedUnits.some(id=>!Number.isInteger(saved.unitRanks[id])||saved.unitRanks[id]<C.unitStartRank||saved.unitRanks[id]>C.unitMaxRank))return result(false,'invalidSave');

      if(saved.activeMissionId!==null&&(typeof saved.activeMissionId!=='string'||!find(D.sectors,saved.activeSectorId)))return result(false,'invalidSave');

    }catch{S=previous;return result(false,'invalidSave');}
  }
  function migrateLegacyRun(legacy){
    if(!legacy||!find(DB.rigs,legacy.rigId)||!finite(legacy.player?.level)||!Array.isArray(legacy.upgrades))return result(false,'legacyInvalid');
    createCampaign(legacy.seed||C.defaultSeed);S.rigId=legacy.rigId;S.career.level=Math.max(C.careerStartLevel,Math.min(C.legacyLevelCap,Math.floor(legacy.player.level)));S.career.xpNext=C.careerXpBase+(S.career.level-C.careerStartLevel)*C.careerXpGrowth;
    for(const item of legacy.upgrades){const mod=D.modules.find(m=>m.id===item.id||m.ref===item.id);if(!mod)continue;S.ownedModules[mod.id]=Math.max(S.ownedModules[mod.id]||0,Math.min(mod.maxRank,Math.max(1,Math.floor(item.stacks||1))));if(mod.research&&!S.researched.includes(mod.research)){const addResearch=id=>{const r=find(D.research,id);for(const req of r?.requires||[])if(!S.researched.includes(req))addResearch(req);if(r&&!S.researched.includes(id))S.researched.push(id);};addResearch(mod.research);}}
    S.loadout=Array(C.slots).fill(null);for(const id of Object.keys(S.ownedModules)){const slot=S.loadout.indexOf(null);if(slot<0)break;if(moduleCompatible(id)&&getPowerUsage()+modulePower(id)<=getCapacity())S.loadout[slot]=id;}
    S.importedLegacy=true;return result(true,'legacyImported');
  }
  function validateDB(db=DB){

    if(command==='html-download'){const data=validateEditor();if(data)exportHTML(data);}
  }
  $('modal').addEventListener('click',event=>{const rig=event.target.closest('[data-rig]');if(rig){menuSeed=$('seed-input').value;rigId=rig.dataset.rig;showMenu();return;}const up=event.target.closest('[data-upgrade]');if(up){choose(up.dataset.upgrade);return;}const cmd=event.target.closest('[data-command]');if(cmd)runCommand(cmd.dataset.command);});
  $('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop')&&['help','db','settings'].includes(modalKind))closeAuxiliary();});
  $('sound-button').addEventListener('click',toggleSound);$('auto-button').addEventListener('click',toggleAuto);$('help-button').addEventListener('click',()=>{if(!modalKind||modalKind==='menu'||modalKind==='pause')showHelp();});$('db-button').addEventListener('click',()=>{if(!modalKind||modalKind==='menu'||modalKind==='pause')showDB();});$('pause-button').addEventListener('click',pause);$('mobile-objectives-button').addEventListener('click',toggleObjectives);$('mobile-settings-button').addEventListener('click',showSettings);$('mobile-panel-close').addEventListener('click',closeMobilePanels);$('mobile-select-all').addEventListener('click',()=>{selectUnits();document.body.classList.toggle('mobile-squad-expanded');});
  $('ability-dock').addEventListener('click',event=>{const button=event.target.closest('[data-ability]');if(button)useAbility(button.dataset.ability);});
  $('relay-list').addEventListener('click',event=>{const button=event.target.closest('[data-relay]');if(button){waypointId=button.dataset.relay;selectedNodeId=waypointId;renderHUD();}});
  $('unit-cards').addEventListener('click',event=>{const button=event.target.closest('[data-unit]');if(button){selectedUnits=event.shiftKey?(selectedUnits.includes(button.dataset.unit)?selectedUnits.filter(id=>id!==button.dataset.unit):[...selectedUnits,button.dataset.unit]):[button.dataset.unit];G.setSelectedUnits?.(selectedUnits);document.body.classList.remove('mobile-squad-expanded');renderTacticalHUD();}});
  $('select-all-button').addEventListener('click',()=>selectUnits());
  $('command-bar').addEventListener('click',event=>{const button=event.target.closest('[data-mode]'),map=event.target.closest('[data-tactical="map"]'),queue=event.target.closest('[data-tactical="queue"]');if(queue){toggleQueue();return;}if(map){tacticalMap=!tacticalMap;renderTacticalHUD();return;}if(!button)return;const mode=button.dataset.mode;if(mode==='hold'){const units=(G.getState().allies||[]).filter(a=>selectedUnits.includes(a.id)&&a.hp>0);for(const unit of units)G.command({unitIds:[unit.id],kind:'hold',x:unit.x,y:unit.y,queue:queueHeld()});if(units.length){toast(T.orderSent);saveLocal();}}else if(mode==='follow'){issueOrder({x:G.getState().player.x,y:G.getState().player.y},mode);}else if(mode==='build'){const defs=DB.tactics.structures;buildType=Array.isArray(defs)?defs[0].id:Object.keys(defs)[0];commandMode='build';closeMobilePanels();toast(coarse?T.mobileOperationsHint:T.buildAt);}else commandMode=mode;renderTacticalHUD();});
  $('node-operations').addEventListener('click',event=>{const structure=event.target.closest('[data-structure]'),unit=event.target.closest('[data-reinforce]'),button=structure||unit;if(!button||button.disabled)return;event.preventDefault();if(structure){buildType=structure.dataset.structure;commandMode='build';closeMobilePanels();toast(coarse?T.mobileOperationsHint:T.buildAt);}if(unit){const result=G.callReinforcement(unit.dataset.reinforce,selectedNodeId);if(result?.ok===false)toast(result.message,true);else{selectedUnits=G.getState().allies.filter(a=>a.hp>0).map(a=>a.id);saveLocal();}}renderTacticalHUD();});
  $('planning-resume').addEventListener('click',pause);
  $('retreat-button').addEventListener('click',()=>{if(!launched)return;const result=G.retreat();if(result?.ok===false)toast(result.message,true);else watchPhase();});
  $('campaign-button').addEventListener('click',showMenu);
  mini.addEventListener('pointerdown',event=>{if(!launched||modalKind)return;event.preventDefault();const rect=mini.getBoundingClientRect(),point={x:(event.clientX-rect.left)/rect.width*DB.config.worldWidth,y:(event.clientY-rect.top)/rect.height*DB.config.worldHeight};if(event.button===2||G.getState().phase==='paused'||tacticalMap)issueOrder(point);else{tacticalMap=true;renderTacticalHUD();}});mini.addEventListener('contextmenu',event=>event.preventDefault());
  const canvas=$('game-canvas');
  canvas.addEventListener('pointermove',event=>{const rect=canvas.getBoundingClientRect();pointer.x=event.clientX-rect.left;pointer.y=event.clientY-rect.top;});
  canvas.addEventListener('pointerdown',handleWorldPointer);
  function releaseAim(event){if(event.pointerId===pointer.id){pointer.down=false;pointer.id=null;}}canvas.addEventListener('pointerup',releaseAim);canvas.addEventListener('pointercancel',releaseAim);canvas.addEventListener('lostpointercapture',releaseAim);canvas.addEventListener('contextmenu',event=>event.preventDefault());
  const joystick=$('joystick');function joystickMove(event){if(joy.id!==event.pointerId)return;const rect=joystick.getBoundingClientRect(),dx=event.clientX-rect.left-rect.width/2,dy=event.clientY-rect.top-rect.height/2,d=Math.hypot(dx,dy),n=Math.max(C.touchRadius,d);joy.x=d<C.touchDeadzone?0:dx/n;joy.y=d<C.touchDeadzone?0:dy/n;$('joy-stick').style.transform=`translate(${joy.x*C.touchRadius}px,${joy.y*C.touchRadius}px)`;}
  joystick.addEventListener('pointerdown',event=>{event.preventDefault();if(joy.id!==null)return;joy.id=event.pointerId;joystick.setPointerCapture(event.pointerId);joystickMove(event);});joystick.addEventListener('pointermove',joystickMove);for(const type of ['pointerup','pointercancel','lostpointercapture'])joystick.addEventListener(type,event=>{if(event.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;$('joy-stick').style.transform='';}});
  $('load-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;const backup=CP.snapshot(),oldBattle=G.snapshot();try{const data=JSON.parse(await file.text());if(!data.campaign)throw Error(T.invalidSave);const result=CP.loadState(data.campaign);if(result?.ok===false)throw Error(result.message||T.invalidSave);if(data.battle&&data.battle.missionId!==CP.getState().activeMissionId)throw Error(T.missionInvalid);if(data.battle){const loaded=G.loadState(data.battle);if(loaded?.ok===false)throw Error(loaded.message||T.invalidSave);}savedRun=data.battle||null;if(!savedRun&&CP.getState().activeMissionId)CP.cancelMission();launched=Boolean(savedRun);if(launched&&G.getState().phase==='playing')G.togglePause();selectedUnits=(G.getState().allies||[]).filter(a=>a.hp>0).map(a=>a.id);buildSignature='';saveLocal();showMenu();toast(T.campaignLoaded);}catch(e){CP.loadState(backup);G.loadState(oldBattle);toast(e.message||T.loadFailed,true);}event.target.value='';});

  document.addEventListener('keydown',event=>{
    if(event.target.closest('input,textarea'))return;
    if(!$('modal-backdrop').hidden){
      if(event.key==='Tab'){const controls=[...$('modal').querySelectorAll('button:not(:disabled),input,textarea')],first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
      if(modalKind==='upgrade'&&/^[1-9]$/.test(event.key)){const choice=G.getState().choices[num(event.key)-1];if(choice){event.preventDefault();choose(choice.id);}}
      else if(U.bindings.pause.includes(event.code)){event.preventDefault();if(modalKind==='pause')runCommand('resume');else if(['help','db','settings'].includes(modalKind))closeAuxiliary();}return;
    }
    if(U.bindings.pause.includes(event.code)){event.preventDefault();if(!event.repeat)pause();return;}
    if(U.bindings.map.includes(event.code)){event.preventDefault();if(!event.repeat){tacticalMap=!tacticalMap;renderTacticalHUD();}return;}
    if(U.bindings.selectAll.includes(event.code)){event.preventDefault();selectUnits();return;}
    if(U.bindings.selectFirst.includes(event.code)){event.preventDefault();selectUnits(0);return;}
    if(U.bindings.selectSecond.includes(event.code)){event.preventDefault();selectUnits(1);return;}
    if(U.bindings.queue.includes(event.code)){keys.add(event.code);return;}
    for(const a of Object.values(DB.abilities))if(U.bindings[a.id]?.includes(event.code)){event.preventDefault();if(!event.repeat)useAbility(a.id);return;}
    if(Object.values(U.bindings).some(list=>list.includes(event.code))){event.preventDefault();keys.add(event.code);}
  });
  document.addEventListener('keyup',event=>keys.delete(event.code));
  function onBlur(){clearInput();if(launched&&G.getState().phase==='playing'&&!modalKind)showPause();}
  window.addEventListener('blur',onBlur);document.addEventListener('visibilitychange',()=>{if(document.hidden)onBlur();});window.addEventListener('beforeunload',saveLocal);

  function frame(stamp){
    const dt=Math.min(C.maxFrameDelta,lastFrame?(stamp-lastFrame)/C.millisecondsPerSecond:0);lastFrame=stamp;
    const was=G.getState(),before={hp:was.player.hp,shield:was.player.shield,kills:was.stats.kills,fireCd:was.player.fireCd};
    if(launched&&!modalKind&&was.phase==='playing')G.step(dt,input());
    const s=G.getState();renderElapsed+=dt;const renderInterval=modalKind==='title'?C.titleFrameInterval:modalKind?C.menuFrameInterval:0;if(renderElapsed>=renderInterval){renderer.render(s,renderElapsed,input());renderElapsed=0;}
    if(launched&&s.phase==='playing'){
      if(s.player.hp<before.hp||s.player.shield<before.shield){damageFlash=C.damageFlashSeconds;sound('hurt');}
      else if(s.stats.kills>before.kills)sound('kill');
      else if(s.player.fireCd>before.fireCd&&audioTime>=U.audio.shot.interval){sound('shot');audioTime=0;}
    }
    audioTime+=dt;damageFlash=Math.max(0,damageFlash-dt);$('hit-flash').style.opacity=String(damageFlash/C.damageFlashSeconds);
    hudElapsed+=dt;saveElapsed+=dt;if(hudElapsed>=(coarse?C.mobileHudInterval:C.hudInterval)){hudElapsed=0;renderHUD();}if(launched&&saveElapsed>=C.autoSaveSeconds){saveElapsed=0;saveLocal();}
    watchPhase();requestAnimationFrame(frame);
  }

  CP.createCampaign(DB.config.defaultSeed);
  let migrated=false;
  if(savedEnvelope?.campaign){const loaded=CP.loadState(savedEnvelope.campaign);if(loaded?.ok===false){savedRun=null;savedEnvelope=null;}}
  else try{const legacy=JSON.parse(localStorage.getItem(C.legacyStorageKey)||'null');if(legacy&&CP.migrateLegacyRun){const result=CP.migrateLegacyRun(legacy);migrated=result?.ok!==false;}}catch{}
  G.createRun(CP.getState().rigId,DB.config.defaultSeed);G.setAutoFire(prefs.autoFire);
  if(savedRun&&savedRun.missionId===CP.getState().activeMissionId){const result=G.loadState(savedRun);launched=result?.ok!==false;if(launched&&G.getState().phase==='playing')G.togglePause();}
  if(!launched){savedRun=null;if(CP.getState().activeMissionId)CP.cancelMission();}
  campaignUI=new window.CampaignUI({campaign:CP,game:G,openModal,onLaunch:launchSector,onSave:saveLocal,onExport:exportSave,onLoad:()=>$('load-file').click(),onResume:resumeSaved,onTitle:showTitle,hasActiveBattle:()=>Boolean(savedRun&&savedRun.missionId===CP.getState().activeMissionId),notify:toast,esc,icon});
  syncTools();renderHUD(true);showTitle();if(migrated)toast(T.legacyMigrated);requestAnimationFrame(frame);
  window.ScrapUI={renderer,campaignUI,showTitle,showSettings,toggleObjectives,toggleQueue,showMenu,showPause,showDB,renderHUD,useAbility,launchSector,resumeSaved,issueOrder,selectUnits};
})();

</script>
