<body>
<header class="topbar"><div class="brand"><div class="brand-mark" data-icon="logo"></div><div><div class="brand-name" id="brand-name"></div><small class="brand-sub" id="brand-sub"></small></div></div><div class="top-route"><i class="live-dot"></i><span id="run-status"></span><span id="run-seed"></span></div><nav class="top-tools"><button id="sound-button" class="icon-button" data-title="sound"></button><button id="auto-button" class="icon-button" data-title="autoFire"></button><button id="help-button" class="icon-button" data-title="help" data-icon="help"></button><button id="db-button" class="icon-button optional-tool" data-title="db" data-icon="db"></button><button id="pause-button" class="pause-button"><span data-icon="pause"></span><span data-ui="pause"></span></button></nav></header>
<main class="game-stage" id="game-stage"><canvas id="game-canvas" tabindex="0"></canvas><div id="hit-flash"></div><div class="hud" id="hud"><section class="pilot-hud glass"><div class="hud-eyebrow" data-ui="pilot"></div><div class="pilot-title"><strong id="pilot-name"></strong><span class="level-badge" id="pilot-level"></span></div><div class="vital-line"><span data-ui="hull"></span><strong id="hull-number"></strong></div><div class="bar hull"><i id="hull-bar"></i></div><div class="vital-line"><span data-ui="shield"></span><strong id="shield-number"></strong></div><div class="bar shield"><i id="shield-bar"></i></div><div class="bar xp"><i id="xp-bar"></i></div><div class="pilot-footer"><span class="scrap-stat"><span data-icon="scrap"></span><span id="scrap-count"></span></span><span class="timer" id="run-timer"></span></div></section><section class="objective-panel glass"><div class="objective-heading"><strong data-ui="objective"></strong><span id="objective-count"></span></div><div class="relay-list" id="relay-list"></div><p class="objective-note" id="objective-note"></p><div class="threat-line"><span data-ui="pressure"></span><span class="threat-bars" id="threat-bars"></span></div></section><div class="center-notice"><div class="goal-pill" id="goal-pill"></div><div class="event-banner" id="event-banner" role="status"></div></div><div class="boss-hud" id="boss-hud"><div class="boss-heading"><strong id="boss-name"></strong><span id="boss-number"></span></div><div class="bar"><i id="boss-bar"></i></div></div><section class="build-dock"><div class="build-caption" data-ui="build"></div><div class="weapon-pill glass" id="weapon-pill"></div><div class="module-grid" id="module-grid"></div></section><div class="ability-dock" id="ability-dock"></div><div class="minimap-wrap"><div class="minimap-frame"><canvas id="minimap"></canvas></div><div class="minimap-caption"><span data-ui="sector"></span><span id="enemy-count"></span></div></div><div class="tutorial-tip" id="tutorial-tip"></div><div class="touch-joystick" id="joystick"><div class="joy-base"></div><div class="joy-stick" id="joy-stick"></div></div></div></main>
<div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div><div class="toast" id="toast" role="status"></div><input id="load-file" type="file" class="sr-only" accept="application/json,.json" tabindex="-1">
<!-- Gameplay and presentation data have one editable source: game-db.js. Load it before engine code. -->
<script id="game-db" src="./game-db.js"></script>
<script>
/* Generic real-time combat runtime. Game content and balancing live in game-db.js. */
(() => {
'use strict';
const DB=window.GAME_DB,C=DB.config;
let S=null;
const clone=x=>JSON.parse(JSON.stringify(x));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const len=(x,y)=>Math.hypot(x,y);
const distance=(a,b)=>len(a.x-b.x,a.y-b.y);
const find=(list,id)=>list.find(x=>x.id===id);
const TAU=Math.PI+Math.PI;
const fmt=(id,args={})=>(DB.messages[id]||id).replace(/\{(\w+)\}/g,(_,k)=>args[k]??'');
const result=(ok,id,args)=>({ok,message:fmt(id,args)});
const id=prefix=>prefix+S.nextId++;
function random(){S.rng=(Math.imul(S.rng,C.random.multiplier)+C.random.increment)>>>0;return S.rng/C.random.modulus;}
function hash(seed){let h=C.random.offset;for(const ch of String(seed))h=Math.imul(h^ch.codePointAt(0),C.random.prime);return h>>>0;}
const pick=list=>list[Math.floor(random()*list.length)];
const allEnemies=()=>S.enemies.filter(e=>e.hp>0);
function log(key,args={},kind='info'){S.events.unshift({text:fmt(key,args),kind,age:0});S.events=S.events.slice(0,C.eventLimit);}
function effect(type,x,y,extra={}){const def=DB.effects[type]||DB.effects.hit;S.effects.push({type,x,y,life:def.life,maxLife:def.life,radius:def.radius,color:def.color,...extra});}
function shake(power){S.cameraShake=Math.max(S.cameraShake,power);}
function getStats(){
  if(!S)return clone(C.baseStats);
  const stats={...C.baseStats,...find(DB.rigs,S.rigId).stats};
  for(const item of S.upgrades){const up=find(DB.upgrades,item.id);for(let n=0;n<item.stacks;n++)for(const change of up.stats||[]){if(change.op==='multiply')stats[change.stat]*=change.value;else stats[change.stat]=(stats[change.stat]||0)+change.value;}}
  stats.maxHp+=Math.max(0,S.player.level-C.startLevel)*C.levelHp;
  return stats;
}
function syncStats(){const p=S.player,stats=getStats();p.stats=stats;p.maxHp=stats.maxHp;p.maxShield=stats.maxShield;p.hp=Math.min(p.hp,p.maxHp);p.shield=Math.min(p.shield,p.maxShield);}
function inside(unit){unit.x=clamp(unit.x,unit.radius||C.playerRadius,C.worldWidth-(unit.radius||C.playerRadius));unit.y=clamp(unit.y,unit.radius||C.playerRadius,C.worldHeight-(unit.radius||C.playerRadius));}
function separate(unit,other,force=1){const dx=unit.x-other.x,dy=unit.y-other.y,d=len(dx,dy),need=(unit.radius||C.playerRadius)+other.radius;if(d<need){const a=d?Math.atan2(dy,dx):random()*TAU;unit.x+=Math.cos(a)*(need-d)*force;unit.y+=Math.sin(a)*(need-d)*force;}}
function resolveObstacles(unit){for(const rock of S.obstacles)separate(unit,rock);inside(unit);}
function nearest(x,y,range=Infinity){let best=null,bestD=range;for(const e of allEnemies()){const d=len(e.x-x,e.y-y);if(d<bestD){best=e;bestD=d;}}return best;}
function getNearestObjective(){if(!S)return null;if(S.extraction.active)return {...S.extraction,kind:'extraction',name:DB.meta.extractionName};if(S.bossSpawned&&!S.bossKilled){const boss=S.enemies.find(e=>DB.enemies[e.type].boss);if(boss)return {...boss,kind:'boss',name:DB.enemies[boss.type].name};}const relays=S.relays.filter(r=>!r.captured);return relays.sort((a,b)=>distance(a,S.player)-distance(b,S.player))[0]||null;}
function addPickup(type,x,y,value){if(S.pickups.length>=C.pickupLimit){const existing=S.pickups.find(p=>p.type===type);if(existing)existing.value+=value;return;}S.pickups.push({id:id('p'),type,x,y,value,radius:DB.pickups[type].radius,life:C.pickupLife});}
function gainXp(amount){S.player.xp+=amount;}
function enemyDamage(enemy,value,context={}){
  if(enemy.hp<=0)return;
  let amount=value;if(context.critical)amount*=S.player.stats.critMultiplier;
  const lost=Math.min(enemy.hp,amount);enemy.hp-=amount;S.stats.damage+=lost;enemy.hitFlash=C.hitFlash;
  if(context.knockback){enemy.x+=Math.cos(context.angle)*context.knockback;enemy.y+=Math.sin(context.angle)*context.knockback;resolveObstacles(enemy);}
  effect('float',enemy.x,enemy.y,{text:String(Math.round(amount)),color:context.critical?DB.palette.gold:DB.palette.ink});
  if(enemy.hp<=0){
    const def=DB.enemies[enemy.type];S.stats.kills++;S.player.combo++;S.player.comboLife=C.comboTime;
    const bonus=Math.min(S.player.combo,C.comboCap)*C.comboXpBonus;
    addPickup('xp',enemy.x,enemy.y,def.xp*(1+bonus));addPickup('scrap',enemy.x+Math.cos(enemy.angle)*C.dropSpread,enemy.y+Math.sin(enemy.angle)*C.dropSpread,def.scrap);
    if(random()<def.healChance)addPickup('repair',enemy.x,enemy.y,def.heal);
    if(S.player.hp>0){S.player.shield=Math.min(S.player.maxShield,S.player.shield+S.player.stats.killShield);S.player.hp=Math.min(S.player.maxHp,S.player.hp+S.player.stats.killHeal);}
    effect(def.boss?'explosion':'hit',enemy.x,enemy.y,{radius:enemy.radius*C.deathEffectScale,color:def.color});shake(def.boss?C.bossShake:C.killShake);
    if(def.boss){S.bossKilled=true;S.extraction.active=true;S.projectiles=S.projectiles.filter(p=>p.team==='player');log('bossDown',{},'good');}
  }
}
function playerDamage(amount,angle=0){
  const p=S.player;if(p.invuln>0||p.hp<=0)return;
  const scrapArmor=Math.min(C.scrapArmorCap,Math.floor(p.scrap*p.stats.scrapArmor));
  const taken=Math.max(C.minimumDamage,amount-p.stats.armor-scrapArmor),blocked=Math.min(p.shield,taken);p.shield-=blocked;p.hp-=taken-blocked;p.lastDamage=0;p.invuln=C.hitInvulnerability;
  S.stats.damageTaken+=taken-blocked;effect('hit',p.x,p.y,{color:DB.palette.danger,radius:C.playerHitRadius});shake(C.playerHitShake);
  p.x+=Math.cos(angle)*C.playerKnockback;p.y+=Math.sin(angle)*C.playerKnockback;resolveObstacles(p);
  if(p.hp<=0){p.hp=0;S.phase='lost';log('lost',{},'bad');}

function setAutoFire(value){if(S)S.autoFire=Boolean(value);}
function validateDB(db){
  const errors=[];const c=db?.config;
  if(!c||!Number.isFinite(c.worldWidth)||!Number.isFinite(c.worldHeight)||c.worldWidth<=0||c.worldHeight<=0)errors.push('config.worldWidth/worldHeight must be positive numbers');
  for(const key of ['rigs','upgrades','relays','waves'])if(!Array.isArray(db?.[key])||!db[key].length)errors.push(key+' must be a non-empty array');
  if(errors.length)return errors;
  for(const key of ['rigs','upgrades','relays'])if(new Set(db[key].map(x=>x.id)).size!==db[key].length)errors.push(key+' contains duplicate ids');

}
function loadState(value){
  try{const saved=clone(value);if(saved.version!==C.saveVersion||!find(DB.rigs,saved.rigId)||!['playing','paused','upgrade','won','lost'].includes(saved.phase)||!saved.player||!Number.isFinite(saved.time)||!Number.isFinite(saved.rng))return result(false,'invalidSave');
    for(const key of ['enemies','projectiles','pickups','effects','turrets','mines','relays','obstacles','upgrades','choices','events'])if(!Array.isArray(saved[key]))return result(false,'invalidSave');

    if(saved.enemies.some(e=>!DB.enemies[e.type]||!Number.isFinite(e.hp)||!Number.isFinite(e.x)||!Number.isFinite(e.y))||saved.upgrades.some(u=>!find(DB.upgrades,u.id)||!Number.isInteger(u.stacks)||u.stacks<1)||saved.relays.some(r=>!find(DB.relays,r.id)))return result(false,'invalidSave');
    if(saved.phase==='upgrade'&&(!saved.choices.length||saved.choices.some(u=>!find(DB.upgrades,u.id)&&u.id!==DB.fallbackUpgrade.id)))return result(false,'invalidSave');
    S=saved;syncStats();return result(true,'loaded');
  }catch{return result(false,'invalidSave');}
}
window.ScrapGame={DB,createRun,getState:()=>S,step,useAbility,chooseUpgrade,togglePause,snapshot,loadState,validateDB,getStats,getNearestObjective,setAutoFire};
})();

<script>

    drawFloor(worldW,worldH) {
      const c=this.ctx,P=this.palette,grid=this.opts.gridSize,major=grid*this.opts.majorEvery;
      const left=Math.max(0,this.camera.x-this.width/this.zoom/2-grid),right=Math.min(worldW,this.camera.x+this.width/this.zoom/2+grid),top=Math.max(0,this.camera.y-this.height/this.zoom/2-grid),bottom=Math.min(worldH,this.camera.y+this.height/this.zoom/2+grid);

      c.lineWidth=.7;c.strokeStyle=P.grid;c.beginPath();

        const x=((i*811.73+Math.sin(i*31)*200)%worldW+worldW)%worldW,y=((i*619.17+Math.cos(i*13)*160)%worldH+worldH)%worldH;
        if(!this.visible(x,y,30))continue;

    }

    drawRelay(relay,state) {
      const c=this.ctx,P=this.palette,def=(this.db.relays||[]).find(r=>r.id===relay.id)||{},R=relay.radius||def.radius||this.db.config.captureRadius||78;
      if(!this.visible(relay.x,relay.y,R+40))return;

    drawExtraction(extraction) {

      const pulse=.5+.5*Math.sin(this.time*3);c.fillStyle=alphaColor(P.gold,.05+pulse*.04);circle(c,0,0,R);c.fill();
      c.strokeStyle=alphaColor(P.gold,.5);c.lineWidth=2;circle(c,0,0,R);c.stroke();c.strokeStyle=alphaColor(P.gold,.2);circle(c,0,0,R+10+pulse*12);c.stroke();
      c.save();c.rotate(this.time*.25);c.strokeStyle=P.gold;c.setLineDash([20,40]);circle(c,0,0,R*.65);c.stroke();c.setLineDash([]);c.restore();

    drawObstacle(obstacle) {

      c.fillStyle='#2a4147';polygon(c,points.map(([x,y])=>[x*.7,y*.7-3]));c.fill();
      c.strokeStyle=alphaColor(P.muted,.22);c.lineWidth=1;c.beginPath();c.moveTo(-r*.55,-r*.4);c.lineTo(r*.3,r*.4);c.moveTo(-r*.1,-r*.55);c.lineTo(r*.55,r*.1);c.stroke();
      c.fillStyle='#13262f';c.fillRect(-r*.5,-4,r,8);c.strokeStyle='#4d5f62';c.strokeRect(-r*.5,-4,r,8);

    }

    drawTelegraph(enemy,state) {
      const t=enemy.telegraph,c=this.ctx,P=this.palette,def=this.db.enemies[enemy.type]||{};
      if(!t)return;
      const kind=t.kind||t.type||def.behavior,life=number(t.remaining,number(t.timer,number(t.life,1))),duration=number(t.maxLife,number(t.duration,number(def.windup,1)));
      const progress=1-clamp(life/Math.max(duration,.01),0,1),pulse=.55+.2*Math.sin(this.time*19);
      const targetX=number(t.x,number(t.targetX,kind==='ring'?enemy.x:state.player.x)),targetY=number(t.y,number(t.targetY,kind==='ring'?enemy.y:state.player.y));

        else{c.moveTo(targetX-r-6,targetY);c.lineTo(targetX+r+6,targetY);c.moveTo(targetX,targetY-r-6);c.lineTo(targetX,targetY+r+6);}c.stroke();

    }

    drawPickup(pickup) {

      c.fillStyle=color;c.shadowColor=color;c.shadowBlur=8;

      else if(isScrap){polygon(c,[[-r,-r*.6],[r*.2,-r],[r,r*.5],[-r*.5,r]]);c.fill();}

    }

    drawTrails(player,state,dt) {
      const speed=Math.hypot(number(player.vx),number(player.vy)),r=player.radius||this.db.config.playerRadius||16;

    drawPlayer(player,state) {

    drawEnemy(enemy,state) {
      const c=this.ctx,P=this.palette,def=this.db.enemies[enemy.type]||{},r=enemy.radius||def.radius||16,color=def.color||P.danger,shape=def.shape||def.behavior||'seek';

        c.fillStyle=alphaColor(color,.18);circle(c,effect.x,effect.y,r*(.2+age));c.fill();c.strokeStyle=color;c.lineWidth=2*number(fraction);circle(c,effect.x,effect.y,r*(.2+age));c.stroke();

    }

    drawWaypoint(player,waypoint) {

        c.save();c.translate(x,y);c.rotate(angle);c.fillStyle='#0c1c25dd';c.strokeStyle=alphaColor(point.color,.5);polygon(c,[[-15,-12],[9,-12],[18,0],[9,12],[-15,12]]);c.fill();c.stroke();c.fillStyle=point.color;polygon(c,[[10,0],[4,-4],[4,4]]);c.fill();c.restore();

  }
  window.ScrapRenderer=ScrapRenderer;

<script>
/* Interface and input. All editable content and tuning are supplied by game-db.js. */
(() => {
  'use strict';
  const G=window.ScrapGame,DB=G.DB,U=DB.ui,T=U.text,C=U.settings;

  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=(name,fallback='scrap')=>`<svg viewBox="0 0 24 24" aria-hidden="true">${U.icons[name]||U.icons[fallback]}</svg>`;
  const find=(list,id)=>list.find(x=>x.id===id),pct=(a,b)=>clamp(num(a)/Math.max(1,num(b))*100,0,100);
  const timeText=seconds=>`${String(Math.floor(seconds/C.secondsPerMinute)).padStart(2,'0')}:${String(Math.floor(seconds%C.secondsPerMinute)).padStart(2,'0')}`;
  let launched=false,modalKind=null,modalReturn='menu',rigId=DB.config.defaultRig,menuSeed=DB.config.defaultSeed,toastTimer,previousFocus;
  let lastFrame=0,hudElapsed=0,saveElapsed=0,audioTime=0,damageFlash=0,waypointId=null,buildSignature='',phaseSignature='',lastSnapshot=null,savedRun=null;
  let audioContext=null,prefs={sound:U.audio.enabled,autoFire:DB.config.defaultAutoFire};
  const keys=new Set(),pointer={x:0,y:0,down:false},joy={x:0,y:0,id:null};
  try{prefs={...prefs,...JSON.parse(localStorage.getItem(C.settingsKey)||'{}')};savedRun=JSON.parse(localStorage.getItem(C.storageKey)||'null');}catch{}

  document.title=`${T.brand} — ${T.english}`;$('brand-name').textContent=T.english;$('brand-sub').textContent=T.brand;
  document.querySelectorAll('[data-ui]').forEach(el=>el.textContent=T[el.dataset.ui]||'');

  const mini=$('minimap'),mctx=mini.getContext('2d');mini.width=C.minimapWidth;mini.height=C.minimapHeight;
  const coarse=window.matchMedia('(pointer: coarse)').matches;

  function toast(text,error=false){if(!text)return;clearTimeout(toastTimer);$('toast').textContent=text;$('toast').className=`toast show${error?' error':''}`;toastTimer=setTimeout(()=>$('toast').classList.remove('show'),C.toastMs);}
  function savePreferences(){try{localStorage.setItem(C.settingsKey,JSON.stringify(prefs));}catch{}}

  }
  function syncTools(){
    $('sound-button').innerHTML=icon(prefs.sound?'sound':'mute');$('sound-button').title=prefs.sound?T.soundOn:T.soundOff;$('sound-button').setAttribute('aria-label',$('sound-button').title);
    $('auto-button').innerHTML=icon(prefs.autoFire?'crosshair':'weapon');$('auto-button').title=prefs.autoFire?T.autoOn:T.autoOff;$('auto-button').setAttribute('aria-label',$('auto-button').title);$('auto-button').style.color=prefs.autoFire?U.palette.accent:U.palette.muted;
  }
  function toggleSound(){prefs.sound=!prefs.sound;savePreferences();syncTools();if(prefs.sound)sound('upgrade');}
  function toggleAuto(){prefs.autoFire=!prefs.autoFire;G.setAutoFire(prefs.autoFire);savePreferences();syncTools();toast(prefs.autoFire?T.autoOn:T.autoOff);}

  function movement(){let x=joy.x,y=joy.y;for(const k of U.bindings.left)if(keys.has(k))x--;for(const k of U.bindings.right)if(keys.has(k))x++;for(const k of U.bindings.up)if(keys.has(k))y--;for(const k of U.bindings.down)if(keys.has(k))y++;return {x:clamp(x,-1,1),y:clamp(y,-1,1)};}

  function resize(){const rect=$('game-stage').getBoundingClientRect();renderer.resize(rect.width,rect.height,Math.min(C.pixelRatioCap,window.devicePixelRatio||1));}

  function renderAbilities(state){

  function renderMinimap(state){

  const joystick=$('joystick');function joystickMove(event){if(joy.id!==event.pointerId)return;const rect=joystick.getBoundingClientRect(),dx=event.clientX-rect.left-rect.width/2,dy=event.clientY-rect.top-rect.height/2,d=Math.hypot(dx,dy),n=Math.max(C.touchRadius,d);joy.x=d<C.touchDeadzone?0:dx/n;joy.y=d<C.touchDeadzone?0:dy/n;$('joy-stick').style.transform=`translate(${joy.x*C.touchRadius}px,${joy.y*C.touchRadius}px)`;}
  joystick.addEventListener('pointerdown',event=>{event.preventDefault();joy.id=event.pointerId;joystick.setPointerCapture(event.pointerId);joystickMove(event);});joystick.addEventListener('pointermove',joystickMove);for(const type of ['pointerup','pointercancel'])joystick.addEventListener(type,event=>{if(event.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;$('joy-stick').style.transform='';}});
  $('load-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text()),result=G.loadState(data);if(result?.ok===false)throw Error(result.message||T.invalidSave);launched=true;rigId=G.getState().rigId;prefs.autoFire=G.getState().autoFire;syncTools();hideModal();if(G.getState().phase==='paused')G.togglePause();lastSnapshot=null;renderHUD(true);saveLocal();watchPhase();toast(T.loaded);}catch(e){toast(e.message||T.loadFailed,true);}event.target.value='';});

  document.addEventListener('keydown',event=>{
    if(event.target.closest('input,textarea'))return;
    if(!$('modal-backdrop').hidden){
      if(event.key==='Tab'){const controls=[...$('modal').querySelectorAll('button:not(:disabled),input,textarea')],first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
      if(modalKind==='upgrade'&&/^[1-9]$/.test(event.key)){const choice=G.getState().choices[num(event.key)-1];if(choice){event.preventDefault();choose(choice.id);}}
      else if(U.bindings.pause.includes(event.code)){event.preventDefault();if(modalKind==='pause')runCommand('resume');else if(['help','db'].includes(modalKind))closeAuxiliary();}return;
    }
    if(U.bindings.pause.includes(event.code)){event.preventDefault();if(!event.repeat)pause();return;}
    for(const a of Object.values(DB.abilities))if(U.bindings[a.id]?.includes(event.code)){event.preventDefault();if(!event.repeat)useAbility(a.id);return;}
    if(Object.values(U.bindings).some(list=>list.includes(event.code))){event.preventDefault();keys.add(event.code);}
  });
  document.addEventListener('keyup',event=>keys.delete(event.code));
  function onBlur(){clearInput();if(launched&&G.getState().phase==='playing'&&!modalKind)showPause();}
  window.addEventListener('blur',onBlur);document.addEventListener('visibilitychange',()=>{if(document.hidden)onBlur();});window.addEventListener('beforeunload',saveLocal);

  function frame(stamp){
    const dt=Math.min(C.maxFrameDelta,lastFrame?(stamp-lastFrame)/C.millisecondsPerSecond:0);lastFrame=stamp;
    const was=G.getState(),before={hp:was.player.hp,shield:was.player.shield,kills:was.stats.kills,fireCd:was.player.fireCd};
    if(launched&&!modalKind&&was.phase==='playing')G.step(dt,input());
    const s=G.getState();renderer.render(s,dt,input());
    if(launched&&s.phase==='playing'){
      if(s.player.hp<before.hp||s.player.shield<before.shield){damageFlash=C.damageFlashSeconds;sound('hurt');}
      else if(s.stats.kills>before.kills)sound('kill');
      else if(s.player.fireCd>before.fireCd&&audioTime>=U.audio.shot.interval){sound('shot');audioTime=0;}
    }
    audioTime+=dt;damageFlash=Math.max(0,damageFlash-dt);$('hit-flash').style.opacity=String(damageFlash/C.damageFlashSeconds);
    hudElapsed+=dt;saveElapsed+=dt;if(hudElapsed>=C.hudInterval){hudElapsed=0;renderHUD();}if(launched&&saveElapsed>=C.autoSaveSeconds){saveElapsed=0;saveLocal();}
    watchPhase();requestAnimationFrame(frame);
  }

  G.createRun(DB.config.defaultRig,DB.config.defaultSeed);G.setAutoFire(prefs.autoFire);menuSeed=`${C.seedPrefix}-${Math.floor(Math.random()*C.seedMax)}`;syncTools();renderHUD(true);showMenu();requestAnimationFrame(frame);
  window.ScrapUI={renderer,showMenu,showPause,showDB,renderHUD,useAbility};
})();

</script>
