<body>
<div class="app" id="app">
  <header class="topbar"><div class="brand"><div class="brandmark" data-icon="logo"></div><div><h1 id="brand-title"></h1><small id="brand-english"></small></div></div><nav class="top-tools" aria-label="게임 메뉴"><button class="icon-btn" id="help-btn" data-title="help" data-icon="help"></button><button class="icon-btn optional-tool" id="save-btn" data-title="save" data-icon="download"></button><button class="icon-btn optional-tool" id="load-btn" data-title="load" data-icon="upload"></button><button class="icon-btn" id="db-btn" data-title="db" data-icon="db"></button><button class="text-btn" id="new-btn"><span data-icon="flag"></span><span class="desktop-text" data-ui="newRun"></span></button></nav></header>
  <div class="campaign-head"><div class="campaign-title"><div class="operation-index" id="stage-number"></div><div><span class="eyebrow" data-ui="op"></span><h2 id="encounter-name"></h2><p id="encounter-subtitle"></p></div></div><div class="route-track" id="route-track" role="img" data-title="campaign"></div></div>
  <main class="game-layout"><aside class="left-column"><section class="panel player-panel" id="player-panel"></section><section class="panel build-panel"><div class="section-heading"><h3 data-ui="build"></h3><span class="count" id="module-count"></span></div><div id="modules"></div></section><div class="objective"><strong data-ui="objectives"></strong><p data-ui="objectiveBody"></p></div></aside>
  <section class="center-column"><div class="panel map-panel"><div class="map-head"><div><span class="eyebrow" data-ui="boardEyebrow"></span><h3 data-ui="boardTitle"></h3></div><div class="turn-chip"><span data-ui="turn"></span><strong id="turn-number"></strong></div></div><div class="board-frame"><div class="column-labels" id="column-labels"></div><div class="row-labels" id="row-labels"></div><div class="board" id="board" role="grid" aria-label="전술 지도"></div></div><div class="map-legend"><div class="legend-items"><span><i class="legend-dot"></i><span data-ui="danger"></span></span><span><i class="legend-dot target"></i><span data-ui="target"></span></span></div><div class="tide-label" id="tide-label"></div></div></div><div class="tile-info" id="tile-info" aria-live="polite"></div><div class="action-heading"><h3 data-ui="actions"></h3><p data-ui="actionSub"></p></div><div class="actions" id="actions" role="group" aria-label="전술 행동"></div><div class="turn-controls"><button class="undo-btn" id="undo-btn"><span data-icon="undo"></span><span data-ui="undoShort"></span></button><button class="end-btn" id="end-btn"><span><strong data-ui="endTurn"></strong><small data-ui="endSub"></small></span><span data-icon="chevron"></span></button></div></section>
  <aside class="right-column"><section class="panel intent-panel"><div class="section-heading"><h3 data-ui="intent"></h3><span class="count" id="enemy-count"></span></div><p class="intent-sub" data-ui="intentSub"></p><div class="intent-list" id="intents"></div><p class="order-note" data-ui="enemyOrder"></p></section><section class="panel journal-panel"><div class="section-heading"><h3 data-ui="journal"></h3><span data-icon="clock"></span></div><div id="logs" aria-live="polite"></div></section></aside></main>
  <footer class="footer"><span data-ui="selectHint"></span><span class="seed" id="seed-display"></span></footer>
</div>
<div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
<div class="toast" id="toast" role="status"></div><input class="sr-only" type="file" id="load-file" accept="application/json,.json" tabindex="-1">
<!-- Game data loads synchronously before the engine; edit game-db.js for content and balance. -->
<script id="game-db" src="./game-db.js"></script>
<script>
/* Generic tactics engine. Content, balance and effects are supplied by game-db.js. */
(() => {
'use strict';
const DB = window.GAME_DB;
const C = DB.config;
let S = null;
const clone = value => JSON.parse(JSON.stringify(value));
const byId = (list,id) => list.find(item => item.id === id);
const fmt = (key,args={}) => (DB.messages[key] || key).replace(/\{(\w+)\}/g,(_,name)=>args[name] ?? '');
const result = (ok,key,args) => ({ok,message:fmt(key,args)});
const inside = p => Number.isInteger(p?.x) && Number.isInteger(p?.y) && p.x >= 0 && p.y >= 0 && p.x < C.width && p.y < C.height;
const same = (a,b) => a.x === b.x && a.y === b.y;
const dist = (a,b) => Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
const mod = (a,n) => ((a%n)+n)%n;
const tileAt = p => S.tiles.find(t=>same(t,p));
const enemyAt = p => S.enemies.find(e=>e.hp>0 && same(e,p));
const unitAt = p => same(S.player,p) ? S.player : enemyAt(p);
const isPlayer = unit => unit === S.player;
const defOf = unit => isPlayer(unit) ? byId(DB.classes,S.classId) : DB.enemies[unit.type];
const nameOf = unit => isPlayer(unit) ? DB.labels.player : DB.enemies[unit.type].name;
const alive = unit => unit && unit.hp > 0;
const log = (key,args={},kind='info') => {
  S.logs.unshift({text:fmt(key,args),kind}); S.logs = S.logs.slice(0,C.maxLogs);
};
function seedNumber(seed) {
  let h = C.seedHash.offset;
  for (const ch of String(seed)) h = Math.imul(h ^ ch.codePointAt(0), C.seedHash.prime);
  return h >>> 0;
}
function rand() { S.rng = (Math.imul(S.rng,C.rng.a)+C.rng.c) >>> 0; return S.rng/C.rng.m; }
const pick = array => array[Math.floor(rand()*array.length)];
function shuffle(array) {
  const out = array.slice();
  for(let i=out.length-1;i>0;i--) { const j=Math.floor(rand()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}
function getStats() {
  if (!S) return clone(C.baseStats);
  const stats = clone(C.baseStats);
  for (const src of [byId(DB.classes,S.classId).stats || {}, ...S.relics.map(id=>byId(DB.relics,id)?.stats || {})]) {
    for(const [key,value] of Object.entries(src)) stats[key]=(stats[key] || 0)+value;
  }
  stats.damageBonus += Math.floor((S.player.level-C.startLevel)/C.levelDamageInterval)*C.levelDamageBonus;
  stats.maxEnergy = S.player.baseMaxEnergy+stats.maxEnergyBonus;
  return stats;
}
function syncStats() { S.player.maxEnergy=getStats().maxEnergy; }
function event(name) {
  for (const id of S.relics.slice()) {
    const item = byId(DB.relics,id);
    (item?.hooks || []).forEach((hook,index)=>{
      if(hook.event !== name) return;
      const key=id+':'+index;
      if(hook.limit >= 0 && (S.eventUses[key] || 0) >= hook.limit) return;
      S.eventUses[key]=(S.eventUses[key] || 0)+1;
      for(const effect of hook.effects) applyEffect(effect,{actor:S.player,source:'relic',targetCell:S.player});
    });
  }
}
function xp(value) {
  S.player.xp += value;
  while(S.player.xp >= S.player.xpNext) {
    S.player.xp -= S.player.xpNext;
    S.player.level++;
    S.player.xpNext += C.xpGrowth;
    S.player.maxHp += C.levelHp;
    if(S.player.hp>0) S.player.hp = Math.min(S.player.maxHp,S.player.hp+C.levelHeal);
    log('levelUp',{level:S.player.level,hp:C.levelHp},'good');
  }
  syncStats();
}
function damage(unit,value,context={}) {
  if(!alive(unit) || value <= 0) return;
  const absorb=context.pierce ? 0 : Math.min(unit.shield || 0,value);
  unit.shield=Math.max(0,(unit.shield || 0)-absorb);
  const amount=Math.max(0,value-absorb);
  unit.hp=Math.max(0,unit.hp-amount);
  if(isPlayer(unit)) S.stats.damageTaken+=amount;
  else {
    S.stats.damageDealt+=amount;
    if(context.source==='enemy' && amount>0) S.stats.redirects++;
  }
  log('damage',{unit:nameOf(unit),value:amount,shield:absorb},isPlayer(unit)?'bad':'good');
  if(unit.hp <= 0 && !isPlayer(unit)) {
    S.stats.kills++;
    S.enemies=S.enemies.filter(e=>e.id!==unit.id);
    log('kill',{unit:nameOf(unit)},'good');
    xp(DB.enemies[unit.type].xp);
    event('kill');
  }
}
function terrain(unit,phase) {
  if(!alive(unit)) return;
  const tile=tileAt(unit), def=DB.terrain[tile.type];
  if(def.playerOnly && !isPlayer(unit)) return;
  const effects=def[phase];
  if(!effects) return;
  const key=[unit.id || DB.labels.player,tile.id,phase].join(':');
  if(def.perTurn && S.terrainUses[key]) return;
  S.terrainUses[key]=true;
  for(const effect of effects) applyEffect(effect,{actor:unit,target:unit,targetCell:unit,source:'terrain'});
}
function enter(unit) {
  if(!alive(unit)) return;
  terrain(unit,'enter');
  if(!alive(unit)) return;
  const trap=S.traps.find(t=>same(t,unit));
  if(trap) {
    S.traps=S.traps.filter(t=>t.id!==trap.id);
    log('trapTrigger',{unit:nameOf(unit)},'system');
    const targets=[S.player,...S.enemies].filter(e=>alive(e) && dist(e,trap)<=trap.radius);
    for(const target of targets) damage(target,trap.damage,{source:'trap'});
  }
}
function displace(unit,direction,distance) {
  for(let i=0;i<distance && alive(unit);i++) {
    const next={x:unit.x+direction.x,y:unit.y+direction.y};
    if(!inside(next) || unitAt(next)) break;
    unit.x=next.x; unit.y=next.y;
    enter(unit);
  }
}
function shiftRow(row,direction,distance,manual=true) {
  const offset=direction*distance;
  for(const item of [...S.tiles,S.player,...S.enemies,...S.traps]) if(item.y===row) item.x=mod(item.x+offset,C.width);
  S.tiles.sort((a,b)=>a.y*C.width+a.x-(b.y*C.width+b.x));
  if(manual) { event('shift'); log('shift',{row:row+1,direction:direction>0?DB.labels.right:DB.labels.left},'system'); }
}
function effectTargets(effect,context) {
  if(effect.selector==='enemies') return S.enemies.filter(e=>dist(e,context.actor)<=effect.radius);
  if(effect.target==='player') return [S.player];
  return [context.target || enemyAt(context.targetCell || context.actor) || context.actor];
}
function applyEffect(effect,context) {
  const stats=getStats();
  const value=(effect.value || 0)+(effect.scale ? stats[effect.scale] || 0 : 0);
  const p=context.targetCell || context.actor;
  const targets=effectTargets(effect,context);
  switch(effect.op) {
    case 'move': context.actor.x=p.x; context.actor.y=p.y; enter(context.actor); break;
    case 'damage': for(const unit of targets) damage(unit,value,{source:context.source,pierce:effect.pierce}); break;
    case 'shield': for(const unit of targets) unit.shield=(unit.shield || 0)+value; break;
    case 'heal': for(const unit of targets) if(alive(unit)) unit.hp=Math.min(unit.maxHp,unit.hp+value); break;
    case 'energy': for(const unit of targets) if(isPlayer(unit)) unit.energy=Math.max(0,Math.min(C.energyCap,unit.energy+value)); break;
    case 'shift': shiftRow(p.y,effect.direction,effect.distance,true); break;
    case 'trap': S.traps.push({id:'t'+S.nextId++,x:p.x,y:p.y,damage:value,radius:effect.radius,owner:C.trapDefaultOwner}); break;
    case 'pull': case 'push': {
      for(const unit of targets) {
        if(unit===context.actor) continue;
        let dx=context.actor.x-unit.x,dy=context.actor.y-unit.y;
        const direction=Math.abs(dx)>=Math.abs(dy) ? {x:Math.sign(dx),y:0} : {x:0,y:Math.sign(dy)};
        if(effect.op==='push') { direction.x*=-1; direction.y*=-1; }
        displace(unit,direction,effect.distance+(effect.scale ? stats[effect.scale] || 0 : 0));
      }
      break;
    }
    default: throw Error('Unsupported effect operation: '+effect.op);
  }
}
function patternCells(enemy) {
  const def=DB.enemies[enemy.type], aim={x:S.player.x,y:S.player.y},radius=def.patternParams.radius;
  const all=S.tiles.map(t=>({x:t.x,y:t.y}));
  switch(def.pattern) {
    case 'point': return [aim];
    case 'cross': return all.filter(p=>(p.x===aim.x || p.y===aim.y) && dist(p,aim)<=radius);
    case 'ring': return all.filter(p=>dist(p,aim)===radius);
    case 'row': return all.filter(p=>p.y===aim.y);
    case 'ray': {

}
function planIntents() {

function moveEnemy(enemy) {

    const candidates=[{x:enemy.x-1,y:enemy.y},{x:enemy.x+1,y:enemy.y},{x:enemy.x,y:enemy.y-1},{x:enemy.x,y:enemy.y+1}].filter(p=>inside(p) && !unitAt(p));

    enemy.x=candidates[0].x;enemy.y=candidates[0].y;enter(enemy);

}
function rewardObject(item) {
  const reward=clone(item);
  if(item.kind==='ability') {
    const a=byId(DB.abilities,item.ref); reward.title=fmt('learnTitle',{name:a.name});reward.description=a.description;reward.icon=a.icon;
  }

    const a=byId(DB.relics,item.ref);reward.title=a.name;reward.description=a.description;reward.icon=a.icon;

}
function offerRewards() {
  const available=DB.rewards.filter(r=>(r.kind!=='ability' || !S.learned.includes(r.ref)) && (r.kind!=='relic' || !S.relics.includes(r.ref)));
  const specialised=shuffle(available.filter(r=>['ability','relic'].includes(r.kind)));
  const normal=shuffle(available.filter(r=>!['ability','relic'].includes(r.kind)));
  S.rewards=shuffle([...specialised.slice(0,Math.max(0,C.rewardChoices-1)),...normal.slice(0,1)]).slice(0,C.rewardChoices).map(rewardObject);
}
function checkOutcome() {

    S.history=[];
    if(S.stage>=DB.encounters.length-1) { S.phase='won';log('won',{},'good'); }

    }

  }

}
function startBattle() {
  const encounter=DB.encounters[S.stage];
  S.phase='battle';S.turn=C.startTurn;S.history=[];S.actionUses={};S.eventUses={};S.terrainUses={};S.rewards=[];S.routeOptions=[];S.traps=[];
  S.player.x=encounter.playerStart.x;S.player.y=encounter.playerStart.y;S.player.shield=C.startShield;
  syncStats();S.player.energy=S.player.maxEnergy;
  S.tiles=[];

  for(const tile of encounter.terrain) tileAt(tile).type=tile.type;
  if(S.pendingTerrain) {
    const possible=shuffle(S.tiles.filter(t=>t.type===C.defaultTerrain && !same(t,S.player)));
    for(const tile of possible.slice(0,S.pendingTerrain.count)) tile.type=S.pendingTerrain.type;
    S.pendingTerrain=null;
  }
  S.enemies=encounter.spawns.map(spawn=>{
    const def=DB.enemies[spawn.type];const maxHp=Math.ceil(def.hp*S.routeModifier.enemyHpMultiplier);
    return {id:C.entityPrefix+S.nextId++,type:spawn.type,x:spawn.x,y:spawn.y,hp:maxHp,maxHp,shield:def.shield || 0,intent:null};
  });

}
function createRun(classId=C.defaultClass,seed=C.defaultSeed) {
  const cls=byId(DB.classes,classId);
  if(!cls) return result(false,'classMissing');
  S={version:C.saveVersion,seed:String(seed),rng:seedNumber(seed),phase:'battle',stage:C.startStage,turn:C.startTurn,classId,player:{id:DB.labels.player,x:0,y:0,hp:cls.hp,maxHp:cls.hp,shield:C.startShield,energy:cls.energy,maxEnergy:cls.energy,baseMaxEnergy:cls.energy,level:C.startLevel,xp:C.startXp,xpNext:C.xpBase},enemies:[],tiles:[],traps:[],relics:cls.startingRelics.slice(),learned:cls.startingActions.slice(),logs:[],rewards:[],routeOptions:[],history:[],actionUses:{},eventUses:{},terrainUses:{},stats:{kills:0,damageDealt:0,damageTaken:0,turns:0,redirects:0},routeModifier:{enemyHpMultiplier:C.routeEnemyHpMultiplier,enemyDamageBonus:C.routeEnemyDamageBonus},nextId:0,pendingTerrain:null};

}
function getActions() {
  if(!S) return [];

    const out=clone(a);out.usesLeft=a.maxUses===undefined ? null : Math.max(0,a.maxUses-(S.actionUses[a.id] || 0));

    return out;
  });
}
function validateTarget(action,p,ignoreEnergy=false) {
  if(!S || S.phase!=='battle') return result(false,'notBattle');
  if(!action) return result(false,'unknownAction');
  if(!ignoreEnergy && action.disabledReason) return {ok:false,message:action.disabledReason};
  if(action.target==='self') return result(true,'valid');
  if(!inside(p)) return result(false,'outside');
  if(action.range>=0 && dist(p,S.player)>action.range) return result(false,'outOfRange');
  if(action.empty && unitAt(p)) return result(false,'occupied');
  if(action.noTrap && S.traps.some(t=>same(t,p))) return result(false,'trapExists');

}
function validTargets(actionId) {

}
function preview(actionId,target) {

  const validation=validateTarget(action,p);

  if(validation.ok) cells=action.target==='row' ? S.tiles.filter(t=>t.y===p.y).map(t=>({x:t.x,y:t.y})) : action.effects.some(e=>e.selector==='enemies') ? S.tiles.filter(t=>dist(t,S.player)<=Math.max(...action.effects.map(e=>e.radius || 0))).map(t=>({x:t.x,y:t.y})) : [p];

}
function snapshot() { if(!S) return null; const out=clone(S);out.history=[];return out; }
function act(actionId,target) {

}
function undo() {

function forecast() {

function chooseReward(id) {

    case 'maxHp':S.player.maxHp+=reward.value;S.player.hp+=reward.value;break;
    case 'xp':xp(reward.value);break;

  }

}
function chooseRoute(id) {

}
function describeIntent(enemy) {
  if(!enemy?.intent) return '';

}
function validateDB(db) {

function loadState(obj) {

}
window.Tide={DB,createRun,getState:()=>S,loadState,act,endTurn,undo,chooseReward,chooseRoute,snapshot,preview,validTargets,getActions,getStats,describeIntent,validateDB,forecast};
const errors=validateDB(DB);if(errors.length) console.error('Tide DB validation:',errors);
})();

<script>
(() => {

  const percent = (a, b) => Math.max(0, Math.min(100, num(a) / Math.max(1, num(b)) * 100));

    }
    if(action.target === 'self' || action.target === 'none') { perform(id); return; }
    selectedAction = selectedAction === id ? null : id;
    hoveredCell = null;
    renderActions(); updateTargetMarks(); renderTileInfo();
  }

  function renderPlayer(state) {
    const p = state.player, cls=lookup(DB.classes,state.classId || p.classId) || DB.classes[0];
    $('player-panel').innerHTML = `<div class="panel-label">${esc(UI.brand.english)}</div><div class="pilot-art">${icon('player')}<span class="pilot-level">${esc(T.level)} ${num(p.level)}</span></div><div class="player-name"><strong>${esc(cls.name)}</strong><span>${esc(T.level)} ${num(p.level)}</span></div><div class="meter-heading"><span>${esc(T.hp)}</span><strong>${num(p.hp)} <span>/ ${num(p.maxHp)}</span></strong></div><div class="meter hp"><i style="width:${percent(p.hp,p.maxHp)}%"></i></div><div class="meter-heading"><span>${esc(T.energy)}</span><strong>${num(p.energy)} <span>/ ${num(p.maxEnergy)}</span></strong></div><div class="energy-pips">${Array.from({length:Math.max(0,num(p.maxEnergy))},(_,i)=>`<i class="pip ${i<p.energy?'full':''}"></i>`).join('')}</div><div class="shield-line">${icon('shield')} ${esc(T.shield)} <strong>${num(p.shield)}</strong></div><div class="meter-heading xp-heading"><span>${esc(T.xp)}</span><strong>${num(p.xp)} / ${num(p.xpNext)}</strong></div><div class="meter xp"><i style="width:${percent(p.xp,p.xpNext)}%"></i></div>`;
    const relics=(state.relics||[]).map(id=>typeof id==='object'?id:lookup(DB.relics,id)).filter(Boolean);
    $('module-count').textContent = `${relics.length} ${T.moduleCount}`;
    $('modules').innerHTML = relics.length ? relics.map(r=>`<div class="module">${icon(r.icon)}<div><strong>${esc(r.name || r.title)}</strong><p>${esc(r.description)}</p></div></div>`).join('') : `<p class="empty">${esc(T.moduleEmpty)}</p>`;
  }

  function renderCampaign(state) {
    const encounter = typeof state.encounter === 'object' ? state.encounter : lookup(DB.encounters,state.encounter) || DB.encounters[state.stage];
    $('stage-number').textContent = String(state.stage+1).padStart(2,'0');
    $('encounter-name').textContent = encounter?.name || T.operation;
    $('encounter-subtitle').textContent = encounter?.subtitle || encounter?.description || UI.brand.tagline;
    $('turn-number').textContent = String(state.turn).padStart(2,'0');
    $('route-track').innerHTML = DB.encounters.map((e,i)=>`${i?'<i class="route-connector"></i>':''}<div class="route-node ${i===state.stage?'current':i<state.stage?'done':''}"><span>${i<state.stage?'✓':String(i+1).padStart(2,'0')}</span></div>`).join('');
    $('route-track').setAttribute('aria-label',`${T.campaign} ${state.stage+1}${T.stageOf}${DB.encounters.length}`);
    $('seed-display').textContent = `${T.seedLabel} / ${state.seed ?? ''}`;
  }

  function threats(state) {
    const cells = new Map();
    for (const e of state.enemies.filter(e=>e.hp>0)) for(const cell of e.intent?.cells || []) {
      const key=keyOf(cell.x,cell.y), value=cells.get(key)||{damage:0,enemies:[]};
      value.damage += num(e.intent.damage);value.enemies.push(e.id);cells.set(key,value);
    }
    return cells;
  }

  function renderBoard(state) {
    const W=DB.config.width,H=DB.config.height, danger=threats(state);
    $('column-labels').innerHTML=Array.from({length:W},(_,x)=>`<span class="coordinate">${String.fromCharCode(S.coordinateStart+x)}</span>`).join('');
    $('row-labels').innerHTML=Array.from({length:H},(_,y)=>`<span class="coordinate">${y+1}</span>`).join('');
    $('board').setAttribute('aria-rowcount',H);$('board').setAttribute('aria-colcount',W);
    $('board').innerHTML = state.tiles.map(tile => {
      const terrain=DB.terrain[tile.type]||{}, at=keyOf(tile.x,tile.y), threat=danger.get(at);
      const enemy=state.enemies.find(e=>e.hp>0&&e.x===tile.x&&e.y===tile.y), player=state.player.x===tile.x&&state.player.y===tile.y;
      let unit='';
      if(player) unit=`<span class="unit player">${icon('player')}<span class="unit-hp"><i style="width:${percent(state.player.hp,state.player.maxHp)}%"></i></span>${state.player.shield?`<span class="unit-shield">${num(state.player.shield)}</span>`:''}</span>`;
      if(enemy) { const type=DB.enemies[enemy.type]||{}; const order=state.enemies.filter(e=>e.hp>0).findIndex(e=>e.id===enemy.id)+1;
        unit=`<span class="unit enemy" style="color:${esc(type.color||UI.theme.danger)}">${icon(type.icon,'enemy')}<span class="unit-order">${order}</span><span class="unit-hp"><i style="width:${percent(enemy.hp,enemy.maxHp)}%"></i></span>${enemy.shield?`<span class="unit-shield">${num(enemy.shield)}</span>`:''}</span>`;
      }
      const trap=(state.traps||[]).find(trap=>trap.x===tile.x&&trap.y===tile.y);
      const tileLabel = `${String.fromCharCode(S.coordinateStart+tile.x)}${tile.y+1} · ${terrain.name||tile.type}${player?` · ${T.you}`:''}${enemy?` · ${DB.enemies[enemy.type]?.name}`:''}${threat?` · ${T.dangerTotal} ${threat.damage}`:''}`;
      return `<button class="tile terrain-${esc(tile.type)} ${player||enemy?'entity':''} ${threat?'threat':''}" data-x="${tile.x}" data-y="${tile.y}" data-threat="${threat?.enemies.map(esc).join(' ')||''}" role="gridcell" aria-label="${esc(tileLabel)}" style="--terrainColor:${esc(terrain.color||UI.theme.muted)}"><span class="terrain-art">${icon(terrain.icon,'water')}</span>${threat?`<span class="tile-badge">${threat.damage}</span>`:''}${unit}${trap?`<span class="trap-marker">${icon('trap')}${num(trap.timer ?? trap.turns ?? trap.fuse)}</span>`:''}</button>`;
    }).join('');
    const direction=state.tide?.direction;
    const row=state.tide?.row;
    $('tide-label').innerHTML=state.tide?`${icon(direction<0?'left':'right')} ${esc(T.forecast)} ${num(row)+1} · ${esc(T.shift)}`:`${icon('anchor')} ${esc(T.wrap)}`;
    $('tide-label').title=T.nextCurrent;
    updateTargetMarks();
  }

  function updateTargetMarks() {
    validCells=new Set();
    if(selectedAction&&game.getState().phase==='battle') {
      try { validCells=new Set(game.validTargets(selectedAction).map(c=>keyOf(c.x,c.y))); }catch{}
    }
    let affected=new Set();
    if(selectedAction&&hoveredCell) {try{affected=new Set((game.preview(selectedAction,hoveredCell)?.cells||[]).map(c=>keyOf(c.x,c.y)));}catch{}}
    $('board').querySelectorAll('.tile').forEach(el=>{
      const key=keyOf(num(el.dataset.x),num(el.dataset.y));
      el.classList.toggle('valid',validCells.has(key));el.classList.toggle('affected',affected.has(key));
      el.classList.toggle('focus-threat',Boolean(focusedEnemy&&el.dataset.threat.split(' ').includes(String(focusedEnemy))));
      el.classList.toggle('hovered',Boolean(hoveredCell&&num(el.dataset.x)===hoveredCell.x&&num(el.dataset.y)===hoveredCell.y));
    });
  }

  function renderTileInfo() {
    const state=game.getState(), action=cachedActions.find(a=>a.id===selectedAction);
    if (!hoveredCell) {
      const prediction=game.forecast();
      const forecastText=`${T.forecastPrefix} · ${T.forecastDamage} ${prediction.hpDamage}${prediction.pressure?` + ${T.forecastPressure} ${prediction.pressure}`:''} · ${T.forecastFriendly} ${prediction.friendlyFire}`;
      $('tile-info').innerHTML=`${icon(action?.icon||'eye')}<div><strong>${esc(action?.name || T.snapshot)}</strong><p>${esc(action?.description || (state.player.energy<=0?T.apEmpty:T.boardHint))}</p><p title="${esc(T.forecastNote)}" style="color:${esc(prediction.hpDamage||prediction.pressure?UI.theme.danger:UI.theme.accent)}">${esc(forecastText)}</p></div>`;return;
    }
    const {x,y}=hoveredCell,tile=state.tiles.find(t=>t.x===x&&t.y===y),terrain=DB.terrain[tile?.type]||{},enemy=state.enemies.find(e=>e.hp>0&&e.x===x&&e.y===y);
    let title=`${String.fromCharCode(S.coordinateStart+x)}${y+1} · ${terrain.name||tile?.type}`, description=terrain.description||'';
    if(enemy){title+=` · ${DB.enemies[enemy.type]?.name}`;description+=` · ${T.hp} ${enemy.hp}/${enemy.maxHp}`;}
    let preview=null;
    if(action)try{preview=game.preview(action.id,hoveredCell);}catch{}
    const detail=preview?.text || preview?.reason || description;
    $('tile-info').innerHTML=`${icon(action?.icon||terrain.icon,'crosshair')}<div><strong>${esc(title)}</strong><p class="${preview?.valid?'preview-text':''}">${esc(detail)}</p></div>`;
  }

  function renderActions() {
    const state=game.getState();
    cachedActions=game.getActions();
    if(selectedAction&&!cachedActions.some(a=>a.id===selectedAction))selectedAction=null;
    $('actions').innerHTML=cachedActions.map((a,i)=>{
      const disabled=state.phase!=='battle'||a.disabledReason||num(a.cost)>state.player.energy;
      return `<button class="action-card ${a.id===selectedAction?'active':''}" data-action="${esc(a.id)}" ${disabled?'disabled':''} aria-pressed="${a.id===selectedAction}" title="${esc(a.disabledReason||a.description)}"><div class="card-top">${icon(a.icon)}<span class="card-cost">${num(a.cost)}${icon('energy')}</span></div><strong>${esc(a.name)}</strong><p>${esc(actionSummary(a))}</p><span class="card-key">${i+1}</span></button>`;
    }).join('');
    $('end-btn').disabled=state.phase!=='battle';
    $('undo-btn').disabled=state.phase!=='battle'||!state.history?.length;
    $('undo-btn').title=state.history?.length?T.undo:T.noHistory;
  }

  function actionSummary(action) {
    const stats=game.getStats(),values={range:action.range,cost:action.cost};
    for(const effect of action.effects||[])values[effect.op]=num(effect.value??effect.distance)+(effect.scale?num(stats[effect.scale]):0);
    return (action.cardTemplate||action.cardText||action.short||action.description?.slice(0,S.cardShortLimit)||'').replace(/\{(\w+)\}/g,(_,key)=>values[key]??'');
  }

  function renderIntents(state) {
    const enemies=state.enemies.filter(e=>e.hp>0);
    $('enemy-count').textContent=String(enemies.length).padStart(2,'0');
    $('intents').innerHTML=enemies.length?enemies.map((e,i)=>{
      const type=DB.enemies[e.type]||{};let description='';
      try{description=game.describeIntent(e);}catch{}
      if(typeof description==='object')description=description.text||description.description||'';
      const coords=(e.intent?.cells||[]).map(c=>`${String.fromCharCode(S.coordinateStart+c.x)}${c.y+1}`).join(' · ');
      return `<div class="enemy-intent" data-enemy="${esc(e.id)}" tabindex="0"><div class="enemy-head">${icon(type.icon,'enemy')}<strong>${esc(type.name||e.type)}</strong><span class="sequence">${String(i+1).padStart(2,'0')}</span></div><div class="enemy-vitals"><div class="meter"><i style="width:${percent(e.hp,e.maxHp)}%"></i></div><span>${e.hp}/${e.maxHp}</span></div><div class="intent-detail">${esc(e.intent?.label||description)}<small>${esc(coords)}</small></div><div class="intent-damage">${icon('crosshair')} ${esc(T.attack)} ${num(e.intent?.damage)}${e.shield?` · ${T.shield} ${e.shield}`:''}</div></div>`;
    }).join(''):`<p class="empty">${esc(T.noEnemies)}</p>`;
    $('logs').innerHTML=(state.logs||[]).slice(0,S.logLimit).map(log=>`<div class="log-item ${esc(log.kind||'')}">${esc(log.text||log)}</div>`).join('');
  }

  function render() {
    const state=game.getState();
    renderCampaign(state);renderPlayer(state);renderActions();renderBoard(state);renderIntents(state);renderTileInfo();
    if(state.phase==='battle') {
      if(['reward','route','won','lost'].includes(modalKind))closeModal(true);
    }else if(state.phase!==modalKind)showPhase(state);
  }

  function openModal(kind,html,wide=false) {
    if($('modal-backdrop').hidden)previousFocus=document.activeElement;
    modalKind=kind;$('modal').classList.toggle('wide',wide);$('modal').innerHTML=html;$('modal-backdrop').hidden=false;
    document.body.style.overflow='hidden';
    requestAnimationFrame(()=>($('modal').querySelector('button:not(:disabled),input,textarea')||$('modal')).focus());
  }

  function closeButton() {return `<button class="icon-btn close-modal" data-modal="close" aria-label="${esc(T.close)}">${icon('close')}</button>`;}
  function closeModal(force=false) {
    if(!force&&['reward','route','won','lost','intro-start'].includes(modalKind))return;
    $('modal-backdrop').hidden=true;modalKind=null;document.body.style.overflow='';previousFocus?.focus?.();
  }

  function showIntro(canClose=false,seedValue='') {
    const seed=seedValue||`${S.seedPrefix}-${Math.floor(Math.random()*S.seedMax)}`;
    openModal(canClose?'intro':'intro-start',`${canClose?closeButton():''}<div class="intro-hero"><span class="eyebrow">${esc(T.introEyebrow)}</span><h2 id="modal-title">${esc(T.introTitle)}</h2><p class="lead">${esc(T.introBody)}</p><div class="intro-art">${icon('logo')}</div></div><div class="core-rule">${icon('shift')}<span>${esc(T.coreRule)}</span></div><label class="modal-label">${esc(T.chooseClass)}</label><div class="class-grid">${DB.classes.map(c=>`<button class="class-card ${c.id===introClass?'active':''}" data-class="${esc(c.id)}" aria-pressed="${c.id===introClass}">${icon(c.icon,'module')}<strong>${esc(c.name)}</strong><p>${esc(c.description)}</p><small>${esc(c.tagline||c.tag||c.specialty||'')}</small></button>`).join('')}</div><div class="seed-input"><label for="seed-input">${esc(T.seed)}</label><input id="seed-input" maxlength="${S.maxSeedLength}" value="${esc(seed)}" placeholder="${esc(T.seedPlaceholder)}"></div><div class="modal-actions"><button class="text-btn" data-modal="help">${icon('help')}${esc(T.help)}</button><button class="primary" data-modal="start">${esc(T.start)}${icon('right')}</button></div>`);
  }

  function showHelp() {
    const isIntro=['intro','intro-start'].includes(modalKind);
    const seed=$('seed-input')?.value;
    openModal(isIntro?'help-intro':'help',`${closeButton()}<span class="eyebrow">${esc(T.helpEyebrow)}</span><h2 id="modal-title">${esc(T.helpTitle)}</h2><p class="lead">${esc(T.coreRule)}</p><div class="tutorial-grid">${UI.tutorial.map(step=>`<div class="tutorial-step"><div class="step-heading">${icon(step.icon)}<span class="step-num">${esc(step.step)}</span></div><h3>${esc(step.title)}</h3><p>${esc(step.body)}</p></div>`).join('')}</div><p class="help-footer">${esc(T.helpFooter)}</p><div class="modal-actions"><button class="primary" data-modal="${isIntro?'back-intro':'close'}">${esc(T.continue)}${icon('right')}</button></div>`);
    if(isIntro)$('modal').dataset.introSeed=seed||'';
  }

  function showPhase(state) {
    if(state.phase==='reward'||state.phase==='route') {
      const reward=state.phase==='reward', options=reward?state.rewards:state.routeOptions;
      openModal(state.phase,`<span class="eyebrow">${esc(reward?T.rewardEyebrow:T.routeEyebrow)}</span><h2 id="modal-title">${esc(reward?T.rewardTitle:T.routeTitle)}</h2><p class="lead">${esc(reward?T.rewardBody:T.routeBody)}</p><div class="reward-grid">${(options||[]).map(option=>{
        const data=typeof option==='string'?(lookup(reward?DB.relics:DB.routes,option)||{id:option}):option;
        return `<button class="reward-card" data-${reward?'reward':'route'}="${esc(data.id)}"><span class="reward-icon">${icon(data.icon,reward?'module':'anchor')}</span><strong>${esc(data.title||data.name)}</strong><p>${esc(data.description)}</p><small>${esc(data.kindLabel||data.category||T.choose)}${icon('right')}</small></button>`;
      }).join('')}</div>`);
    } else if(['won','lost'].includes(state.phase)) {
      const won=state.phase==='won',stats=state.stats||{};
      openModal(state.phase,`<span class="eyebrow">${esc(won?T.wonEyebrow:T.lostEyebrow)}</span><h2 id="modal-title">${esc(won?T.wonTitle:T.lostTitle)}</h2><p class="lead">${esc(won?T.wonBody:T.lostBody)}</p><div class="summary-grid">${[[T.kills,stats.kills],[T.damage,stats.damageDealt],[T.redirects,stats.redirects],[T.turns,stats.turns]].map(([label,value])=>`<div class="summary-stat"><strong>${num(value)}</strong><span>${esc(label)}</span></div>`).join('')}</div><p class="db-help">${esc(T.seed)} · ${esc(state.seed)}</p><div class="modal-actions"><button class="text-btn" data-modal="save">${icon('download')}${esc(T.save)}</button><button class="primary" data-modal="new">${esc(T.newRun)}${icon('right')}</button></div>`);
    }
  }

  function showDB() {
    openModal('db',`${closeButton()}<span class="eyebrow">${esc(T.dbEyebrow)}</span><h2 id="modal-title">${esc(T.dbTitle)}</h2><p class="lead">${esc(T.dbBody)}</p><textarea class="db-editor" id="db-editor" spellcheck="false" aria-label="${esc(T.db)}"></textarea><div class="db-status" id="db-status" role="status"></div><p class="db-help">${esc(T.dbHelp)}</p><p class="db-help">${esc(T.dbNote)}</p><div class="modal-actions"><button class="text-btn" data-modal="db-reset">${esc(T.dbReset)}</button><button class="text-btn" data-modal="db-validate">${icon('shield')}${esc(T.dbValidate)}</button><button class="primary" data-modal="db-download">${icon('download')}${esc(T.dbDownload)}</button></div>`,true);
    $('db-editor').value=JSON.stringify(DB,null,2);
  }

  function validateEditor() {
    try{
      const data=JSON.parse($('db-editor').value),result=game.validateDB(data);
      let errors=[];
      if(Array.isArray(result))errors=result;
      else if(result?.ok===false||result?.valid===false)errors=result.errors||[result.message||T.dbInvalid];
      if(result===false)errors=[T.dbInvalid];
      if(!data.ui?.text||!data.ui?.icons||!data.ui?.theme)errors.push(T.dbInvalid);
      if(errors.length)throw Error(errors.join('\n'));
      $('db-status').textContent=T.dbOkay;$('db-status').style.color=UI.theme.accent;return data;
    }catch(error){$('db-status').textContent=error.message;$('db-status').style.color=UI.theme.danger;return null;}
  }

  function download(content,mime,name) {
    const url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),S.toastMs);
  }

  function downloadHTML(data) {
    const clone=document.documentElement.cloneNode(true);
    const dbScript=clone.querySelector('#game-db');
    dbScript.removeAttribute('src');
    dbScript.textContent='window.GAME_DB = '+JSON.stringify(data,null,2).replace(/</g,'\\u003c')+';';
    clone.querySelector('#modal-backdrop').hidden=true;
    clone.querySelector('#modal').innerHTML='';clone.querySelector('#toast').className='toast';
    clone.querySelector('body').style.overflow='';
    download('<!doctype html>\n'+clone.outerHTML,'text/html;charset=utf-8',T.fileName);
  }

  function exportSave(){download(JSON.stringify(game.snapshot(),null,2),'application/json;charset=utf-8',T.saveName);toast(T.saved);}
  function endTurn(){if(game.getState().phase==='battle')try{process(game.endTurn());}catch(e){toast(e.message,true);}}
  function undo(){try{process(game.undo());}catch(e){toast(e.message,true);}}

  $('board').addEventListener('click',event=>{
    const tile=event.target.closest('[data-x]');if(!tile||game.getState().phase!=='battle')return;
    hoveredCell={x:num(tile.dataset.x),y:num(tile.dataset.y)};
    if(selectedAction)perform(selectedAction,hoveredCell);else{updateTargetMarks();renderTileInfo();}
  });
  function hoverTile(event){const tile=event.target.closest('[data-x]');if(!tile)return;hoveredCell={x:num(tile.dataset.x),y:num(tile.dataset.y)};focusedEnemy=null;updateTargetMarks();renderTileInfo();}
  $('board').addEventListener('pointerover',hoverTile);$('board').addEventListener('focusin',hoverTile);
  $('board').addEventListener('pointerleave',()=>{hoveredCell=null;updateTargetMarks();renderTileInfo();});
  $('actions').addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el)selectAction(el.dataset.action);});
  function focusIntent(event){const el=event.target.closest('[data-enemy]');if(!el)return;focusedEnemy=el.dataset.enemy;hoveredCell=null;updateTargetMarks();}
  $('intents').addEventListener('pointerover',focusIntent);$('intents').addEventListener('focusin',focusIntent);
  $('intents').addEventListener('pointerleave',()=>{focusedEnemy=null;updateTargetMarks();});
  $('end-btn').addEventListener('click',endTurn);$('undo-btn').addEventListener('click',undo);
  $('help-btn').addEventListener('click',showHelp);$('db-btn').addEventListener('click',showDB);$('save-btn').addEventListener('click',exportSave);
  $('load-btn').addEventListener('click',()=>$('load-file').click());
  $('new-btn').addEventListener('click',()=>{
    openModal('new-confirm',`${closeButton()}<span class="eyebrow">${esc(UI.brand.english)}</span><h2 id="modal-title">${esc(T.newConfirmTitle)}</h2><p class="lead">${esc(T.newConfirmBody)}</p><div class="modal-actions"><button class="text-btn" data-modal="save">${icon('download')}${esc(T.save)}</button><button class="text-btn" data-modal="close">${esc(T.cancel)}</button><button class="primary" data-modal="new">${esc(T.newRun)}${icon('right')}</button></div>`);
  });
  $('load-file').addEventListener('change',async event=>{
    const file=event.target.files?.[0];if(!file)return;
    try {const data=JSON.parse(await file.text()),result=game.loadState(data);if(result?.ok===false)throw Error(result.message||T.invalidSave);selectedAction=null;closeModal(true);render();saveLocal();toast(T.loaded);}
    catch(error){toast(error.message||T.invalidSave,true);}event.target.value='';
  });
  $('modal').addEventListener('click',event=>{
    const classButton=event.target.closest('[data-class]');
    if(classButton){introClass=classButton.dataset.class;const seed=$('seed-input')?.value,canClose=modalKind==='intro';showIntro(canClose,seed);return;}
    const reward=event.target.closest('[data-reward]');if(reward){process(game.chooseReward(reward.dataset.reward));return;}
    const route=event.target.closest('[data-route]');if(route){selectedAction=null;process(game.chooseRoute(route.dataset.route));return;}
    const button=event.target.closest('[data-modal]');if(!button)return;
    const cmd=button.dataset.modal;
    if(cmd==='close'){if(modalKind==='help-intro'){showIntro(false,$('modal').dataset.introSeed);return;}closeModal();}
    if(cmd==='help')showHelp();
    if(cmd==='back-intro')showIntro(false,$('modal').dataset.introSeed);
    if(cmd==='start'){const seed=$('seed-input').value.trim()||`${S.seedPrefix}-${Math.floor(Math.random()*S.seedMax)}`;const result=game.createRun(introClass,seed);if(result?.ok===false){toast(result.message,true);return;}selectedAction=null;closeModal(true);render();saveLocal();}
    if(cmd==='new')showIntro(false);
    if(cmd==='save')exportSave();
    if(cmd==='db-reset'){$('db-editor').value=JSON.stringify(DB,null,2);$('db-status').textContent='';}
    if(cmd==='db-validate')validateEditor();
    if(cmd==='db-download'){const data=validateEditor();if(data)downloadHTML(data);}
  });
  $('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop'))closeModal();});

  document.addEventListener('keydown',event=>{
    if(!$('modal-backdrop').hidden){
      if(event.key==='Escape'){event.preventDefault();if(modalKind==='help-intro')showIntro(false,$('modal').dataset.introSeed);else closeModal();}
      if(event.key==='Tab'){
        const controls=[...$('modal').querySelectorAll('button:not(:disabled),input,textarea,[tabindex="0"]')];const first=controls[0],last=controls.at(-1);
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
      }return;
    }
    if(event.target.closest('input,textarea')||event.ctrlKey||event.metaKey||event.altKey)return;
    if(event.code==='Space'){event.preventDefault();endTurn();}
    else if(event.key.toLowerCase()==='z'){event.preventDefault();undo();}
    else if(event.key==='Escape'){selectedAction=null;hoveredCell=null;renderActions();updateTargetMarks();renderTileInfo();}
    else if(/^[1-9]$/.test(event.key)){const action=cachedActions[num(event.key)-1];if(action){event.preventDefault();selectAction(action.id);}}
  });

  let restored=false;
  try{const saved=localStorage.getItem(S.storageKey);if(saved){const result=game.loadState(JSON.parse(saved));restored=result?.ok!==false;}}catch{}
  if(!restored)game.createRun(DB.classes[0].id,`${S.seedPrefix}-${Math.floor(Math.random()*S.seedMax)}`);
  render();
  if(!restored)showIntro();else toast(T.restored);
  window.TideUI={render,showIntro,showHelp,showDB,selectAction,exportSave};
})();

</script>
</body>
</html>
