function updateEnemies(dt,only=null){const map=mapDef(),p=S.player;for(const e of only?[only]:instance().enemies){const m=DB.monsters[e.template];e.flash=Math.max(0,e.flash-dt);e.moving=false;if(e.dead){if(map.kind==='field'&&!e.eventId&&S.time>=e.respawnAt&&dist(e,p)>C.aggroRange){e.dead=false;e.hp=e.maxHp;e.x=e.homeX;e.y=e.homeY;e.phase=0;e.patternIndex=0;e.addsSpawned=false;e.threat={};e.contributions={};e.lastOwner=null;e.engagedUntil=0;e.castingUntil=0;e.attackAt=S.time+C.enemyAttackStartDelay;}continue;}for(const status of e.statuses)if(status.until>S.time&&status.id!=='slow'&&status.next<=S.time){status.next+=C.statusTick;damageEnemy(e,status.power*C.statusTick,{dot:true,sourceOwner:status.owner,element:DB.online.statusElements[status.id]});}e.statuses=e.statuses.filter(s=>s.until>S.time);if(e.dead)continue;if(m.boss){const phase=m.phases?.[e.phase]||(!m.phases&&!e.addsSpawned?{threshold:C.bossPhaseRatio,adds:m.adds}:null);if(phase&&e.hp/e.maxHp<phase.threshold){e.phase++;e.addsSpawned=true;e.patternIndex=0;for(const [i,id]of phase.adds.entries()){const off=C.bossAddOffsets[i%C.bossAddOffsets.length];instance().enemies.push(growth.scaleAdd(spawnEnemy({monster:id,level:e.level,x:e.x+off[0],y:e.y+off[1]},0)));}sound('boss');}}if(e.castingUntil>S.time)continue;const d=dist(e,p),engaged=e.engagedUntil>S.time;if(e.patrol?.length&&d>C.aggroRange&&!engaged){const point=e.patrol[e.patrolIndex%e.patrol.length],aim={x:point[0],y:point[1]};if(dist(e,aim)<C.pathWaypointTolerance)e.patrolIndex++;steerEnemy(e,aim,e.speed,dt);e.homeX=e.x;e.homeY=e.y;continue;}const home=Math.hypot(e.x-e.homeX,e.y-e.homeY);if(home>C.leashRange||d>C.aggroRange&&!engaged&&home>C.playerRadius){steerEnemy(e,{x:e.homeX,y:e.homeY},e.speed,dt);e.hp=Math.min(e.maxHp,e.hp+e.maxHp*C.returnHeal*dt);e.moving=true;continue;}if(d>C.aggroRange&&!engaged)continue;e.facing=p.x>=e.x?1:-1;const range=m.range;if(d>range){const speed=e.speed*(e.statuses.some(s=>s.id==='slow')?C.slowFactor:1);steerEnemy(e,p,speed function pointInHazard(h,p){if(h.kind==='line'){const x=p.x-h.x,y=p.y-h.y,along=x*h.dx+y*h.dy,across=Math.abs(x*h.dy-y*h.dx);return along>=-C.playerRadius&&along<=h.length+C.playerRadius&&across<h.radius+C.playerRadius;}const d=Math.hypot(p.x-h.x,p.y-h.y);if(h.kind==='ring')return d<h.radius+C.playerRadius&&d>Math.max(0,h.innerRadius-C.playerRadius);if(h.kind==='cone'){const angle=Math.atan2(p.y-h.y,p.x-h.x)-Math.atan2(h.dy,h.dx),delta=Math.atan2(Math.sin(angle),Math.cos(angle));return d<h.radius+C.playerRadius&&(d<C.playerRadius||Math.abs(delta)<h.angle/2);}return d<h.radius+C.playerRadius;}
function updateHazards(){for(const h of S.hazards){const source=instance().enemies.find(e=>e.id===h.source);if(h.source&&(!source||source.dead)){h.expires=S.time;continue;}if(!h.hit&&h.at<=S.time){h.hit=true;if(pointInHazard(h,S.player))hurtPlayer(h.damage,source,h.element);if(source&&h.kind==='line'&&h.dash)moveActor(source,h.dx*h.length*C.hazardDashFraction,h.dy*h.length*C.hazardDashFraction);}}S.hazards=S.hazards.filter(h=>h.expires>S.time);}

function tick(dt,shared=false){if(!S)return;dt=Math.min(dt,C.step);const previousTime=S.time;S.time+=dt;refreshDash();S.playTime+=dt;S.buffs=S.buffs.filter(b=>b.until>S.time);S.notices=S.notices.filter(n=>n.until>S.time);S.lootFeed=S.lootFeed.filter(n=>n.until>S.time);const p=S.player,st=stats();advanceMovement(p,S.input,st,dt,previousTime);p.hp=Math.min(st.hp,p.hp+(st.hpRegen+(mapDef().kind==='town'?st.hp*C.safeRegen:0))*dt);p.mp=Math.min(st.mp,p.mp+st.manaRegen*dt*(mapDef().kind==='town'?1+C.safeRegen:1));p.shield=Math.min(p.shield,st.hp*C.shieldCapRatio);p.flash=Math.max(0,p.flash-dt);p.attackFlash=Math.max(0,(p.attackFlash||0)-dt);if(mapDef().kind!=='town'){if(!shared){updateMechanics();updateTrial();updateEnemies(dt);}playerCombat();updateProjectiles(dt);if(!shared)updateHazards();updateCompanion();}if(!shared)updateWorld();for(const list of [S.effects,S.floats,S.orbs])for(const e of list)e.life-=dt;S.effects=S.effects.filter(x=>x.life>0);S.floats=S.floats.filter(x=>x.life>0);for(const orb of S.orbs)if(S.time-orb.at>C.orbDelay){const d=dist(orb,p)||1;orb.x+=(p.x-orb.x)/d*C.dropMagnetSpeed*dt;orb.y+=(p.y-orb.y)/d*C.dropMagnetSpeed*dt;if(d<C.pickupRadius)orb.life=0;}S.orbs=S.orbs.filter(x=>x.life>0);S.shake=Math.max(0,S.shake-DB.render.shakeDecay*dt);growth.tick(dt);}

function objectiveProgress(quest,index){const o=quest.objectives[index],record=S.quests[quest.id];let value=0;const key=o.kind==='kill'?(o.group?'killGroup:'+o.group+':'+o.target:'kill:'+o.map+':'+o.target):o.kind+':'+o.target;if(o.kind==='kill')value=record?.baselineMetrics?(S.metrics[key]||0)-(record.baselineMetrics[key]||0):(S.killCounts[o.target]||0)-(record?.baseline?.[o.target]||0);if(o.kind==='boss')value=S.bossKills[o.target]||0;if(['event','tier','trial','mechanism'].includes(o.kind))value=(S.metrics[key]||0)-(quest.repeatable?(record?.baselineMetrics?.[key]||0):0);if(o.kind==='interact')value=S.interactions[o.target]||0;if(o.kind==='material')value=S.materials[o.target]||0;if(o.kind==='visit')value=S.visited[o.target]?1:0;if(o.kind==='discover')value=S.discoveries[o.target]?1:0;return clamp(value,0,o.count);}
function questStatus(id){const q=find(DB.quests,id),r=S.quests[id];if(!q)return 'locked';if(r?.status==='complete'&&!q.repeatable)return 'complete';if(r?.status==='active')return q.objectives.every((o,i)=>objectiveProgress(q,i)>=o.count)?'ready':'active';if(q.repeatable&&r?.completedAt!=null&&S.time-r.completedAt<(q.cooldown||C.questRepeatCooldown))return 'cooling';if((!q.requires||S.quests[q.requires]?.status==='complete')&&S.level>=(q.minLevel||1))return 'available';return 'locked';}

function acceptQuest(id){const q=find(DB.quests,id);if(!q||questStatus(id)!=='available')return fail('locked');if(!nearNpc(q.npc))return fail('returnNpc');S.quests[id]={status:'active',baseline:copy(S.killCounts),baselineMetrics:copy(S.metrics),completions:S.quests[id]?.completions||0};notice('questAccepted',{},'good');return ok();}
function grant(reward){if(reward.xp)gainXp(reward.xp);if(reward.gold)S.gold=clamp(S.gold+reward.gold,0,C.maxGold);if(reward.potions)S.potions+=reward.potions;if(reward.points)S.points+=reward.points;for(const [id,n]of Object.entries(reward.materials||{}))addMaterial(id,n);for(const [id,n]of Object.entries(reward.reputation||{}))S.reputation[id]=clamp((S.reputation[id]||0)+n,0,C.repMax);for(const [id,n]of Object.entries(reward.supplies||{})){const c=find(DB.consumables,id);if(c?.pool)S[c.pool]=(S[c.pool]||0)+n;else S.supplies[id]=(S.supplies[id]||0)+n;}if(reward.companion){S.companions[reward.companion]={unlocked:true,bond:S.companions[reward.companion]?.bond||0};if(!S.companionId)S.companionId=reward.companion;}}

function adjustRealmStats(values,duel,guildLevel){
 const O=DB.online;

function tradeBody(context){const trade=context.trade;if(!trade)return '';const mine=trade.offers[view.profile.id],items=tradeItems();return `<section class="trade-panel"><h3>${T.trade}</h3><p>${T.tradeHint}</p><div class="trade-offers">${trade.members.map(id=>`<article><strong>${esc(trade.names[id])}</strong><p>${trade.offers[id]?.coins||0} ${T.crowns}</p>${(trade.offers[id]?.items||[]).map(i=>`<small>${esc(G.itemName(i))}</small>`).join('')}${trade.confirmed[id]===trade.revision?tag(T.tradeWaiting):''}</article>`).join('')}</div><label>${T.tradeSelect}<select id="online-trade-items" multiple size="${O.tradeSelectRows}">${[...items,...mine?.items||[]].map(i=>`<option value="${i.id}" ${mine?.items.some(v=>v.id===i.id)?'selected':''}>${esc(G.itemName(i))}</option>`).join('')}</select></label><label>${T.tradeCoins}<input id="online-trade-coins" type="number" min="0" value="${mine?.coins||0}"></label><div class="button-row">${button('trade-offer',T.tradeOffer)}${button('rpc',T.tradeConfirm,{method:'trade.confirm',number:trade.revision},!trade.members.every(id=>trade.offers[id]),'primary')}${button('rpc',T.tradeCancel,{method:'trade.cancel'})}</div></section>`;}
function mailBody(p){const mails=p.mails.filter(m=>!m.claimed);return `<div class="online-mail-list">${mails.map(m=>`<article><div><strong>${T[m.subject]||esc(m.subject)}</strong>${m.coins?`<p>${m.coins} ${T.crowns}</p>`:''}${m.items.map(i=>`<small>${esc(G.itemName(i))}</small>`).join('')}</div>${button('rpc',T.mailClaim,{method:'mail.claim',target:m.id},false,'primary')}</article>`).join('')||`<p>${T.mailEmpty}</p>`}</div>`;}
function pvpBody(context){return `<p>${T.pvpHint}</p><p>${T.pvpRating} <b>${view.profile.rating}</b> · ${T.pvpWins} ${view.profile.metrics.pvpWins||0}</p>${invitesBody(context)}<div class="online-player-list">${context.players.filter(p=>p.id!==view.profile.id).map(p=>`<article><strong>${esc(p.name)} · ${esc(DB.classes.find(c=>c.id===p.classId).name)}</strong>${button('rpc',T.pvpInvite,{method:'pvp.invite',target:p.id},false,'primary')}</article>`).join('')}</div><h3>${T.leaderboard}</h3><ol class="online-ranking">${view.ranking.map(r=>`<li><span>${esc(r.name)}</span><b>${r.rating}</b></li>`).join('')}</ol>`;}
function rewardLabel(reward){return Object.entries(reward).map(([key,n])=>`${n} ${T[key]||key}`).join(' · ');}
function recordsBody(p){return `<h3>${T.expeditionBook}</h3><div class="online-card-grid">${DB.expeditionGoals.map(g=>{const period=g.period+':'+view[g.period],value=p.periods[period]?.[g.metric]||0,claimed=p.claims[period+':'+g.id];return `<article><h4>${esc(g.name)}</h4><b>${value}/${g.target}</b><p>${esc(rewardLabel(g.rewards))}</p>${button('rpc',claimed?T.complete:T.claim,{method:'goal.claim',target:g.id},claimed||value<g.target,'primary')}</article>`;}).join('')}</div><h3>${T.achievements}</h3><div class="achievement-list">${DB.achievements.map(a=>{const value=a.metric==='mastery'?G.state().masteryLevel:p.metrics[a.metric]||0,claimed=p.claims[a.id];return `<article><div><strong>${esc(a.name)}</strong><small>${value}/${a.target} · ${esc(rewardLabel(a.rewards))}</small></div>${button('rpc',claimed?T.complete:T.achievementClaim,{method:'achievement.claim',target:a.id},claimed||value<a.target)}</article>`;}).join('')}</div>`;}
function summonBody(p){return `<p>${T.summonHint}</p><div class="summon-controls"><strong>${T.summonPity} ${O.drawPity-p.pity}</strong>${button('rpc',`${T.summonOne} · ${O.drawCost} ${T.stars}`,{method:'summon',number:1},p.stars<O.drawCost,'primary')}${button('rpc',`${T.summonTen} · ${O.drawCost*O.drawTen} ${T.stars}`,{method:'summon',number:O.drawTen},p.stars<O.drawCost*O.drawTen)}${button('rpc',T.shardExchange,{method:'shards.exchange'},p.shards<O.shardExchange)}</div>${draws.length?`<div class="summon-results">${draws.map(r=>{const spirit=find(DB.spirits,r.id);return `<article style="--spirit:${spirit.color}"><strong>${esc(spirit.name)}</strong><small>${esc(find(DB.rarities,spirit.rarity).name)}</small>${r.duplicate?tag(T.summonDuplicate):''}</article>`;}).join('')}</div>`:''}<div class="spirit-grid">${DB.spirits.map(s=>`<article style="--spirit:${s.color}" class="${p.spirits[s.id]?'owned':'locked'}"><span class="spirit-orb"></span><h4>${esc(s.name)}</h4>${ui().changes(s.stats)}${button('rpc',G.state().spiritId===s.id?T.spiritActive:T.spiritEquip,{method:'spirit.equip',target:s.id},!p.spirits[s.id]||G.state().spiritId===s.id)}</article>`).join('')}</div>`;}
function masteryBody(s){return `<p>${T.masteryHint}</p><div class="mastery-budget"><strong>${T.mastery} ${s.masteryLevel} · ${T.infinite}</strong><b>${T.masteryPoints} ${s.masteryPoints}</b><small>${s.masteryXp}/${G.masteryNeeded()} ${T.xp}</small></div><div class="online-card-grid">${DB.masteryTracks.map(m=>`<article><h4>${esc(m.name)}</h4>${ui().changes(m.stats)}<b>${s.masteryRanks[m.id]||0} · ${G.masteryCost(m.id)} ${T.masteryPoints}</b>${button('mastery',T.masteryLearn,{id:m.id},s.level<C.maxLevel||s.masteryPoints<G.masteryCost(m.id))}</article>`).join('')}</div>`;}
async function rpc(method,args=[]){const result=await command('social.'+method,args);if(result.ok){if(result.draws)draws=result.draws;if(G.mapDef().id==='duel_arena'||method==='raid.enter'){ui().closeModal();return;}await refresh();}}
async function handleAction(action,el){const name=action.slice('online-'.length),data=el.dataset;
 if(name==='open'){await show();return;}if(name==='auth-mode'){authMode=data.id;showAuth();return;}if(name==='authenticate'){const values={username:$('online-username').value,password:$('online-password').value};if(data.mode==='register'){Object.assign(values,{name:$('online-name').value,raceId:$('online-race').value,classId:$('online-class').value});if($('online-legacy')?.checked)values.legacy=G.snapshot();}el.disabled=true;try{const result=await request('auth/'+data.mode,values);if(!result.ok){message(result.message,true);el.disabled=false;return;}await start();}catch{el.disabled=false;message(T.onlineError,true);}return;}
 if(name==='open-server'){try{const url=new URL($('online-server-address').value);if(!/^https?:$/.test(url.protocol))throw Error();window.open(url.origin,'_blank','noopener,noreferrer');}catch{message(T.onlineInvalid,true);}return;}
 if(name==='logout'){await logout();return;}if(name==='tab'){tab=data.id;await refresh();return;}if(name==='rpc'){await rpc(data.method,data.target!==undefined?[data.target]:data.number!==undefined?[Number(data.number)]:[]);return;}if(name==='chat'){await rpc('chat',[$('online-chat-input').value,chatChannel]);return;}if(name==='join-party'){await rpc('party.join',[$('online-party-code').value]);return;}if(name==='role'){await rpc('party.role',[$('online-party-role').value]);return;}if(name==='create-guild'){await rpc('guild.create',[$('online-guild-name').value]);return;}if(name==='join-guild'){await rpc('guild.join',[$('online-guild-code').value]);return;}if(name==='donate'){await rpc('guild.donate',[Number($('online-guild-donation').value)]);return;}if(name==='list'){await rpc('market.list',[$('online-market-item').value,Number($('online-market-price').value)]);return;}if(name==='trade-offer'){await rpc('trade.offer',[[...$('online-trade-items').selectedOptions].map(v=>v.value),Number($('online-trade-coins').value)]);return;}if(name==='mastery'){const result=await command('learnMastery',[data.id]);if(result.ok)await refresh();}}
async function exportSave(){if(!active)return;try{const result=await request('save');if(!result.ok){message(result.message,true);return;}const blob=new Blob([JSON.stringify(result.save,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=T.exportName;link.click();setTimeout(()=>URL.revokeObjectURL(url),C.noticeTime*C.milliseconds);}catch{message(T.onlineError,true);}}
window.RPGOnline={exportSave,stopInput,init,show,start,logout,step,route,command,handleAction,status,isActive:()=>active,isConnected:()=>connected};
})();

/* A single growth hub; all mutations use the same authenticated action bindings. */
(() => {

let tab=D.tabs[0].id,depth=null,forgeFlash=0;

const amount=value=>Math.floor(value).toLocaleString('ko-KR'),text=(key,args)=>G.text(key,args),heading=(title,hint)=>`<div class="growth-heading"><h3>${esc(title)}</h3>${hint?`<p>${esc(hint)}</p>`:''}</div>`;

function reward(reward){return [reward.gold?`${amount(reward.gold)} ${T.gold}`:'',reward.xp?`${amount(reward.xp)} ${T.xp}`:'',...Object.entries(reward.materials||{}).map(([id,n])=>`${find(DB.materials,id).name} ×${n}`),...Object.entries(reward.supplies||{}).map(([id,n])=>`${find(DB.consumables,id).name} ×${n}`)].filter(Boolean).map(esc).join(D.ui.separator);}
function weaponBody(){const s=G.state(),w=G.weaponProgress(),cost=w.cost,ready=w.item&&w.atSmith&&s.gold>=cost.gold&&s.level>=cost.level&&w.xp>=cost.practice&&Object.entries(cost.materials).every(([id,n])=>s.materials[id]>=n),success=performance.now()-forgeFlash<D.ui.forgeFlashMs&&forgeFlash>0;
 return `${heading(T.mainWeapon,T.forgeHint)}${w.refund.gold||w.refund.ore?`<section class="growth-project"><b>${T.growthRefund}</b><p>${T.growthRefundHint}</p><strong>${amount(w.refund.gold)} ${T.gold} · ${amount(w.refund.ore)} ${find(DB.materials,'ore').name}</strong>${button('growth-refund',T.growthRefundClaim,{},false,'primary')}</section>`:''}<section class="forge-stage ${success?'forge-success':''}" style="--forge-color:${w.tier.color}"><div class="forge-portrait">${window.RPGArt.heroPortrait(s.raceId,s.classId)}</div><div><span class="eyebrow">${esc(w.tier.name)} · ${esc(w.pathDefinition.name)}</span><strong class="forge-rank">+${w.rank}</strong><h3>${esc(w.item?G.itemName(w.item):T.emptySlot)}</h3><small>${T.weaponProficiency} ${w.proficiency} · ${T.growthPower}</small></div><div class="forge-seal">${icon('anvil')}</div></section>${ui().weaponSlots(w)}${button('inventory-weapons',T.gearWeapons)}<section class="forge-next"><div><h4>${T.forgeNext} +${w.rank+1}</h4><span>${T.practice} ${amount(w.xp)} / ${amount(cost.practice)}</span></div>${meter(w.xp,cost.practice)}${costs(cost)}${w.item?ui().comparison(G.previewForge(),G.stats(),T.upgradePreview):''}${button('forge-main',`${icon('anvil')}${T.forgeMain} +${w.rank+1}`,{},!ready,'primary full')}<small>${w.atSmith?T.forgeLegacy:T.forgeReady}</small></section><details class="growth-details"><summary>${T.forgePath}</summary><p>${T.forgePathHint} · ${D.weapon.pathCost} ${T.gold}</p><div class="growth-card-grid">${D.paths.map(p=>`<article class="growth-card ${w.path===p.id?'selected':''}"><h4>${icon(p.icon)}${esc(p.name)}</h4><p>${esc(p.description)}</p>${p.stats.length?ui().changes(p.stats):''}${button('forge-path',w.path===p.id?T.equipped:T.select,{id:p.id},w.path===p.id||!w.atSmith||s.gold<D.weapon.pathCost,w.path===p.id?'selected':'')}</article>`).join('')}</div></details><details class="growth-details"><summary>${T.growthMaterials}</summary><p>${T.growthSources}</p>${button('growth-tab',T.refining,{id:'life'})}</details>`;
}
function refineBody(){return `${heading(T.refining,T.refineHint)}<div class="growth-card-grid">${D.refinements.map(r=>{const cost=G.refinementInfo(r.id),s=G.state(),ready=cost.atSmith&&s.gold>=cost.gold&&Object.entries(cost.materials).every(([id,n])=>s.materials[id]>=n);return `<article class="growth-card"><h4>${icon(r.icon)}${esc(r.name)}</h4><p>${esc(r.description)}</p><strong class="growth-reward">${reward(r.reward)}</strong>${costs(cost)}${button('refine',T.refine,{id:r.id},!ready,'primary')}</article>`;}).join('')}</div>`;}
function riftBody(){const s=G.state(),r=G.riftStatus();if(depth===null||depth>r.next)depth=r.next;const choices=[...new Set([1,Math.max(1,r.best-D.ui.replayOffset),Math.max(1,r.best),r.next])],run=r.run;

function lifeBody(){const s=G.state(),g=G.growthState(),board=G.contractBoard();return `${projectBody(s.onlineContext?.project)}${heading(T.vocation,T.vocationHint)}<div class="growth-card-grid">${D.vocations.map(v=>{const p=G.profession(v.id),active=g.vocation===v.id;return `<article class="growth-card ${active?'selected':''}"><h4>${icon(v.icon)}${esc(v.name)}</h4><b>${text('vocationLevel',{level:p.level})}</b>${meter(p.progress,1)}<p>${esc(v.description)}</p>${button('vocation',active?T.equipped:T.vocationSelect,{id:v.id},active||G.mapDef().kind!=='town'||s.gold<D.life.changeCost)}<small>${active?'':D.life.changeCost+' '+T.gold}</small></article>`;}).join('')}</div>${heading(T.contracts,T.contractHint)}<div class="growth-contract-grid">${board.active.map(c=>`<article class="growth-card active-contract"><h4>${esc(c.name)}</h4><b>${c.label} ${Math.min(c.progress,c.count)} / ${c.count}</b>${meter(c.progress,c.count)}<small>${reward(c.reward)}</small>${button('contract-claim',T.contractClaim,{id:c.id},c.progress<c.count,'primary')}${button('contract-cancel',T.contractCancel,{id:c.id})}</article>`).join('')}${board.offers.map(c=>`<article class="growth-card"><h4>${esc(c.name)}</h4><p>${esc(c.label)} ×${c.count}</p><small>${reward(c.reward)}</small>${button('contract-accept',T.contractAccept,{id:c.id},board.active.length>=D.contracts.activeLimit)}</article>`).join('')}</div>${heading(T.tool,T.toolHint)}<div class="growth-card-grid">${D.combat.toolIds.map(id=>{const item=find(DB.consumables,id),selected=g.combat.toolId===id;return `<article class="growth-card ${selected?'selected':''}"><h4>${icon(item.icon)}${esc(item.name)} ×${s.supplies[id]||0}</h4><p>${esc(item.description)}</p>${button('equip-tool',selected?T.equipped:T.equipTool,{id},selected||G.inCombat())}</article>`;}).join('')}</div><details class="growth-details"><summary>${T.refining}</summary><p>${T.refineHint}</p>${refineBody()}</details>`;}

function nextGoal(w){const s=G.state(),c=w.cost;if(s.level<c.level)return text('growthNeedLevel',{level:c.level});if(w.xp<c.practice)return text('growthNeedPractice',{count:amount(c.practice-w.xp)});const missing=Object.entries(c.materials).find(([id,n])=>s.materials[id]<n);if(missing)return text('growthNeedMaterial',{name:find(DB.materials,missing[0]).name,count:amount(missing[1]-s.materials[missing[0]]),source:D.ui.materialSources[missing[0]]});if(s.gold<c.gold)return text('growthNeedGold',{count:amount(c.gold-s.gold)});return T.growthNextForge;}
function body(){const w=G.weaponProgress(),ready=G.contractBoard().active.filter(c=>c.progress>=c.count).length;return `<div class="growth-hub"><nav class="growth-tabs">${D.tabs.map(t=>button('growth-tab',`${icon(t.icon)}<span>${esc(t.name)}</span>`,{id:t.id},false,tab===t.id?'selected':'')).join('')}</nav><div class="growth-goal"><span>${icon('chevron')}${T.journeyGoal}</span><b>${ready?text('growthReadyContracts',{count:ready}):nextGoal(w)}</b>${ready?button('growth-tab',T.contractClaim,{id:'life'},false,'primary'):''}</div>${tab==='weapon'?weaponBody():tab==='rift'?riftBody():tab==='life'?lifeBody():legacyBody()}</div>`;}
function open(id=tab){if(find(D.tabs,id))tab=id;ui().openModal('journey',T.journey,body(),true);}
function onResult(action,result){if(result.ok&&action==='forge-main')forgeFlash=performance.now();}
function handleAction(action,el){if(action==='flow-help'){ui().openModal('flow',T.flowGuide,flowGuide());return true;}if(action==='journey'){open();return true;}if(action==='growth-tab'){open(el.dataset.id);return true;}if(action==='growth-depth'){depth=Number(el.dataset.index);open('rift');return true;}
 const spec=DB.online.actionBindings[action],method=action==='project-claim'?'claimProject':spec?.method;if(!D.ui.actions.includes(action))return false;const values={...el.dataset,index:Number(el.dataset.index)},args=(spec?.args||[]).map(id=>values[id]);const result=G[method](...args);onResult(action,result);if(!result.ok){ui().toast(result.message,true);return true;}if(result.message)ui().toast(result.message);ui().save();if(spec.close)ui().closeModal();else ui().refreshModal();ui().updateHUD();return true;
}
function updateHUD(){const s=G.state(),c=G.combatView(),w=G.weaponProgress(),flow=$('flow-number'),fill=$('flow-fill'),swap=$('weapon-swap'),tool=$('field-tool'),surge=$('surge-action');if(flow)flow.textContent=c.surgeRemaining>0?text('flowActive',{seconds:Math.ceil(c.surgeRemaining)}):c.ready?T.flowReady:Math.floor(c.flow)+' / '+D.combat.flowMax;if(fill)fill.style.width=c.flow/D.combat.flowMax*C.percentage+'%';if(swap){swap.hidden=!w.reserve;swap.disabled=c.swapRemaining>0||!!s.onlineContext?.duel;swap.title=c.swapRemaining>0?text('gearSwapWait',{seconds:Math.ceil(c.swapRemaining)}):T.gearSwap;}if(tool){tool.hidden=!c.toolId;tool.disabled=c.toolAt>s.time||!s.supplies[c.toolId];tool.title=c.toolId?find(DB.consumables,c.toolId).name:T.tool;}if(surge){surge.disabled=!c.ready||G.mapDef().group===D.combat.disabledGroup;surge.classList.toggle('ready',!surge.disabled);}const stage=$('play-stage');if(stage)stage.classList.toggle('is-surge',c.surgeRemaining>0);
 const run=G.riftStatus().run;if(run&&run.map===s.mapId){const objective=$('map-objective');if(objective){objective.hidden=false;objective.textContent=text(run.complete?'riftClear':'riftRemaining',{depth:run.depth,count:run.remaining});}if($('quest-title'))$('quest-title').textContent=text('riftFloor',{depth:run.depth});if($('quest-line'))$('quest-line').textContent=run.complete?T.riftReward:T.riftObjective;if($('quest-route'))$('quest-route').textContent=find(D.rift.routes,run.route).name;}
}
window.RPGGrowthUI={open,refresh:()=>open(tab),body,weaponBody,refineBody,riftBody,projectBody,handleAction,onResult,updateHUD};
})();
</script><script>/* Playable world shell, persistent RPG menus and keyboard / touch movement. */

let journalTab='quests',questFilter='all',questPage=0,regionFilter=null,expeditionRule=DB.expeditionRules[0].id;
const keys=new Set(),stick={x:0,y:0};let preferences={music:DB.audio.music,effects:DB.audio.effects,musicVolume:C.musicVolume,effectVolume:C.effectVolume};try{preferences={...preferences,...JSON.parse(localStorage.getItem(C.prefsKey)||'{}')};}catch{}

function icon(id){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${DB.theme.icons[id]||DB.theme.icons.signature}</svg>`;}
function button(action,label,data={},cls='',disabled=false){return `<button data-action="${action}" ${Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')} class="${cls}" ${cls.includes('icon-button')?`aria-label="${esc(T[action]||action)}"`: ''} ${disabled?'disabled':''}>${label}</button>`;}
function tag(label,cls=''){return `<span class="tag ${cls}">${esc(label)}</span>`;}
function num(v){return Number(Number(v).toFixed(C.decimalDigits));}
function statValue(key,value){if(DB.percentStats.includes(key))return num(value*C.percentage)+'%';if(DB.multiplierStats.includes(key))return num(value)+'×';return String(num(value));}
function changeValue(ch){const value=ch.op==='multiply'?(ch.value-1)*C.percentage:ch.value*(DB.percentStats.includes(ch.stat)?C.percentage:1);return (value>0?'+':'')+num(value)+(ch.op==='multiply'||DB.percentStats.includes(ch.stat)?'%':'');}
function changes(list){return `<ul class="effect-list">${list.map(ch=>{const delta=(ch.op==='multiply'?ch.value-1:ch.value)*(DB.statDirections[ch.stat]||1);return `<li class="${delta>=0?'positive':'negative'}"><span>${esc(DB.statLabels[ch.stat])}</span><strong>${esc(changeValue(ch))}</strong></li>`;}).join('')}</ul>`;}
function toast(value,bad=false){if(!value)return;clearTimeout(toastTimer);$('toast').textContent=value;$('toast').className='toast visible'+(bad?' bad':'');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),C.noticeTime*C.milliseconds);}
function result(r,refresh=false){if(!r?.ok){toast(r?.message||T.locked,true);return false;}if(r.message)toast(r.message);save();if(refresh)refreshModal();updateHUD();return true;}
function save(){if(!G.state()||window.RPGOnline?.isActive())return;try{localStorage.setItem(C.storageKey,JSON.stringify(G.snapshot()));}catch{}}
function clearInput(){window.RPGOnline?.stopInput();keys.clear();stick.x=0;stick.y=0;joystickPointer=null;G.setInput(0,0);const knob=$('joystick-knob');if(knob)knob.style.transform='translate(0,0)';}
function openModal(kind,title,body,wide=false){modalKind=kind;clearInput();$('modal').className='modal '+(wide?'wide':'')+' modal-'+kind;$('modal').innerHTML=`<div class="modal-heading"><div><small>${esc(DB.meta.title)} · ${esc(window.RPGOnline?.isActive()?T.onlineLive:T.paused)}</small><h2 id="modal-title">${esc(title)}</h2></div>${button('close',icon('close'),{},'icon-button close-button')}</div><div id="modal-scroll" class="modal-scroll">${body}</div>`;$('modal-backdrop').hidden=false;requestAnimationFrame(()=>$('modal').querySelector('button:not(:disabled),input')?.focus());}
function closeModal(){modalKind=null;$('modal-backdrop').hidden=true;clearInput();$('world')?.focus({preventScroll:true});}
function showTitle(){scene='title';renderer=null;closeModal();const s=G.state();$('app').innerHTML=`<main class="title-page"><div class="title-landscape"><div class="title-sun"></div><div class="title-hills"></div><div class="title-castle">${icon('home')}</div></div><section class="title-card"><span class="eyebrow">${esc(T.titleTag)}</span><div class="brand-seal">${icon('brand')}</div><h1>${esc(DB.meta.title)}</h1><h2>${esc(DB.meta.subtitle)}</h2><p>${esc(DB.world.body)}</p><div class="title-actions">${button('online-open',`${icon('online')}${esc(T.online)}`,{},'primary online-start')}${s?button('continue',`${icon('resume')}<span>${esc(T.continue)}<small>${esc(s.name)} · ${esc(T.level)}${s.level} · ${esc(DB.maps[s.mapId].name)}</small></span>`,{},'primary'):''}${button('new',`${icon('plus')}${esc(T.newGame)}`,{},s?'':'primary')}${button('settings',`${icon('settings')}${esc(T.settings)}`)}</div><small class="title-control">${esc(T.autoCombat)}</small></section></main>`;}
function showCreation(){scene='create';closeModal();const race=find(DB.races,selectedRace),ch=find(DB.classes,selectedClass),st=G.previewCharacter(race.id,ch.id);$('app').innerHTML=`<main class="creation-page"><header class="creation-heading"><div><span class="eyebrow">${esc(DB.meta.title)} · ${esc(T.newAdventure)}</span><h1>${esc(T.createTitle)}</h1><p>${esc(T.createHint)}</p></div>${button('title',`${icon('home')}${T.back}`)}</header><div class="creation-layout"><section class="create-options parchment"><h2>${esc(T.selectRace)}</h2><div class="race-grid">${DB.races.map(r=>button('race',`<span>${window.RPGArt.heroPortrait(r.id,selectedClass)}</span><strong>${esc(r.name)}</strong><small>${esc(r.tag)}</small>`,{id:r.id},r.id===selectedRace?'selected':'')).join('')}</div><h2>${esc(T.selectClass)}</h2><div class="class-grid">${DB.classes.map(c=>button('class',`${icon(c.icon)}<span><strong>${esc(c.name)}</strong><small>${esc(c.role)}</small></span>`,{id:c.id},c.id===selectedClass?'selected':'')).join('')}</div></section><aside class="character-preview parchment"><div class="character-portrait">${window.RPGArt.heroPortrait(race.id,ch.id,C.titlePreviewScale)}</div><span class="eyebrow">${esc(race.name)} · ${esc(ch.name)}</span><h2>${esc(ch.name)}</h2><p>${esc(ch.description)}</p><div class="base-stats">${['hp','mp','attack','spell','speed','defense'].map(key=>`<span>${esc(DB.statLabels[key])}<strong>${esc(statValue(key,st[key]))}</strong></span>`).join('')}</div><div class="race-trait"><strong>${esc(race.name)}</strong><p>${esc(race.description)}</p>${changes(race.stats)}</div><label class="name-input">${esc(T.name)}<input id="character-name" maxlength="${C.nameLength}" value="${esc(characterName)}" placeholder="${esc(T.namePlaceholder)}"></label>${button('start',`${icon('fight')}${esc(T.start)}`,{},'primary full')}<small>${esc(T.autoCombat)}</small></aside></div></main>`;}
function startGame(){if(!result(G.create(selectedRace,selectedClass,characterName)))return;save();showGame();toast(T.characterCreated);}
function showGame(){scene='game';closeModal();const s=G.state(),ch=find(DB.classes,s.classId);$('app').innerHTML=`<div class="game-layout"><header class="game-header"><button class="hero-header hero-status-button" data-action="stats" title="${esc(T.statsPanel)}"><span class="hero-mini">${window.RPGArt.heroPortrait(s.raceId,s.classId)}</span><div><strong>${esc(s.name)} <b id="hero-level"></b></strong><small>${esc(find(DB.races,s.raceId).name)} · ${esc(ch.name)}</small></div></button><div class="vitals"><div class="vital hp"><span>${esc(T.hp)}</span><div class="meter"><i id="hp-fill"></i></div><b id="hp-number"></b></div><div class="vital mp"><span>${esc(T.mp)}</span><div class="meter"><i id="mp-fill"></i></div><b id="mp-number"></b></div><div class="xp-meter"><i id="xp-fill"></i></div><div id="blessing-indicator" class="blessing-indicator" hidden>${icon('heart')}<span id="blessing-name"></span><b id="blessing-time"></b></div></div><div class="location-header"><strong id="map-name"></strong><small id="map-status"></small></div><div class="header-buttons">${button('online-open',icon('online'),{},'icon-button')}${button('help',icon('quest'),{},'icon-button')}${button('fullscreen',icon('fullscreen'),{},'icon-button')}${button('settings',icon('settings'),{},'icon-button')}</div></header><main id="play-stage" class="play-stage"><canvas id="world" tabindex="0" aria-label="${esc(T.controls)}"></canvas><button class="quest-tracker" data-action="quests"><small>${icon('quest')}<span id="quest-type"></span></small><strong id="quest-title"></strong><span id="quest-line"></span><em id="quest-route"></em></button><button class="minimap" data-action="map" aria-label="${esc(T.map)}"><canvas id="minimap"></canvas><span>${icon('map')}<b id="mini-name"></b></span></button><div id="boss-hud" class="boss-hud" hidden><div><strong id="boss-name"></strong><small id="boss-health"></small></div><div class="meter"><i id="boss-fill"></i></div></div><div id="map-objective" class="map-objective" hidden></div><div id="loot-feed" class="loot-feed"></div><button id="online-status" class="online-status" data-action="online-open">${esc(T.online)}</button><div id="online-party-hud" class="online-party-hud" hidden></div><div id="world-notices" class="world-notices" role="status"></div><div id="joystick" class="joystick" aria-label="${esc(T.mobileControls)}"><span></span><b id="joystick-knob"></b></div><div class="quick-actions">${dashButton()}${button('potion',`${icon('potion')}<strong id="potion-count"></strong><small>${esc(keyLabel('potion'))}</small><i id="potion-cooldown"></i>`,{},'potion-button')}${button('interact',`<span class="interact-key">${esc(keyLabel('interact'))}</span><span><strong id="interaction-name"></strong><small id="interaction-action"></small></span>`,{},'interact-button')}</div><div class="growth-combat-strip"><button class="flow-widget" data-action="flow-help" aria-label="${esc(T.flowGuide)}"><small>${T.flow} ⓘ</small><b id="flow-number"></b><span class="flow-track"><i id="flow-fill"></i></span></button>${button('swap-weapon',icon('compare')+'<small>'+DB.controlLabels['swap-weapon']+'</small>',{},'growth-utility',true).replace('<button ','<button id="weapon-swap" title="'+T.swapWeapon+'" hidden ')}${button('use-tool',icon('bait')+'<small>'+DB.controlLabels['use-tool']+'</small>',{},'growth-utility',true).replace('<button ','<button id="field-tool" title="'+T.tool+'" hidden ')}${button('surge',icon('fight')+'<small>'+DB.controlLabels.surge+'</small>',{},'growth-utility',true).replace('<button ','<button id="surge-action" title="'+T.surgeHint+'" ')}</div></main><footer class="game-footer"><nav>${[['inventory','bag',T.bag],['talents','training',T.talents],['journey','anvil',T.journey],['quests','quest',T.quests],['map','map',T.map]].map(([action,id,label])=>button(action,`${icon(id)}<span>${esc(label)}</span>${action==='talents'?'<b id="point-count"></b>':''}`,{},'footer-button')).join('')}</nav><div id="auto-skills" class="auto-skills"></div><div class="footer-wallet">${icon('coins')}<strong id="gold-count"></strong></div></footer></div>`;renderer=new window.RPGRenderer($('world'),$('minimap'));bindJoystick();updateHUD();renderer.render(1);save();}
function updateHUD(){if(scene!=='game'||!$('world'))return;const s=G.state(),p=s.player,st=G.stats(),map=G.mapDef();$('play-stage').dataset.kind=map.kind;$('hero-level').textContent=T.level+s.level+(s.masteryLevel?' · '+T.mastery+' '+s.masteryLevel:'');for(const key of ['hp','mp']){$(key+'-fill').style.width=Math.max(0,p[key]/st[key]*C.percentage)+'%';$(key+'-number').textContent=Math.ceil(p[key])+' / '+st[key];}$('xp-fill').style.width=(s.level>=C.maxLevel?s.masteryXp/G.masteryNeeded()*C.percentage:s.xp/G.xpNeeded()*C.percentage)+'%';$('map-name').textContent=map.name;$('mini-name').textContent=map.name+' · '+G.worldPhase().label;$('map-status').title=T.nightHint;$('map-status').textContent=DB.mapKinds[map.kind]+' · '+G.worldPhase().label+' · '+(map.kind==='town'?T.safe:G.inCombat()?T.combat:T.explore);$('gold-count').textContent=s.gold;$('point-count').textContent=s.points||'';$('point-count').hidden=!s.points;$('potion-count').textContent=s.potions;updateStatus();$('potion-cooldown').style.height=Math.max(0,(p.potionAt-s.time)/C.potionCooldown*C.percentage)+'%';const nearby=G.nearby();$('interaction-name').textContent=nearby?nearby.label:T.interact;$('interaction-action').textContent=nearby?nearby.kind==='npc'?DB.npcTypes[nearby.service].name:nearby.kind==='portal'?T.enter:nearby.kind==='chest'?T.open:nearby.kind==='discovery'?T.discover:nearby.kind==='event'?T.worldEvent:nearby.kind==='mechanism'?T.mechanism:T.gather:T.noInteraction;$('play-stage').classList.toggle('has-context',!!nearby);const track=G.trackedQuest();$('quest-type').textContent=track?.quest.main?T.mainQuest:T.sideQuest;$('quest-title').textContent=track?.quest.name||T.storyComplete;$('quest-line').textContent=track?.line||DB.world.goal;const route=track?.map?G.routeTo(track.map):[];$('quest-route').textContent=route.length?T.routeNext+' · '+route[0].name:track?.status==='ready'?T.readyToClaim:map.name;const boss=G.instance().enemies.find(e=>DB.monsters[e.template].boss&&!e.dead);$('boss-hud').hi const statPercent=key=>DB.percentStats.includes(key)||DB.multiplierStats.includes(key);
const statAmount=(key,value)=>value*(statPercent(key)?C.percentage:1);
const intStat=(key,value)=>Math.round(statAmount(key,value)).toLocaleString('ko-KR')+(statPercent(key)?'%':'');
function deltaStat(key,value){
 const amount=statAmount(key,value),label=Math.round(Math.abs(amount)).toLocaleString('ko-KR')+(statPercent(key)?'%':'');
 return (amount>0?'+':'−')+(Math.round(Math.abs(amount))?label:T.statLess+(statPercent(key)?' %':''));
}
function comparison(after,before=G.stats(),title=T.compare){
 const keys=Object.keys(DB.statLabels).filter(k=>Number.isFinite(after[k])&&Number.isFinite(before[k])&&Math.abs(after[k]-before[k])>Number.EPSILON);
 return `<section class="comparison"><h4>${icon('compare')}${esc(title)}</h4>${keys.map(k=>{
  const delta=after[k]-before[k],deltaLabel=esc(deltaStat(k,delta));
  return `<div><span>${esc(DB.statLabels[k])}</span><small>${intStat(k,before[k])}</small><i>→</i><strong>${intStat(k,after[k])}</strong><b class="${delta*(DB.statDirections[k]||1)>0?'positive':'negative'}">${deltaLabel}</b></div>`;
 }).join('')||`<small>${esc(T.noChange)}</small>`}</section>`;
}

function rewardHTML(reward){return `<div class="quest-rewards">${reward.gold?`<span>${icon('coins')}+${reward.gold}</span>`:''}${reward.xp?`<span>+${reward.xp} ${T.xp}</span>`:''}${reward.points?`<span>+${reward.points} ${T.points}</span>`:''}${reward.potions?`<span>${icon('potion')}+${reward.potions}</span>`:''}${Object.entries(reward.materials||{}).map(([id,n])=>`<span>${esc(find(DB.materials,id).name)} +${n}</span>`).join('')}${Object.entries(reward.supplies||{}).map(([id,n])=>`<span>${esc(find(DB.consumables,id).name)} +${n}</span>`).join('')}${Object.entries(reward.reputation||{}).map(([id,n])=>`<span>${esc(find(DB.factions,id).name)} +${n}</span>`).join('')}${reward.companion?`<span>${T.companions} · ${esc(find(DB.companions,reward.companion).name)}</span>`:''}</div>`;}
function questCard(q,atNpc=false){const status=G.questStatus(q.id),r=G.state().quests[q.id],ready=status==='ready',available=status==='available';return `<article class="quest-card ${ready?'ready':''}"><header><span>${tag(q.main?T.mainQuest:q.repeatable?T.repeatable:T.sideQuest)}</span><h3>${esc(q.name)}</h3>${tag(T[status]||T.active,ready?'positive':'')}</header><p>${esc(q.description)}</p><ul>${q.objectives.map((o,i)=>`<li><span>${esc(o.label)}</span><strong>${status==='complete'?o.count:available?0:G.objectiveProgress(q,i)} / ${o.count}</strong></li>`).join('')}</ul>${rewardHTML(q.rewards)}${r?.choice?tag(T.choiceSaved+' · '+q.choices.find(c=>c.id===r.choice)?.name):''}${atNpc&&available?button('accept',T.accept,{id:q.id},'primary'):atNpc&&ready?q.choices?`<strong>${T.choiceReward}</strong><div class="reward-choices">${q.choices.map(c=>button('claim',`<strong>${esc(c.name)}</strong><small>${esc(c.description)}</small>`,{id:q.id,choice:c.id},'')).join('')}</div>`:button('claim',T.claim,{id:q.id},'primary'):status==='cooling'?`<small>${G.text('questCooldown',{time:Math.ceil((r.completedAt||0)+(q.cooldown||C.questRepeatCooldown)-G.state().time)})}</small>`:status!=='complete'?button('quest-map',ready?T.returnNpc:T.moveTo,{id:q.id}):''}</article>`;}
function questBody(){const s=G.state(),tabs=`<nav class="filter-tabs journal-tabs">${DB.journalTabs.map(t=>button('journal-tab',t.name,{id:t.id},journalTab===t.id?'selected':'')).join('')}</nav>`;if(journalTab==='companions')return tabs+companionsBody();if(journalTab==='factions')return tabs+factionBody();if(journalTab==='codex')return tabs+codexBody();const list=DB.quests.filter(q=>['active','ready','available','cooling'].includes(G.questStatus(q.id))&&(q.main||G.questStatus(q.id)!=='available')&&(questFilter==='all'||questFilter==='main'&&q.main||questFilter==='side'&&!q.main&&!q.repeatable||questFilter==='repeat'&&q.repeatable)),pages=Math.max(1,Math.ceil(list.length/C.questListPage));questPage=Math.min(questPage,pages-1);return tabs+`<p class="muted-note">${T.journalHint}</p><nav class="filter-tabs">${[['all',T.questFilterAll],['main',T.questFilterMain],['side',T.questFilterSide],['repeat',T.questFilterRepeat]].map(([id,label])=>button('quest-filter',label,{id},questFilter===id?'selected':'')).join('')}</nav><div class="quest-journal">${list.slice(questPage*C.questListPage,(questPage+1)*C.questListPage).map(q=>questCard(q,G.nearby()?.id===q.npc&&G.nearby()?.kind==='npc')).join('')||`<p>${T.questEmpty}</p>`}</div><div class="pagination">${button('quest-page',T.previous,{index:questPage-1},'',questPage===0)}<small>${questPage+1} / ${pages}</small>${button('quest-page',T.next,{index:questPage+1},'',questPage>=pages-1)}</div><details class="completed-list"><summary>${T.completedQuests} · ${DB.quests.filter(q=>!q.repeatable&&G.questStatus(q.id)==='complete').length}/${DB.quests.filter(q=>!q.repeatable).length}</summary>${DB.quests.filter(q=>!q.repeatable&&G.questStatus(q.id)==='complete').map(q=>`<p>${icon('check')}${esc(q.name)}${s.choices[q.id]?' · '+esc(q.choices?.find(c=>c.id===s.choices[q.id])?.name):''}</p>`).join('')}</details>`;}

function companionsBody(){const s=G.state();return `<p>${T.companionHint}</p><div class="companion-grid">${DB.companions.map(c=>{const unlocked=s.companions[c.id]?.unlocked,on=s.companionId===c.id;return `<article class="service-card"><span class="companion-portrait">${icon(c.mode==='heal'?'heart':c.mode==='shield'?'shield':'staff')}</span><small>${esc(c.role)}</small><h3>${esc(c.name)}</h3><p>${esc(c.description)}</p>${changes(c.stats)}${unlocked?`<small>${T.bond} ${s.companions[c.id].bond||0}/${C.companionBondCap}</small>${button('select-companion',on?T.companionActive:T.companionSelect,{id:c.id},on?'':'primary',on||G.mapDef().kind!=='town')}`:`<small>${T.companionLocked}</small>${button('quest-map',T.moveTo,{id:c.quest})}`}</article>`;}).join('')}</div>${button('select-companion',T.companionNone,{id:''},'full',!s.companionId||G.mapDef().kind!=='town')}`;}

function arenaBody(){const s=G.state(),run=s.trial,def=run&&find(DB.trials,run.id);if(def&&G.mapDef().id===def.map)return `<div class="service-card"><h3>${esc(def.name)}</h3><p>${T.wave} ${Math.min(run.wave+1,def.waves.length)}/${def.waves.length}</p><p>${T.trialExit}</p>${rewardHTML(def.rewards)}${run.phase==='ready'?button('claim-trial',T.trialClaim,{},'primary'):run.phase==='claimed'?tag(T.trialClaimed,'positive'):button('close',T.resume,{},'primary')}</div>`;return `${wallet()}<div class="trial-grid">${DB.trials.map(t=>`<article class="service-card"><h3>${esc(t.name)}</h3><small>${T.level}${t.minLevel} · ${t.waves.length} ${T.wave}</small><p>${esc(t.description)}</p>${rewardHTML(t.rewards)}${button('start-trial',`${T.trialStart} · ${t.fee} ${T.gold}`,{id:t.id},'primary',s.level<t.minLevel||s.gold<t.fee)}</article>`).join('')}</div>`;}

function mapBody(){const s=G.state(),track=G.trackedQuest();regionFilter??=DB.regions.find(r=>r.maps.includes(s.mapId))?.id||'east';return `<nav class="filter-tabs">${[{id:'all',name:T.allRegions},...DB.regions].map(r=>button('map-region',r.name,{id:r.id},regionFilter===r.id?'selected':'')).join('')}</nav><p>${esc(T.travelHint)}</p><div class="world-map-cards">${Object.values(DB.maps).filter(m=>regionFilter==='all'||find(DB.regions,regionFilter)?.maps.includes(m.id)).map(map=>{const visited=s.visited[map.id],current=map.id===s.mapId,target=mapFocus===map.id||track?.map===map.id,route=G.routeTo(map.id),gate=Object.values(DB.maps).flatMap(m=>m.portals).find(p=>p.to===map.id&&p.requiresQuest),locked=gate&&s.quests[gate.requiresQuest]?.status!=='complete';return `<article class="map-card ${current?'current':''} ${target?'target':''} ${visited?'visited':''}"><span>${icon(map.kind==='town'?'home':map.kind==='field'?'tree':map.kind==='boss'?'signature':'portal')}</span><div><small>${esc(DB.mapKinds[map.kind])} · ${T.level}${map.level}</small><h3>${esc(map.name)}</h3><p>${esc(current?T.currentLocation:locked?G.text('requiresQuest',{quest:find(DB.quests,gate.requiresQuest).name}):route.length?T.routeNext+' · '+route[0].name:T.walking)}</p></div>${map.waypoint?button('travel',current?T.currentLocation:visited?T.travel:T.unvisited,{id:map.id},visited&&!current?'primary':'',current||!visited||!G.canTravel().ok):tag(visited?T.complete:T.unvisited)}</article>`;}).join('')}</div>${explorationLog()}`;}

function legacySmithBody(){if(smithTab==='engrave')return runeSmithBody();const s=G.state();if(smithTab==='enhance'&&find(DB.items,s.inventory.find(i=>i.id===selectedItem)?.template)?.slot==='weapon')selectedItem=s.equipment.armor;if(!s.inventory.some(i=>i.id===selectedItem))selectedItem=s.equipment.armor;const item=s.inventory.find(i=>i.id===selectedItem),cost=item&&G.upgradeCost(item),maxed=item&&item.enhance>=C.upgradeMax;return `<p>${esc(T.smithHint)}</p>${smithTab==='enhance'?`<div class="smith-layout"><section class="bag-grid smith-items">${s.inventory.filter(i=>find(DB.items,i.template).slot!=='weapon').sort((a,b)=>G.itemScore(b)-G.itemScore(a)).map(i=>itemCard(i,'smith-item')).join('')}</section><aside class="smith-detail">${item?`<span class="eyebrow">${T.enchantLevel} ${item.enhance} / ${C.upgradeMax}</span><h3>${esc(G.itemName(item))}</h3>${changes(G.itemStats(item))}${!maxed?comparison(G.previewItem({...item,enhance:item.enhance+1}),G.previewItem(item),T.upgradePreview):''}<p>${esc(T.upgradeHint)}</p>${button('upgrade',maxed?T.maxUpgrade:`${T.upgrade} · ${cost.gold} ${T.gold} / ${cost.ore} ${find(DB.materials,'ore').name}`,{id:item.id},'primary full',maxed||s.gold<cost.gold||s.materials.ore<cost.ore)}`:''}</aside></div>`:`<div class="recipe-grid">${DB.recipes.filter(r=>!r.classes||r.classes.includes(s.classId)).map(r=>`<article class="recipe-card"><span>${icon('anvil')}</span><h3>${esc(r.name)}</h3><p>${esc(r.description||find(DB.items,r.item).description)}</p>${r.reputation?`<small>${Object.entries(r.reputation).map(([id,n])=>esc(find(DB.factions,id).name)+' '+n).join(' · ')}</small>`:''}<div class="recipe-cost"><span>${r.gold} ${T.gold}</span>${Object.entries(r.materials).map(([id,n])=>`<span>${esc(find(DB.materials,id).name)} ${n}</span>`).join('')}</div>${button('craft',s.level<(r.minLevel||1)?G.text('craftLevelGate',{level:r.minLevel}):T.craft,{id:r.id},'primary',s.level<(r.minLevel||1)||!G.reputationAllowed(r.reputation)||s.gold<r.gold||Object.entr function npcBody(){const n=currentNpc,s=G.state();if(n.service==='rift')return window.RPGGrowthUI.riftBody();if(n.service==='arena')return arenaBody();if(n.service==='companion'){const c=DB.companions.find(c=>c.npc===n.id);return s.companions[c.id]?.unlocked?companionsBody():questCard(find(DB.quests,c.quest),true);}if(n.service==='guild'||n.service==='board'){const list=DB.quests.filter(q=>q.npc===n.id&&['active','ready','available','cooling'].includes(G.questStatus(q.id)));return `<p>${esc(n.service==='guild'?DB.world.goal:T.journalHint)}</p><div class="quest-journal">${list.map(q=>questCard(q,true)).join('')||`<p>${T.noOffers}</p>`}</div>`;}if(n.service==='smith')return smithBody();if(n.service==='merchant')return shopBody();if(n.service==='inn')return `${wallet()}<div class="service-card">${icon('home')}<h3>${T.rest}</h3><p>${T.restHint}</p>${button('rest',G.text('restPaid',{gold:DB.inn.restCost}),{},'primary',s.gold<DB.inn.restCost)}</div><div class="service-card"><h3>${DB.inn.name}</h3><p>${DB.inn.description}</p>${changes(DB.inn.stats)}${button('meal',`${T.meal} · ${DB.inn.cost} ${T.gold}`,{},'primary',s.gold<DB.inn.cost)}</div>`;if(n.service==='temple')return `${wallet()}${blessingBody()}${button('talents',T.respec,{},'full')}`;return mapBody();}

async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen({navigationUI:'hide'});if(window.matchMedia('(pointer:coarse)').matches)screen.orientation?.lock?.('landscape').catch(()=>{});}else toast(T.fullscreenUnavailable);renderer?.resize();}catch{toast(T.fullscreenUnavailable);}}
function exportSave(){if(window.RPGOnline?.isActive()){window.RPGOnline.exportSave();return;}if(!G.state())return;save();const blob=new Blob([JSON.stringify(G.snapshot(),null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=T.exportName;a.click();setTimeout(()=>URL.revokeObjectURL(url),C.noticeTime*C.milliseconds);toast(T.saved);}
function bindJoystick(){const zone=$('joystick');if(!zone)return;const update=event=>{const b=zone.getBoundingClientRect(),dx=(event.clientX-b.left-b.width/2)/C.joystickRadius,dy=(event.clientY-b.top-b.height/2)/C.joystickRadius,len=Math.max(1,Math.hypot(dx,dy));stick.x=dx/len;stick.y=dy/len;$('joystick-knob').style.transform=`translate(${stick.x*C.joystickRadius}px,${stick.y*C.joystickRadius}px)`;};zone.addEventListener('pointerdown',event=>{if(modalKind)return;A.unlock();event.preventDefault();joystickPointer=event.pointerId;zone.setPointerCapture(event.pointerId);update(event);});zone.addEventListener('pointermove',event=>{if(event.pointerId===joystickPointer){event.preventDefault();update(event);}});for(const type of ['pointerup','pointercancel','lostpointercapture'])zone.addEventListener(type,()=>{stick.x=0;stick.y=0;joystickPointer=null;$('joystick-knob').style.transform='translate(0,0)';});}
function handleAction(action,el){if(action==='rift-enter'&&$('rift-depth')?.value)el.dataset.index=$('rift-depth').value;const id=el.dataset.id,index=Number(el.dataset.index);if(action.startsWith('online-')){window.RPGOnline?.handleAction(action,el);return;}if(window.RPGOnline?.isActive()){if(['new','confirm-new','import'].includes(action)){toast(T.onlineActionBlocked,true);return;}if(action==='title'){window.RPGOnline.logout();return;}if(DB.online.actionBindings[action]){window.RPGOnline.route(action,el,{id,index,skillSlot,entryPortal,expeditionRule,item:selectedItem,manaId:C.manaConsumable,input:movementInput()});return;}}if(window.RPGGrowthUI?.handleAction(action,el))return;if(action==='close'){closeModal();return;}if(action==='new')askNew();if(action==='confirm-new')showCreation();if(action==='title'){save();showTitle();}if(action==='continue')showGame();if(action==='race'){characterName=$('character-name')?.value||characterName;selectedRace=id;showCreation();}if(action==='class'){characterName=$('character-name')?.value||characterName;selectedClass=id;showCreation();}if(action==='start'){characterName=$('character-name')?.value||characterName;startGame();}if(action==='settings')openSettings();if(action==='help')openModal('help',T.help,`<p>${esc(T.helpBody)}</p><div class="help-controls">${icon('fight')}<strong>${esc(T.controls)}</strong><p>${esc(T.mobileControls)}</p></div>`);if(action==='fullscreen')fullscreen();if(action==='export')exportSave();if(action==='import')$('import-save').click();if(action==='advance')result(G.advance(id),true);if(action==='journal-tab'){journalTab=id;questPage=0;refreshModal();}if(action==='quest-filter'){questFilter=id;questPage=0;refreshModal();}if(action==='quest-page'){questPage=index;refreshModal();}if(action==='map-region'){regionFilter=id;refreshModal();}if(action==='select-companion')result(G.selectCompanion(id),true);if(action==='codex-claim')result(G.claimCodex(id,index),true);if(action==='expedition-rule'){expeditionRule=id;refreshModal();}if(action==='start-trial'){if(result(G.startTrial(id))){closeModal();renderer?.resize();updateHUD();}}if(action==='claim-trial')result(G.claimTrial(),true);if(action==='inventory')openInventory();if(action==='inventory-weapons'){bagFilter='weapon';openInventory();}if(action==='stats')openStats();if(action==='talents')openTalents();if(action==='quests')openQuests();if(action==='map'){mapFocus=null;openMap();}if(action==='potion')result(G.potion());if(action==='manaPotion')result(G.useConsumable(C.manaConsumable));if(action==='dash'){const input=movementInput();G.setInput(input.x,input.y);result(G.dash());}if(action==='use-supply')result(G.useConsumable(id),true);if(action==='shop-filter'){shopFilter=id;refreshModal();}if(action==='discover')result(G.discover(id),true);if(action==='start-event'){if(result(G.startEvent(id))){closeModal();updateHUD();}}if(action==='claim-event')result(G.claimEvent(id),true);if(action==='interact')doInteract();if(action==='item'){selectedItem=id;const item=G.state().inventory.find(i=>i.id===id);if(item)bagFilter=find(DB.items,item.template).slot;openItem();}if(action==='supply-item'){selectedSupply=id;openSupply();}if(action==='bag-filter'){if(id!==bagFilter)selectedItem=null;bagFilter=id;openInventory();}if(action==='equip')result(G.equip(id),true);if(action==='unequip')result(G.unequip(id),true);if(action==='favorite')result(G.favorite(id),true);if(action==='salvage'||action==='sell')result(G.dispose(id,action),true);if(action==='talent-tab'){talentTab=id;refreshModal();}if(action==='learn')result(G.learn(id),true);if(action==='ask-respec')openModal('respec',T.respecConfirm,`<p>${T.respecConfirmHint}</p><div class="button-row">${button('talents',T.cancel)}${button('respec',T.respec,{},'primary')}</div>`);if(action==='respec'){if(result(G.respec()))openTalents();}if(action==='skills'){talentTab='skills';skillSlot=index;openTalents();}if(action==='skill-slot'){skillSlot=index;refreshModal();}if(action==='equip-skill')result(G.equipSkill(skillSlot,id),true);if(action==='accept')result(G.acceptQuest(id),true);if(action==='claim'){const r=G.completeQuest(id,el.dataset.choice);if(result(r,true)&&r.final)victory();}if(action==='quest-map'){const q=find(DB.quests,id),status=G.questStatus(id),npcMap=Object.values(DB.maps).find(m=>m.npcs.some(n=>n.id===q.npc));mapFocus=status==='ready'||status==='available'?npcMap?.id:q.objectives.find((o,i)=>G.objectiveProgress(q,i)<o.count)?.map;regionFilter=DB.regions.find(r=>r.maps.includes(mapFocus))?.id||regionFilter;openMap();}if(action==='travel'){if(result(G.travel(id))){closeModal();updateHUD();}}if(action==='smith-tab'){smithTab=id;refreshModal();}if(action==='smith-item'){selectedItem=id;refreshModal();}if(action==='upgrade')result(G.upgrade(id),true);if(action==='craft')result(G.craft(id),true);if(action==='buy')result(G.buy(id),true);if(action==='rest')result(G.rest(false),true);if(action==='meal')result(G.rest(true),true);if(action==='bless')result(G.bless(id),true);if(action==='enter-dungeon'){if(result(G.enterDungeon(entryPortal,Number(el.dataset.tier),expeditionRule))){closeModal();updateHUD();}}}
document.addEventListener('click',event=>{const el=event.target.closest?.('[data-action]');if(!el||el.disabled)return;A.unlock();A.play('click');handleAction(el.dataset.action,el);});
document.addEventListener('input',event=>{if(event.target.id==='character-name')characterName=event.target.value;if(event.target.dataset.volume){preferences[event.target.dataset.volume]=Number(event.target.value)/C.percentage;A.applyPreferences(preferences);try{localStorage.setItem(C.prefsKey,JSON.stringify(preferences));}catch{}}});
document.addEventListener('change',event=>{const graphics=event.target.dataset.graphics;if(graphics){window.RPGModels.configure({...window.RPGModels.settings(),[graphics]:Number(event.target.value)});preferences.graphics={...window.RPGModels.settings()};try{localStorage.setItem(C.prefsKey,JSON.stringify(preferences));}catch{}return;}const key=event.target.dataset.pref;if(key){preferences[key]=event.target.checked;A.applyPreferences(preferences);try{localStorage.setItem(C.prefsKey,JSON.stringify(preferences));}catch{}}});
document.addEventListener('keydown',event=>{if(event.target.closest?.('input,textarea,select,[contenteditable=true]'))return;if(event.ctrlKey||event.metaKey||event.altKey)return;if(event.code==='Escape'){event.preventDefault();if(modalKind)closeModal();else if(scene==='game')openSettings();return;}if(scene==='game'&&DB.controls.inventory.includes(event.code)&&!event.shiftKey){event.preventDefault();if(!event.repeat){A.unlock();if(modalKind==='inventory'||modalKind==='item')closeModal();else openInventory();}return;}if(event.key==='Tab'&&modalKind){const nodes=[...$('modal').querySelectorAll('button:not(:disabled),input,select')],first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}if(scene!=='game'||modalKind)return;if(event.ctrlKey||event.metaKey||event.altKey)return;A.unlock();for(const dir of ['up','down','left','right'])if(DB.controls[dir].includes(event.code)){event.preventDefault();keys.add(event.code);return;}if(event.repeat)return;const action=Object.keys(DB.controls).find(k=>DB.controls[k].includes(event.code));if(action){event.preventDefault();handleAction(action,{dataset:{}});}});
$('modal-backdrop').addEventListener('click',event=>{if(event.target===$('modal-backdrop'))closeModal();});
document.addEventListener('keyup',event=>keys.delete(event.code));
$('import-save').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;if(window.RPGOnline?.isActive()){toast(T.onlineActionBlocked,true);event.target.value='';return;}try{const data=JSON.parse(await file.text()),r=G.load(data);if(!r.ok)throw Error(r.message);save();closeModal();showGame();toast(T.loaded);}catch(error){toast(error.message||T.invalidSave,true);}event.target.value='';});
window.addEventListener('resize',()=>renderer?.resize());window.visualViewport?.addEventListener('resize',()=>renderer?.resize());window.addEventListener('blur',clearInput);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{clearInput();save();if(document.hidden)A.suspend();});
function frame(now){requestAnimationFrame(frame);const dt=lastFrame?Math.min(C.maxFrame,(now-lastFrame)/C.milliseconds):0;lastFrame=now;if(scene==='game'&&G.state()){if(window.RPGOnline?.isActive()){window.RPGOnline.step(dt,!modalKind&&!document.hidden?movementInput():{x:0,y:0});}else if(!modalKind&&!document.hidden){const input=movementInput();G.setInput(input.x,input.y);let left=dt;while(left>0){const step=Math.min(C.step,left);G.tick(step);left-=step;}saveClock+=dt;if(saveClock>=C.saveInterval){saveClock=0;save();}}const sounds=[...new Set(G.state().sounds)];G.state().sounds=[];for(const id of sounds)A.play(id);hudClock+=dt;if(hudClock>=C.hudInterval){hudClock=0;updateHUD();}renderer?.render(dt);}A.update(scene==='game'&&G.state()?G.mapDef().music:'town');}
try{const saved=JSON.parse(localStorage.getItem(C.storageKey)||'null');if(saved)G.load(saved);}catch{}
showTitle();requestAnimationFrame(frame);window.RPGUI={comparison,weaponSlots,openModal,closeModal,refreshModal,openWorldInteraction,openInteraction,toast,changes,victory,showTitle,showCreation,showGame,openInventory,openTalents,openQuests,openMap,openNpc,openSettings,updateHUD,handleAction,frame,save,getRenderer:()=>renderer};window.RPGOnline?.init();
})();
